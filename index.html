 the territorial sea.","228":"Customs, fiscal, border and sanitary control is exercised in the contiguous zone, which includes the territorial sea.","229":"The Maritime Administration Directorate in Burgas covers the area from Cape Emine south to the border with Turkey.","230":"According to the official answer, the provisional certificate is issued by the Executive Director of the Maritime Administration.","231":"Between the shore and the designated area jet skis move at no more than 5 knots (about 9 km/h), so as not to endanger swimmers.","232":"Jet skis may not sail close to swimming areas, outside the marked corridors, or within 300 m of the shore where beaches are not guarded. All the prohibitions are correct.","233":"A small vessel's technical fitness is certified by the control coupon or the certificate of fitness. The certificate of registration proves ownership.","234":"A document becomes invalid when it expires or lacks an endorsement, and also when the ship's name or owner changes.","235":"The mandatory life-saving and navigation equipment of small vessels is laid down in Order No. 68 of the Executive Director of the Maritime Administration Executive Agency.","236":"The sailing area is entered in the control coupon or certificate of fitness, because it depends on the vessel's condition and equipment.","237":"The ship's name is chosen by its owner.","238":"The KTK applies to a ship under construction from the moment it is launched.","239":"In Region B the colours are the reverse of Region A: green marks the port side of the channel and red the starboard side, seen in the main direction of travel.","240":"In Region B red is for the starboard side. The conical shape also belongs to starboard marks.","241":"In Region B a red mark shows the starboard side of the channel in the main direction of travel.","242":"A lateral mark with a band of the other colour shows a channel division. In Region B a green mark with a red band and can shape means the preferred channel is to starboard.","243":"A green mark with a red horizontal band in Region B marks a channel division: the preferred channel is to starboard, the secondary one to port.","244":"A spar buoy carries the same colours as a buoy. Green with a red band in Region B means the preferred channel is to starboard.","245":"Under COLREG Rule 21, a flashing light flashes at regular intervals at a rate of 120 or more flashes per minute.","246":"Rule 22: for vessels of 50 m or more the masthead light is visible at 6 miles, and the sidelights, sternlight, towing light and all-round lights at 3 miles.","247":"For vessels of 50 m or more the sidelights are visible at 3 miles. Only the masthead light is 6 miles.","248":"For vessels of 50 m or more the sternlight is visible at 3 miles, like the sidelights.","249":"For vessels of 50 m or more all all-round lights (white, red, green, yellow) are visible at 3 miles.","250":"For vessels from 12 to 50 m the masthead light is visible at 5 miles. The exception is vessels under 20 m, where it is 3 miles.","251":"For vessels from 12 to 20 m the masthead light has a reduced range: 3 miles instead of 5.","252":"For vessels from 12 to 50 m the sidelights, sternlight, towing light and all-round lights are visible at 2 miles.","253":"For vessels from 12 to 50 m the sternlight is visible at 2 miles.","254":"For vessels from 12 to 50 m the towing light is visible at 2 miles, like the sternlight.","255":"For vessels from 12 to 50 m all all-round lights are visible at 2 miles.","256":"For vessels under 12 m the sidelights are visible at 1 mile. All the other lights are 2 miles.","257":"For vessels under 12 m the sternlight is visible at 2 miles. Only the sidelights are 1 mile. In the official file this answer is written twice, and both are accepted here.","258":"For vessels under 12 m all-round lights are visible at 2 miles.","259":"Rule 23: a power-driven vessel underway shows a masthead light, sidelights and a sternlight. A second masthead light is required only from 50 m in length.","260":"In Region B a red mark with a green horizontal band shows a channel division where the preferred channel is to port. It is conical, like starboard marks.","261":"A red mark with a green band in Region B means the preferred channel is to port.","262":"An all-red mark in Region B shows the starboard side of the channel.","263":"A cardinal mark shows on which side of a danger the safe water lies. Its name tells you where to pass: a north mark is passed to the north.","264":"Cardinal marks are placed in one of the four quadrants (north, east, south, west) of the danger and are named after their quadrant.","265":"Cardinal marks show the safe side on which to pass a danger. They are also used to mark a bend, a junction or the end of a shoal.","266":"Every cardinal mark has two cones, one above the other. Their different arrangement shows which of the four marks it is.","267":"The topmarks of cardinal marks are always black. The mark itself is black and yellow.","268":"Two cones pointing up are the north cardinal mark. The points face \"up\", towards the north of the chart.","269":"Two cones base to base (points outwards) are the east cardinal mark.","270":"Two cones pointing down are the south cardinal mark. The points face \"down\", towards the south of the chart.","271":"Two cones point to point are the west cardinal mark. The shape looks like a wine glass.","272":"Cardinal marks are black and yellow. The points of the cones show where the black band is.","273":"Cardinal mark lights are white and quick-flashing. North: continuous; east: 3; south: 6 plus a long flash; west: 9 flashes, like the face of a clock.","274":"Black above and yellow below is the north cardinal mark. Safe water lies to the north of it.","275":"One masthead light and both sidelights mean a power-driven vessel underway, shorter than 50 m, coming towards us.","276":"Two masthead lights, the after one higher than the forward one, and both sidelights: a power-driven vessel longer than 50 m coming towards us.","277":"Rule 23: from 50 m up, a power-driven vessel shows two masthead lights (the after one higher), sidelights and a sternlight.","278":"Two masthead lights mean a vessel over 50 m. The red sidelight is on the port side, so we see its port side and it is moving to our left.","279":"Two masthead lights mean a vessel over 50 m. The green sidelight is on the starboard side, so we see its starboard side and it is moving to the right.","280":"Rule 23: an air-cushion vessel adds a yellow all-round flashing light to the normal lights of a power-driven vessel.","281":"The yellow flashing light gives away an air-cushion vessel. The masthead light and both sidelights show it is coming towards us.","282":"The yellow flashing light gives away an air-cushion vessel. Only the white sternlight is visible, so we are looking at its stern.","283":"A high-intensity all-round flashing red light is shown by a WIG craft (wing-in-ground) when taking off, landing and flying near the surface.","284":"A WIG craft is identified by a high-intensity red flashing light. The yellow flashing light is for an air-cushion vessel.","285":"Rule 23: a power-driven vessel under 7 m with a speed of up to 7 knots may show just one white all-round light.","286":"Rule 24: a towing vessel shows two masthead lights in a vertical line (three if the tow is over 200 m), sidelights, a sternlight and a yellow towing light above the sternlight.","287":"The north cardinal mark is black above and yellow below, with two cones pointing up.","288":"The east cardinal mark is black with a yellow band in the middle. Its cones are base to base.","289":"The south cardinal mark is yellow above and black below, with two cones pointing down.","290":"Black, yellow, black from top to bottom is the east cardinal mark. Safe water lies to the east of it.","291":"Yellow above and black below is the south cardinal mark. Safe water lies to the south of it.","292":"The west cardinal mark is yellow with a black band in the middle. Its cones are point to point.","293":"Yellow, black, yellow from top to bottom is the west cardinal mark. Safe water lies to the west of it.","294":"Cones pointing up and black above yellow: north cardinal mark.","295":"The north mark is recognised by both the topmark and the colours: two cones up, black above yellow.","296":"Cones base to base and black, yellow, black: east cardinal mark.","297":"Cones pointing down and yellow above black: south cardinal mark.","298":"Cones point to point and yellow, black, yellow: west cardinal mark.","299":"The west mark is recognised by the \"wine glass\" of two cones and the black band between two yellow ones.","300":"A towing vessel over 50 m shows the towing masthead lights in a vertical line and another masthead light on the after mast, plus sidelights, a sternlight and a yellow towing light.","301":"Three masthead lights in a vertical line mean a tow longer than 200 m. The extra after masthead light shows the towing vessel is over 50 m.","302":"The diamond is the day shape for towing when the tow is longer than 200 m. Both the towing vessel and the towed vessel hoist it.","303":"With a tow over 200 m, the towed vessel also hoists a diamond where it can best be seen.","304":"Masthead lights in a vertical line are the towing signal. There is no separate after masthead light, so the towing vessel is shorter than 50 m. The green sidelight is on the starboard side, so it is moving to the right.","305":"Three masthead lights in a vertical line mean a tow over 200 m, and one more masthead light aft means a towing vessel over 50 m. The green sidelight shows it is moving to the right.","306":"Two masthead lights in a vertical line: towing by a vessel under 50 m. The red sidelight is on the port side, so it is moving to the left.","307":"When towing alongside, the towing vessel shows two masthead lights in a vertical line and no yellow towing light. The sidelights of both vessels are visible, so they are coming towards us.","308":"The pushing vessel shows two masthead lights in a vertical line, sidelights and a sternlight. The pushed vessel shows sidelights at its forward end. Both sides are visible, so it is coming towards us.","309":"Red, white, red in a vertical line means a vessel restricted in her ability to manoeuvre. Three masthead lights mean a tow over 200 m, and the after masthead light means a towing vessel over 50 m.","310":"From astern you see the white sternlight and the yellow towing light above it. Red, white, red shows the towing vessel is restricted in her ability to manoeuvre.","311":"Rule 24: a towed inconspicuous or partly submerged object shows a white all-round light at the forward and after ends. With a breadth up to 25 m and a length up to 100 m there are no other lights.","312":"An isolated danger mark is placed on a small danger (a rock, a wreck) with navigable water all around it.","313":"An isolated danger mark carries two black spheres, one above the other.","314":"Two black spheres one above the other are the topmark of the isolated danger mark.","315":"An isolated danger mark is black with one or more red horizontal bands.","316":"The light is white, group flashing with two flashes. The two flashes match the two spheres.","317":"Black with a red horizontal band and two black spheres: isolated danger mark.","318":"Black, red, black and two spheres on top: isolated danger mark. It can be passed on either side.","319":"The black colour with a red band and the two spheres identify the isolated danger mark, whatever the buoy's shape.","320":"The isolated danger mark stands on the danger itself. Pass it at a distance, on any side.","321":"A safe water mark shows that there is navigable water all around it. It is placed on the centre line of a fairway or at a harbour approach.","322":"A safe water mark carries one red sphere on top.","323":"A safe water mark has red and white vertical stripes. It is the only mark with vertical stripes.","324":"Red and white vertical stripes: safe water mark. Its shape is spherical, pillar or spar.","325":"Red and white vertical stripes and a red sphere on top mean safe water.","326":"A safe water mark can be passed on any side. As a rule it is left to port.","327":"A spar with red and white vertical stripes and a red sphere is a safe water mark.","328":"The towed partly submerged object is wider than 25 m, so it shows two more white all-round lights at the extremities of its breadth. Four in all.","329":"Over 100 m long, extra white lights are added between the forward and after ones so the distance between lights does not exceed 100 m. Over 25 m wide, there are lights at both extremities of the breadth too.","330":"Rule 25: a sailing vessel shows sidelights and a sternlight, no masthead light. At the masthead it may show red over green all-round lights. Both sides are visible, so it is coming towards us.","331":"A sailing vessel under 20 m may combine the sidelights and sternlight in one combined lantern at the top of the mast.","332":"A cone point down is hoisted by a vessel proceeding under sail with its engine running. Under the rules it counts as a power-driven vessel.","333":"Rule 26: a trawler shows green over white all-round lights. An after masthead light is required when longer than 50 m. The red sidelight shows its port side.","334":"Green over white means a vessel engaged in trawling. No after masthead light means under 50 m. Both sidelights are visible, so it is coming towards us.","335":"Two cones point to point are the day shape of a vessel engaged in fishing.","336":"Green over white means a trawler. Two white lights in a vertical line are the additional signal \"shooting nets\". The green sidelight shows it is moving to the right.","337":"Green over white means a trawler. White over red is the additional signal \"hauling nets\". Both sidelights show it is coming towards us.","338":"Two red lights in a vertical line on a trawler mean the trawl is fast on an obstruction. With no way on there are no sidelights or sternlight.","339":"Green over white means a trawler, two whites in a vertical line mean it is shooting the trawl. Only the sternlight is visible, so we are looking at its stern.","340":"A spar with red and white vertical stripes is a safe water mark.","341":"Special marks do not mark a channel or a danger. They mark objects and areas described in charts and sailing directions: cables, ranges, recreation zones, oceanographic stations.","342":"The topmark of a special mark is a single yellow cross (X).","343":"Special marks are all yellow.","344":"A special mark's light is yellow, with a character different from the other marks.","345":"The yellow cross (X) is the topmark of a special mark.","346":"An all-yellow mark with a yellow cross on top is a special mark.","347":"The yellow colour identifies a special mark, whatever the shape of the buoy.","348":"A yellow spar with a yellow cross is a special mark.","349":"Special marks can be any shape. What decides is the yellow colour.","350":"A yellow spherical buoy with a cross is a special mark. The safe water mark has red and white stripes.","351":"A yellow conical buoy is a special mark. The shape may hint on which side to leave it, but the meaning is special.","352":"Rule 26: a fishing vessel that is not trawling shows red over white all-round lights. If its gear extends more than 150 m, it shows another white light in the direction of the gear.","353":"Red over white means a vessel engaged in fishing, but not trawling. With no sidelights or sternlight it is not making way through the water or is fishing at anchor.","354":"Red over white means a fishing vessel that is not a trawler. The extra white all-round light shows the direction of gear extending more than 150 m.","355":"Red over white with no sidelights: a fishing vessel with no way on. The separate white light shows the direction of nets extending more than 150 m.","356":"Green over white and an after masthead light: a trawler over 50 m. White over red means it is hauling the trawl. The red sidelight shows it is moving to the left.","357":"Green over white and an after masthead light: a trawler over 50 m. Two whites in a vertical line mean it is shooting the trawl. The red sidelight shows it is moving to the left.","358":"A trawler over 50 m (green over white and an after masthead light) hauling its trawl (white over red). Both sidelights show it is coming towards us.","359":"Red over white and a white light towards the gear: a fishing vessel that is not a trawler, with nets extending more than 150 m. Both sidelights show it is coming towards us.","360":"Red over white means a fishing vessel that is not trawling. The white light to one side points to its nets, and the sternlight shows we are looking at its stern.","361":"A trawler over 50 m (green over white and an after masthead light) hauling its trawl (white over red). The green sidelight shows it is moving to the right.","362":"A trawler under 50 m (green over white, no after masthead light) hauling its trawl (white over red). The red sidelight shows it is moving to the left.","363":"Rule 1: the COLREGs apply to all vessels upon the high seas and in all waters connected with them that are navigable by seagoing vessels.","364":"A vessel restricted in her ability to manoeuvre is one whose work prevents her from keeping out of the way: dredging, cable laying, servicing navigation marks, minesweeping, heavy towing.","365":"Rule 3: vessels are \"in sight of one another\" only when one can be seen from the other with the eye. Radar and radio contact do not count.","366":"Rule 3: \"underway\" means a vessel that is not at anchor, not made fast to the shore and not aground. It can be underway without moving.","367":"In the COLREGs \"length\" means length overall. It determines the lights and sound signals.","368":"Rule 7: if the compass bearing of an approaching vessel does not appreciably change, the courses lead to the same point and risk of collision exists.","369":"Rule 9: in a narrow channel, vessels under 20 m, sailing vessels and fishing vessels shall not impede a vessel that can navigate only within the channel.","370":"Rule 34: two prolonged and two short blasts mean \"I intend to overtake you on your port side\". Two short blasts mean \"to port\".","371":"Rule 34: two prolonged and one short blast mean \"I intend to overtake you on your starboard side\". One short blast means \"to starboard\".","372":"Agreement to be overtaken is given with prolonged, short, prolonged, short. It is the letter C in Morse code, \"yes\".","373":"At least five short blasts express doubt about the other vessel's intentions, or that it is not doing enough to avoid collision.","374":"One prolonged blast is given by a vessel nearing a bend or an area where other vessels may be hidden by an obstruction.","375":"A vessel that hears the prolonged blast from round the bend answers with the same: one prolonged blast.","376":"Green over white means a trawler. Two whites in a vertical line mean it is shooting the trawl. The red sidelight is on the port side, so it is moving to the left.","377":"Green over white means a trawler. White over red means it is hauling the trawl. The green sidelight is on the starboard side, so it is moving to the right.","378":"Red over green all-round lights at the masthead are the optional signal of a sailing vessel. The white sternlight is also visible, so we are looking at its stern.","379":"Vessels pair trawling show green over white and may direct a searchlight forward and towards the other vessel. The red sidelight shows they are moving to the left.","380":"Two red lights in a vertical line on a trawler mean the trawl is fast on an obstruction. There are no sidelights, so the vessels have no way on.","381":"The after masthead light shows trawlers over 50 m. The green sidelight is on the starboard side, so they are moving to the right.","382":"Rule 27: a vessel not under command shows two red all-round lights in a vertical line. With no sidelights or sternlight it is not making way through the water.","383":"Two black balls in a vertical line are the day shape of a vessel not under command.","384":"One prolonged blast from round a bend is answered with one prolonged blast.","385":"If the whistles are more than 100 m apart, manoeuvring and warning signals are given on one only, so they are not heard as two signals.","386":"Rule 35: a power-driven vessel making way sounds one prolonged blast at intervals of not more than 2 minutes.","387":"Two prolonged blasts every 2 minutes are sounded by a power-driven vessel that is underway but stopped and not moving through the water.","388":"One prolonged and two short blasts are sounded in fog by all vessels with limited manoeuvrability. One of them is the vessel restricted in her ability to manoeuvre.","389":"One prolonged and two short blasts are also sounded by a vessel not under command.","390":"One prolonged and two short blasts are also sounded by a vessel constrained by her draught.","391":"A sailing vessel also sounds one prolonged and two short blasts in restricted visibility.","392":"A vessel engaged in fishing sounds one prolonged and two short blasts in restricted visibility.","393":"A vessel towing or pushing another vessel sounds one prolonged and two short blasts.","394":"The towed vessel (the last one in the tow, if manned) sounds one prolonged and three short blasts, immediately after the towing vessel's signal.","395":"A vessel at anchor rings the bell rapidly for about 5 seconds every minute. It may add short, prolonged, short on the whistle to warn an approaching vessel.","396":"A vessel aground gives three separate strokes on the bell, then rapid ringing, and again three separate strokes.","397":"Rule 9: a vessel engaged in fishing shall not impede the passage of any other vessel navigating within a narrow channel or fairway.","398":"Rule 9: a vessel under 20 m shall not impede a vessel that can safely navigate only within the narrow channel.","399":"Rule 9: a sailing vessel shall not impede a vessel that can safely navigate only within the narrow channel.","400":"Rule 9: anchoring in a narrow channel is avoided if the circumstances admit, so as not to obstruct traffic.","401":"Rule 10: in a traffic separation scheme a vessel proceeds in the appropriate lane in the general direction of traffic flow for that lane.","402":"Rule 10: a vessel keeps clear of the separation line or zone as far as practicable.","403":"The inshore traffic zone is for local traffic. Rule 10 allows vessels under 20 m to use it instead of the lanes of the scheme.","404":"Sailing vessels may use the inshore traffic zone next to a traffic separation scheme.","405":"Vessels engaged in fishing may also use the inshore traffic zone.","406":"A pilot vessel on pilotage duty adds four short blasts to the normal fog signal.","407":"A vessel restricted in her ability to manoeuvre working at anchor does not ring a bell; she continues to sound one prolonged and two short blasts.","408":"A vessel engaged in fishing at anchor sounds one prolonged and two short blasts instead of the at-anchor signal.","409":"Rule 35: a vessel under 12 m need not give the prescribed signals, but must make some other efficient sound signal at intervals of not more than 2 minutes.","410":"Annex I: the after masthead light is at least 4.5 m higher than the forward one.","411":"The height difference is mandatory. It shows which way the vessel is heading: the lower light is the forward one.","412":"On a vessel from 12 to 20 m the masthead light is at least 2.5 m above the gunwale.","413":"On a vessel over 20 m the forward masthead light is at least 6 m above the hull. If the vessel is wider than 6 m, the height equals the breadth, but need not exceed 12 m.","414":"The sidelights are at a height above the hull not more than 3/4 of the height of the forward masthead light, so that they do not merge with it.","415":"The combined lantern for the sidelights is at least 1 m below the masthead light.","416":"With two anchor lights, the forward one is at least 4.5 m higher than the after one.","417":"The inshore traffic zone may be used by vessels going to or coming from a port, installation or pilot station within it.","418":"The inshore traffic zone may be used to reach an offshore installation or structure located within it.","419":"Any vessel may enter the inshore traffic zone to avoid immediate danger.","420":"As a rule the separation zone is not entered. The exception is vessels engaged in fishing within the zone itself.","421":"The separation zone may be entered or crossed in an emergency to avoid immediate danger.","422":"Rule 10: a vessel engaged in fishing shall not impede the passage of any vessel following a traffic lane.","423":"Rule 10: a vessel under 20 m shall not impede a power-driven vessel following a traffic lane.","424":"Rule 10: a sailing vessel shall not impede a power-driven vessel following a traffic lane.","425":"A vessel not using a traffic separation scheme keeps as far away from it as possible.","426":"Anchoring within a traffic separation scheme or near its terminations is avoided as far as practicable.","427":"Lanes are not crossed without need. When crossing, the heading is as close to a right angle as possible, to spend the shortest time in the lane.","428":"Rule 12: on different tacks, the sailing vessel on the port tack (wind on her port side) keeps out of the way.","429":"On a vessel of 50 m or more the forward anchor light is at least 6 m above the hull.","430":"The masthead lights must be seen one above the other and separate at 1,000 m from the stem in all normal conditions of trim.","431":"The horizontal distance between the two masthead lights is at least half the vessel's length, but need not be more than 100 m.","432":"The forward masthead light is not more than 1/4 of the vessel's length from the stem.","433":"On a vessel of 20 m or more the sidelights are not placed in front of the forward masthead light, but behind it.","434":"The screens are matt black on the inside so they do not reflect the light, and the light is not seen outside its sector.","435":"All day shapes are black: ball, cone, cylinder, diamond.","436":"A ball has a diameter of at least 0.6 m.","437":"A cone has a base diameter of at least 0.6 m and a height equal to the diameter.","438":"A cylinder has a diameter of at least 0.6 m and a height twice the diameter.","439":"A diamond is two cones with a common base. So the diameter is at least 0.6 m and the height is twice that.","440":"Shapes are hung at least 1.5 m apart vertically, so they can be told apart from a distance.","441":"A gun or other explosive signal fired at intervals of about a minute is a distress signal under COLREG Annex IV.","442":"A continuous sounding with any fog-signalling apparatus is a distress signal under COLREG Annex IV.","443":"Rule 12: on the same tack, the sailing vessel to windward keeps out of the way.","444":"The windward side is the side opposite to that on which the mainsail is carried.","445":"Rule 13: the overtaking vessel keeps out of the way of the overtaken one until finally past and clear, whatever kind of vessel it is.","446":"An overtaking vessel is one coming up from more than 22.5° abaft the beam. At night, from there you see only the sternlight.","447":"When in doubt, the vessel assumes she is overtaking and acts as such.","448":"Rule 14: in a head-on situation both vessels turn to starboard and pass port to port.","449":"Rule 15: in a crossing situation, the vessel that has the other on her starboard side keeps out of the way.","450":"Rule 16: the give-way vessel acts early and decisively, with a clear change of course or speed, to keep well clear.","451":"Rule 17: the stand-on vessel keeps her course and speed, so that her actions are predictable.","452":"Rule 18: a vessel engaged in fishing keeps out of the way of a vessel restricted in her ability to manoeuvre and of a vessel not under command.","453":"Rule 18: a vessel not under command is at the top of the order. All others keep out of her way, fishing vessels included.","454":"Under Rule 18, no vessel other than one not under command or restricted in her ability to manoeuvre shall impede a vessel constrained by her draught.","455":"A vessel not under command cannot manoeuvre at all, so according to the official answer even a vessel restricted in her ability to manoeuvre gives way to her.","456":"A continuous sound from a fog-signalling apparatus is a distress signal.","457":"A continuous sound from a fog-signalling apparatus is one of the distress signals in COLREG Annex IV.","458":"Rockets or shells throwing red stars, fired one at a time at short intervals, are a distress signal.","459":"Red star rockets at short intervals are a distress signal under COLREG Annex IV.","460":"Red stars fired one at a time at short intervals mean distress.","461":"SOS in Morse code (three dots, three dashes, three dots) is a distress signal, by whatever method it is sent.","462":"\"Mayday\" spoken on the radiotelephone is a distress signal. The picture in the official file shows a different distress signal: slowly raising and lowering outstretched arms.","463":"Flags N over C of the International Code of Signals mean distress.","464":"A square flag with a ball above or below it is a distress signal.","465":"The flag combination N and C (November, Charlie) means \"I am in distress and require immediate assistance\".","466":"A square flag and a ball, or something resembling a ball, are one of the daytime distress signals.","467":"Flames on a vessel, for example from a burning tar or oil barrel, are a distress signal.","468":"A red parachute rocket or a red hand flare is a distress signal.","469":"An open flame on deck, from a burning container of tar or oil, is a distress signal.","470":"Orange smoke is the daytime distress signal.","471":"Rule 18: a sailing vessel keeps out of the way of a vessel not under command, a vessel restricted in her ability to manoeuvre and a vessel engaged in fishing.","472":"A sailing vessel shall not impede the passage of a vessel constrained by her draught.","473":"A sailing vessel keeps out of the way of a vessel restricted in her ability to manoeuvre.","474":"A sailing vessel keeps out of the way of a vessel engaged in fishing.","475":"A vessel constrained by her draught keeps out of the way of a vessel not under command.","476":"A vessel constrained by her draught keeps out of the way of a vessel restricted in her ability to manoeuvre.","477":"Rule 18: the power-driven vessel is the most manoeuvrable and keeps out of the way of all the others: not under command, restricted in ability to manoeuvre, engaged in fishing and sailing.","478":"A power-driven vessel keeps out of the way of a vessel restricted in her ability to manoeuvre.","479":"A power-driven vessel keeps out of the way of a vessel engaged in fishing.","480":"A power-driven vessel keeps out of the way of a sailing vessel. The exception is when the sailing vessel is overtaking.","481":"Rule 19 applies to vessels not in sight of one another when navigating in or near an area of restricted visibility.","482":"In restricted visibility every vessel proceeds at a safe speed adapted to the conditions.","483":"A power-driven vessel keeps her engines ready for immediate manoeuvre.","484":"Rule 19: if you detect another vessel by radar alone, you first determine whether a close-quarters situation is developing.","485":"Rule 19: when you detect a vessel by radar alone you determine whether risk of collision exists, and if so you take avoiding action in good time.","486":"Rule 19: avoid turning to port when the other vessel is forward of the beam, unless you are overtaking it. The other vessel is expected to turn to starboard.","487":"Slowly and repeatedly raising and lowering outstretched arms is a distress signal.","488":"Anyone can give this signal without any equipment: arms outstretched to the sides are slowly raised and lowered.","489":"The Annex IV signals are used only in distress and need of assistance. Using them for anything else is prohibited.","490":"Any signal that may be confused with a distress signal is also prohibited.","491":"An orange canvas with a black square and circle is a distress signal intended for recognition from the air.","492":"A patch of dye marker in the water is a distress signal and helps an aircraft find the spot.","493":"The IALA system has five kinds of marks: lateral, cardinal, isolated danger, safe water and special.","494":"Lateral marks are red and green. They mark the port and starboard sides of the channel.","495":"A lateral mark's light has the colour of the mark itself: red or green.","496":"Port-hand lateral marks have a cylindrical (can) topmark.","497":"Starboard-hand lateral marks have a conical topmark, point upwards.","498":"The world is divided into two regions. In Region A (Europe, including the Black Sea) red is on the port side; in Region B (the Americas, Japan, Korea, the Philippines) red is on the starboard side.","499":"In Region A (Europe and the Black Sea) red marks the port side of the channel in the main direction of travel. The can shape also belongs to port marks.","500":"In Region A a red mark is for the port side of the channel, whatever the shape of the buoy.","501":"A spar carries the colour of its side. A red spar in Region A is the port side of the main direction of travel.","502":"In Region A green marks the starboard side of the channel. The conical shape also belongs to starboard marks.","503":"Rule 19: when the other vessel is abeam or abaft the beam, avoid turning towards it, because that brings the courses together.","504":"Rule 19: if you hear a fog signal forward of the beam, you reduce speed to the minimum at which the vessel can still be kept on course.","505":"Rule 19: navigate with extreme caution, and if necessary take all way off until the danger of collision is over.","506":"Rule 20: the rules on lights and shapes are complied with in all weathers.","507":"Rule 20: lights are shown from sunset to sunrise.","508":"Rule 20: lights are also shown by day, from sunrise to sunset, in restricted visibility.","509":"Rule 20: lights may also be shown in any other circumstance when it is deemed necessary.","510":"Rule 20: shapes (balls, cones, cylinders, diamonds) are shown by day. At night lights take their place.","511":"The masthead light is white.","512":"The masthead light is placed in the fore-and-aft centreline, i.e. on the vessel's longitudinal axis.","513":"The masthead light shows forward over an arc of 225°: from right ahead to 22.5° abaft the beam on each side.","514":"The green light is on the starboard side, the red one on the port side.","515":"Each sidelight shows over an arc of 112.5°: from right ahead to 22.5° abaft the beam on its own side. Together they cover the masthead light's arc.","516":"The sternlight is white.","517":"The sternlight shows aft over an arc of 135°, 67.5° on each side of the stern. Together with the two sidelights it covers the full 360°.","518":"The towing light is yellow and is carried above the sternlight.","519":"The towing light has the same arc as the sternlight: 135°.","520":"In Region A a green mark indicates the starboard side of the channel in the main direction of travel.","521":"A green spar in Region A is the starboard side of the main direction of travel.","522":"A red mark with a green band in Region A shows a fork: the preferred channel is to starboard. The shape is a can, like the port-hand marks.","523":"A red spar with a green horizontal band in Region A: preferred channel to starboard.","524":"A green mark with a red band in Region A shows a fork: the preferred channel is to port. The shape is conical, like the starboard-hand marks.","525":"Green with a red horizontal band in Region A: preferred channel to port.","526":"A green spar with a red band in Region A: preferred channel to port.","527":"In Region B green is for the port side of the channel. The can shape belongs to port-hand marks in both regions.","528":"Two all-round red lights in a vertical line mean a vessel not under command. The red sidelight is on the port side, so she is making way and moving to the left.","529":"Two reds in a vertical line mean a vessel not under command. The green sidelight is on the starboard side, so she is moving to the right.","530":"Red, white, red in a vertical line means a vessel restricted in her ability to manoeuvre. The two masthead lights show a length over 50 m, and the green sidelight that she is moving to the right.","531":"Only red, white, red, with no masthead lights or sidelights: a vessel restricted in her ability to manoeuvre, not making way through the water.","532":"Red, white, red means restricted in ability to manoeuvre. The masthead lights in a vertical line show that the vessel is towing.","533":"Red, white, red and only one masthead light: a vessel restricted in her ability to manoeuvre, under 50 m. Both sidelights show she is coming towards us.","534":"Two masthead lights in a vertical line are the towing lights. Red, white, red shows that the towing vessel is restricted in her ability to manoeuvre.","535":"Red, white, red with a white sternlight below: a vessel restricted in her ability to manoeuvre, seen from astern.","536":"Ball, diamond, ball is the day signal for restricted ability to manoeuvre. The separate ball is the shape of a vessel at anchor.","537":"The yellow towing light above the white sternlight shows a towing vessel seen from astern. Red, white, red shows she is restricted in her ability to manoeuvre.","538":"A dredger shows red, white, red. Two reds in a vertical line show the side of the obstruction, two greens the side on which it is safe to pass. The white light at the bottom is the sternlight: the dredger is underway.","539":"Two reds in a vertical line are on the side of the obstruction, two greens on the clear side. A dredger at anchor shows these lights instead of anchor lights.","540":"Three all-round green lights, one at the masthead and one at each end of the yard, are shown by a vessel engaged in mine clearance. The two masthead lights mean over 50 m, the red sidelight that she is moving to the left.","541":"The three green lights mean mine clearance. One masthead light means a vessel under 50 m, and the green sidelight that she is moving to the right.","542":"By day a vessel engaged in mine clearance shows three black balls: one at the masthead and one at each end of the yard.","543":"Rule 27: the minesweeper's lights and shapes mean it is dangerous to approach within 1,000 m of her.","544":"Red, white, red means restricted in ability to manoeuvre. The green sidelight is on the starboard side, so we see her starboard side.","545":"Two reds in a vertical line and a white sternlight: a vessel not under command, making way, seen from astern.","546":"Red, white, red and masthead lights in a vertical line: a towing vessel restricted in ability to manoeuvre. The after masthead light shows a length over 50 m, the red sidelight that she is moving to the left.","547":"Red, white, red and two masthead lights in a vertical line: a towing vessel under 50 m, restricted in ability to manoeuvre. The green sidelight shows she is moving to the right.","548":"Ball, diamond, ball in a vertical line is the day signal of a vessel restricted in her ability to manoeuvre.","549":"Red, white, red and a masthead light: a vessel restricted in ability to manoeuvre, underway. The red sidelight is on the port side, so she is moving to the left.","550":"Two reds in a vertical line mean a vessel not under command. The white sternlight shows she is making way and that we see her stern.","551":"Two reds in a vertical line mean a vessel not under command. The green sidelight shows she is making way and that we see her starboard side.","552":"Flag \"A\" of the International Code of Signals (white and blue, swallow-tailed) means: \"I have a diver down; keep well clear at slow speed\".","553":"A small vessel engaged in diving operations shows red, white, red in a vertical line at night, and flag \"A\" by day.","554":"Three all-round red lights in a vertical line are shown by a vessel constrained by her draught. Two masthead lights mean over 50 m, both sidelights that she is coming towards us.","555":"Three reds in a vertical line: a vessel constrained by her draught. Two masthead lights mean over 50 m, and the red sidelight that she is moving to the left.","556":"Three reds in a vertical line and a white sternlight: a vessel constrained by her draught, seen from astern.","557":"Three reds in a vertical line: a vessel constrained by her draught. Two masthead lights mean over 50 m, the green sidelight that she is moving to the right.","558":"Three all-round red lights in a vertical line are the signal of a vessel constrained by her draught.","559":"The black cylinder is the day shape of a vessel constrained by her draught.","560":"Masthead lights and sidelights are shown only when underway. A vessel at anchor shows all-round white lights, a vessel aground adds two reds, and a sailing vessel has no masthead light.","561":"The vessel shows masthead lights and sidelights, so she is underway. The three reds in a vertical line show she is constrained by her draught.","562":"An all-round white light over a red one is shown by a pilot vessel. Both sidelights show she is underway and coming towards us.","563":"White over red means a pilot vessel. The green sidelight is on the starboard side, so she is moving to the right.","564":"White over red means a pilot vessel. The lower white light is the sternlight, so we see her stern.","565":"White over red means a pilot vessel. The red sidelight is on the port side, so she is moving to the left.","566":"White over red means a pilot vessel. The two white anchor lights show she is at anchor and over 50 m in length.","567":"White over red means a pilot vessel. The flashing yellow light is the signal of an air-cushion vessel. One of the answers in the official file has no text, only a picture.","568":"According to the official answer this is the shape of a pilot vessel. At night she is recognised by an all-round white light over a red one.","569":"Rule 30: a vessel at anchor over 50 m shows two all-round white lights, the forward one higher than the after one.","570":"A vessel at anchor under 50 m shows one all-round white light where it can best be seen.","571":"A vessel aground shows her anchor lights and two all-round reds in a vertical line. One white light means a length under 50 m.","572":"A vessel aground: two reds in a vertical line and anchor lights. The two whites show a length over 50 m.","573":"Three black balls in a vertical line are the day shape of a vessel aground.","574":"Rule 30: a vessel under 7 m is exempt from anchor lights and shapes, except when in or near a narrow channel, fairway, anchorage or where other vessels normally navigate.","575":"A fairway is one of the places where even a vessel under 7 m must show anchor lights and a shape.","576":"An anchorage and the area near it are places where even a vessel under 7 m shows anchor lights and a shape.","577":"The exemption for vessels under 7 m does not apply where other vessels normally navigate.","578":"Rule 30: a vessel under 12 m is not required to show the lights and shapes of a vessel aground.","579":"Rule 33: a vessel of 12 m or more has a whistle, and from 20 m also a bell. So for 12 to 100 m the answer is a whistle and a bell.","580":"A vessel of 100 m or more also has a gong. It is sounded at the stern so it can be told apart from the bell in the bow.","581":"Rule 34: one short blast (or flash) means \"I am altering my course to starboard\".","582":"Two short blasts (or flashes) mean \"I am altering my course to port\".","583":"Three short blasts (or flashes) mean \"I am operating astern propulsion\".","584":"Two prolonged and one short blast in a narrow channel: \"I intend to overtake you on your starboard side\".","585":"Prolonged, short, prolonged, short is the reply \"I agree to be overtaken\".","586":"At least five short and rapid blasts express doubt whether the other vessel is taking sufficient action to avoid collision.","587":"You sound one prolonged blast when approaching a bend or an area where another vessel may be hidden behind an obstruction.","588":"One prolonged blast from another vessel in a narrow channel means she is approaching a bend or obstruction and may not see you.","589":"The new danger mark (for example a recent wreck) has blue and yellow vertical stripes and stays in place until the danger is shown on charts.","590":"Three green lights in a triangle mean mine clearance. Two masthead lights mean over 50 m, the red sidelight that she is moving to the left.","591":"On vessels under 12 m the sternlight is visible at 2 miles. Only the sidelights are at 1 mile.","592":"On vessels under 12 m all all-round lights are visible at 2 miles.","593":"A squall is a sudden, brief, sharp increase in the wind, often with a change of direction.","594":"Local signs are observations of the sky, clouds, wind and animals. From them the weather is forecast without instruments.","595":"The bottom and the coast deflect, narrow and speed up currents. Off headlands and in straits the current is stronger.","596":"Near the coast the vessel's position is checked by visible landmarks and by radar. The two methods check each other.","597":"With one landmark the position is found by a bearing and distance (from the landmark's vertical angle), or by a running fix: two bearings of it at different times.","598":"A rhumb line crosses all meridians at the same angle. On a Mercator chart the meridians are parallel, so it is a straight line.","599":"Wave height depends on the wind speed, how long it blows, its direction and the fetch, i.e. the distance over water across which it acts.","600":"According to the official answer the navigational landmark at Cape Galata is the lighthouse with a flashing light.","601":"Aladzha Bank is a shoal off the Golden Sands resort, north of Varna.","602":"According to the official answer the floating mark guards Aladzha Bank from the east, i.e. from the open sea.","603":"Between Cape Ekrene and Albena the coast is low and sandy, with beaches.","604":"Ekrene lighthouse is on the cape of the same name near Kranevo, north of Golden Sands.","605":"Cape Sveti Atanas is at Byala, south of the mouth of the Kamchia river.","606":"Cape Kaliakra is a high rocky cape with sheer reddish cliffs. Its name comes from them.","607":"Cape Emine is where the Balkan Mountains meet the sea: high and steep, with inclined light-coloured rock strata.","608":"Isobaths join points of equal depth. Isogonals are for magnetic variation, isobars are for pressure.","609":"According to the official answer there is a magnetic anomaly in the area of Burgas Bay. There the compass may read inaccurately.","610":"Wind is the movement of air from an area of high pressure to an area of low pressure.","611":"Wind is named after the direction from which it blows. \"Wind comes into the compass, current goes out of it.\"","612":"Wind direction is read in compass points (N, NE, E, etc.).","613":"The Beaufort scale runs from 0 (calm) to force 12 (hurricane). The force can also be given as a speed in metres per second.","614":"An anemometer measures wind speed.","615":"On a moving vessel you measure the relative (apparent) wind. It is the sum of the true wind and the wind created by the vessel's own motion.","616":"Running wind (\"fordewind\") is wind from right astern.","617":"A broad reach (\"bakshtag\") is wind from the quarters, obliquely from astern on the port or starboard side.","618":"A thermograph records temperature continuously on a chart for a day or a week. A barograph does the same for pressure.","619":"Atmospheric pressure is measured with an aneroid barometer.","620":"A psychrometer measures humidity from the difference between a dry and a wet thermometer.","621":"Falling pressure means an approaching depression: wind, cloud and rain.","622":"Steady high pressure means an anticyclone: calm, clear weather for longer.","623":"By day the land heats up faster than the sea. The air over it rises and cooler air from the sea takes its place. At night the breeze reverses.","624":"In fine weather the breeze changes direction regularly: by day from the sea, at night from the land. If this rhythm breaks, a different air mass is arriving and the weather turns bad.","625":"In fine weather the wind eases in the evening. If at sunset it strengthens and veers, a front is approaching and a gale can be expected.","626":"Normally the night is cooler than the day. A warmer night means warm, moist air arriving ahead of a depression, i.e. a deterioration.","627":"This is the normal daily cycle of humidity in clear weather: by day the air warms and dries, in the evening it cools and humidity rises.","628":"\"Red sky in the morning, sailor's warning.\" A purple dawn shows a lot of moisture in the air and an approaching front with wind and rain.","629":"A halo is formed by ice crystals in high cirrus cloud. These usually come ahead of a warm front with rain and wind.","630":"According to traditional signs a red moon at rising foretells wind.","631":"According to local signs, gulls sitting calmly on the water foretell fine weather. Before a storm they head for the shore.","632":"Birds fly high when the air is drying and pressure is rising. So during rain this is a sign of improvement.","633":"The wind rubs against the water surface and transfers its energy to the water particles. This is how wind waves arise.","634":"Waves, like wind, are named after the direction from which they come.","635":"Wave direction is given in compass points, just like wind direction.","636":"The sea state is assessed on a scale from 0 to 9. Wind is on a scale from 0 to 12.","637":"Swell is long, smooth waves that continue after the wind has stopped, or that come from a distant storm.","638":"Surf is waves breaking on the shore itself, especially a steep and rocky one.","639":"Breakers are waves breaking over a shoal or reef away from the shore. The white foam gives away the dangerous spot.","640":"A sea current is the forward horizontal transfer of water masses.","641":"According to the official answer the main causes of currents are the tide-generating forces of the Moon and the Sun. The other answers describe wind-driven currents and influences on currents.","642":"A current is named after the direction towards which it flows: it \"goes out of the compass\". Wind is the opposite, named after the direction it comes from.","643":"The rate of a current is given in metres per second or in knots.","644":"Current direction is given in compass points or in degrees by the circular system, from 0° to 360°.","645":"Drift is the vessel being carried sideways off her course, over the ground, by wind or current.","646":"In fog near the shore speed is reduced, to leave time to react and so the vessel stops in a shorter distance.","647":"In fog the engine must be ready for an immediate change of speed: slowing, stopping or going astern. COLREG Rule 19 also requires this.","648":"According to the official answer, during speed trials the course is kept by the magnetic compass.","649":"The chronometer shows Greenwich time (UTC). It is needed for astronomical calculations and for finding longitude.","650":"According to the official answer Stavro Bank is south-southeast of Cape Pomorie, in Burgas Bay.","651":"A sector light shows different colours in different sectors and so marks the safe approach. According to the official answer there is one on Sveta Anastasia island in Burgas Bay.","652":"The weather and sea bulletin is broadcast on VHF channel 26. Channel 16 is for distress and calling.","653":"The times are given in UTC. Note that this question has only 07.33 and 19.33, while question 6 also has 13.33.","654":"The main Black Sea current circles the sea anticlockwise. Off our coast it flows from north to south.","655":"On Bulgarian nautical charts depths are in metres. The unit is stated in the chart title.","656":"A lead measures depth. A log measures speed and distance run.","657":"An echo sounder measures depth from the time a sound pulse takes to reach the bottom and return. It works continuously and at any speed.","658":"A hand lead is a weight on a line. It is used to about 50 m depth and at speeds up to 3 knots, otherwise the line does not hang vertically.","659":"The lead line is marked with leather marks of different shapes. They can be recognised by touch in the dark.","660":"The base of the weight has a recess that is filled with tallow (arming). The particles that stick to it show the bottom: sand, mud, shells.","661":"The echo sounder's transducer is in the vessel's bottom, so the instrument shows the depth under the keel. For the charted depth the draught is added.","662":"According to the official answer the lead line of a hand lead is 52 metres long.","663":"The chart's meridians point to true north, so true courses are drawn on it. The compass course is then obtained with the compass correction.","664":"The star globe shows only the brightest, navigational stars. The Sun, Moon and planets change position and are marked when needed.","665":"Because light is refracted in the atmosphere we see the Sun higher than it really is. At true sunrise its lower limb appears about 2/3 of a diameter above the horizon.","666":"Visible sunrise is the moment the Sun's upper limb appears on the horizon.","667":"The screens are matt black so they do not reflect light outside the sidelight's sector.","668":"COLREG Rule 6: every vessel proceeds at a safe speed at all times, not only in fog.","669":"In the semicircular system you count from north or south towards east or west, from 0° to 180°.","670":"In the quadrantal system the horizon is in four quadrants (NE, SE, SW, NW). In each you count from 0° to 90° from north or from south.","671":"The compass point system divides the horizon into 32 points: N, NbE, NNE, etc.","672":"360° divided into 32 points gives 11.25° per point.","673":"The true course is the angle between the northern part of the true meridian and the vessel's head, counted clockwise.","674":"An angle that starts at north and ends at the vessel's fore-and-aft line (the direction of her head) is a course. Since it is from the true meridian, it is the true course.","675":"A bearing is the direction from the vessel to an object, measured from north. The true bearing is measured from the true meridian.","676":"The relative bearing is measured from the vessel's head, not from north, to the direction of the object.","677":"The relative bearing is between the vessel's fore-and-aft line and the direction to the object.","678":"The true course is counted by the circular system from 0° to 360°, clockwise from north.","679":"An angle from the northern part of the true meridian to the direction of a landmark is a true bearing.","680":"The chart is oriented to true north, so only true courses and bearings are used on it.","681":"The relative bearing is counted from the bow to port or to starboard, from 0° to 180°.","682":"The landmark is to the right of the bow, so the angle between the bow and the direction to it is a relative bearing to starboard.","683":"Courses and bearings are drawn with a navigational protractor or triangle and parallel rule. Dividers are for measuring distances.","684":"The relative bearing is added to the true course if the object is to starboard and subtracted if it is to port. This gives the true bearing.","685":"The standard magnetic compass is mounted high, away from the ship's iron, and has the least deviation. So its readings are the most accurate.","686":"The magnetic needle settles along the magnetic meridian, in a north–south direction.","687":"The sensitive element is the card with the magnets. It is the part that shows the direction.","688":"Gimbals keep the compass level as the vessel rolls.","689":"The corrector holds magnets and soft iron in the binnacle. They compensate the ship's own magnetic field and reduce deviation.","690":"The compass holds a solution of ethyl alcohol in water. It does not freeze and damps the swinging of the card.","691":"The magnetic poles do not coincide with the geographic ones. That is why the magnetic needle does not point to true north and there is magnetic variation.","692":"Magnetic variation is the angle between the true and the magnetic meridian. It is caused by the Earth's magnetic field.","693":"Variation differs from area to area and changes over the years. It is taken from the chart, where it is given with the annual change.","694":"Isogonals join points of equal magnetic variation. Isobaths are for depths, isobars are for pressure.","695":"Deviation is the deflection of the needle from the magnetic meridian. It is caused by the iron and electrical equipment of the vessel itself.","696":"The card is graduated by the circular system, from 0° to 360°.","697":"Deviation is different for each vessel and each course. It is taken from the compass deviation table.","698":"When the course changes, the ship's iron takes a different position relative to the magnetic meridian, so the deviation changes.","699":"Deviation is determined and the table updated every year, and also after repairs or changes to the vessel.","700":"The total compass correction is the algebraic sum of variation and deviation, each with its sign: easterly is plus, westerly is minus.","701":"ΔC = d + δ, with their signs. It is the total difference between compass north and true north.","702":"The compass shows the compass course. Deviation and variation have not yet been applied to it.","703":"A bearing taken with the magnetic compass is a compass bearing. To plot it on the chart it is corrected by ΔC.","704":"The compass course is corrected by the total correction with its sign to give the true course: TC = CC + ΔC.","705":"The angle is measured from the true meridian (Nи in the picture) to the vessel's head, so it is the true course.","706":"The angle is measured from the magnetic meridian (Nм in the picture) to the vessel's head, so it is the magnetic course.","707":"The angle is measured from the compass meridian (Nк in the picture) to the vessel's head, so it is the compass course.","708":"The angle between the true (Nи) and the compass (Nк) meridian is the total compass correction ΔC.","709":"The angle between the true (Nи) and the magnetic (Nм) meridian is the magnetic variation.","710":"The angle from the true meridian to the direction of the landmark is the true bearing.","711":"The angle from the vessel's head to a landmark on the right is a relative bearing to starboard.","712":"The true course plus the relative bearing to starboard gives the true bearing: TB = TC + RB.","713":"The reciprocal bearing is the direction from the landmark to the vessel. It differs from the direct bearing by 180°.","714":"The angle from the compass meridian (Nк) to the direction of the landmark is the compass bearing.","715":"The reciprocal course is the direction opposite to the vessel's head, i.e. the course plus or minus 180°.","716":"The compass bearing is corrected by the total compass correction, just like the course: TB = CB + ΔC.","717":"The compass and magnetic courses differ only by the deviation δ. Variation d links the magnetic course with the true course, so the answers with d are wrong.","718":"D = 2.08√e gives the distance of the visible horizon. Here e is the observer's height of eye in metres.","719":"On charts the visibility range of lights is calculated for a height of eye of 5 m. For another height a correction is applied.","720":"In the formula the height is in metres and the result comes out in nautical miles.","721":"A landmark is seen from where the two horizons meet: the observer's and the one from the landmark's top. So D = 2.08√e + 2.08√H.","722":"Distances at sea are measured in nautical miles.","723":"A nautical mile is 1,852 metres.","724":"A nautical mile is the length of one minute of arc of the meridian. The adopted value of 1,852 m corresponds to a latitude of about 45°.","725":"A cable is one tenth of a nautical mile, i.e. about 185 metres.","726":"The cable is a unit of distance. It is used for short distances, for example when passing and manoeuvring.","727":"According to the official answer the fathom is not used in modern navigation. It appears on old charts as a measure of depth.","728":"One foot is 0.3048 m. One yard is 0.914 m, one inch is 2.54 cm.","729":"One fathom is 6 feet, i.e. 1.828 m.","730":"One minute of latitude is one nautical mile. That is why distances are measured on the chart's vertical border.","731":"The units for depths and heights are given in the chart title.","732":"A vessel's speed is measured in knots. One knot is one nautical mile per hour.","733":"The distance is taken with dividers and read on the vertical (latitude) border, at the same latitude. The horizontal border does not give miles.","734":"The log measures the vessel's speed through the water.","735":"The log also records the distance run, like the odometer in a car.","736":"One knot is a speed of one nautical mile per hour (1.852 km/h).","737":"Distance = speed × time: 7 knots × 2 hours is 14 nautical miles.","738":"Coastal charts have a suitable scale for navigating near the shore. General charts are for overall planning, and plans are for harbours and bays.","739":"At a scale of 1:150,000 one centimetre corresponds to 150,000 cm, i.e. 1.5 km.","740":"In the Mercator projection the Earth's surface is projected onto a cylinder. Meridians and parallels become straight lines at right angles to each other.","741":"The great circle (orthodrome) is an arc of a great circle and is the shortest route between two points on the globe.","742":"A rhumb line crosses all meridians at the same angle, so it is sailed on a constant course.","743":"Nautical charts are in the Mercator projection, because on it a constant-angle course is a straight line and angles are preserved.","744":"Landmarks ahead or astern are taken first, because their bearing changes slowly. Those near the beam change quickly and are taken last.","745":"The running fix is used when there is only one landmark.","746":"The landmark is observed twice, some time apart. Between the two bearings the course and the distance run by log are noted.","747":"Three bearings rarely meet at one point. They form a small \"cocked hat\" triangle of errors, and the position is taken inside it.","748":"Chart plotting is the graphical keeping of the vessel's track on the chart: courses, distances run and fixes.","749":"According to the official answer good seamanship requires passing at not less than 20 cables (2 miles).","750":"A Racon is a radar transponder beacon. When a ship's radar hits it, it returns a coded signal that appears on the screen as a line behind the mark.","751":"The compass points to the magnetic pole. Between the geographic and magnetic north poles the vessel can sail towards geographic north while the magnetic pole stays behind her.","752":"The tack is named after the side from which the wind comes. Here the wind comes from the starboard side, so the sailing vessel is on starboard tack.","753":"The tack is named after the side from which the wind comes. Here the wind comes from the port side, so the sailing vessel is on port tack.","754":"COLREG is binding on all vessels, including warships and the smallest ones.","755":"This is how a mole is shown: a built structure running out into the sea that protects the harbour from waves.","756":"The arrow shows the direction of the tidal stream, and the number next to it its rate in knots.","757":"This is how a depth is shown that has been reported but not confirmed by survey.","758":"This is the symbol for seaweed. It stops the anchor from holding and can foul the propeller.","759":"This is how rocks that stand above the water are shown. The number in brackets is their height.","760":"This is the symbol for a wreck, part of whose hull can be seen above the water.","761":"This is how the remains of a wreck are shown where only the masts show above the water.","762":"This is how an underwater obstruction is shown. The number is the least depth over it.","763":"This is the symbol for the remains of a wreck that are dangerous to navigation and over which the depth is not known.","764":"This is the symbol for the remains of a wreck with an unknown depth over them.","765":"This is how a platform at sea is shown, for example for gas production, with its name or designation.","766":"The broken circle is a safety zone around an installation at sea. It is not to be entered, usually within 500 m of the installation.","767":"The Earth is slightly flattened at the poles and has an uneven surface. The exact name for its shape is a geoid.","768":"The Earth's mean radius is 6,371 km.","769":"The main points and lines are the two poles, the equator, the parallels and the meridians. The coordinate grid is built on them.","770":"The Earth rotates from west to east. That is why the Sun rises in the east.","771":"Seen from the North Pole, the west-to-east rotation is anticlockwise.","772":"Latitude is counted from the equator and longitude from the Greenwich meridian. They are the origin of geographical coordinates.","773":"The equator divides the Earth into the northern and southern hemispheres.","774":"The Greenwich meridian, together with the 180° meridian, divides the Earth into the eastern and western hemispheres.","775":"The plumb line points down towards the nadir. The point straight up above the observer is the zenith.","776":"Latitude is counted from the equator (0°) to the pole (90°), north or south.","777":"Longitude is counted from the Greenwich meridian (0°) to 180°, east or west.","778":"Parallels are horizontal lines, so latitude is read on the side (vertical) borders of the chart.","779":"Meridians are vertical lines, so longitude is read on the top and bottom (horizontal) borders.","780":"N means north latitude, E means east longitude. These are coordinates near Varna.","781":"S means south latitude, W means west longitude.","782":"The meridian is the north–south line. The direction perpendicular to it is east–west (the prime vertical).","783":"The true meridian passes through both poles, so it defines the north–south direction.","784":"At the North Pole every direction leads south. At the South Pole every direction is north.","785":"In the circular system the horizon is divided from 0° to 360°.","786":"Counting is from north through east, clockwise: east is 90°, south 180°, west 270°.","787":"Preliminary plotting is the passage plan before departure. Actual plotting is kept during the passage.","788":"Chart plotting needs a protractor and parallel rule for angles, dividers for distances, and a pencil.","789":"Pilotage (sailing directions) describes the navigation area: coasts, dangers, landmarks, ports, currents, and gives recommendations for safe navigation.","790":"A lighthouse is the main shore landmark: tall, visible from afar, and showing a light with a characteristic given on the chart.","791":"Floating aids are buoys and spars. Lighthouses, leading lines and marks ashore are shore aids.","792":"A buoy is recognised by day by its shape, colour and topmark, and at night by its light.","793":"Lateral marks indicate the sides of fairways and channels: in Region A red to port, green to starboard.","794":"Cardinal marks indicate dangers such as reefs, banks and shoals and show on which side to pass them.","795":"Rule 19: in restricted visibility vessels proceed at a safe speed adapted to the conditions.","796":"The give-way rules apply only to vessels in sight of one another. In fog nobody has right of way and each vessel avoids the close-quarters situation herself.","797":"The wavy line means a submarine cable. Do not anchor or trawl over it.","798":"This is how a submarine pipeline is shown, labelled oil or gas. Do not anchor over it.","799":"These are leading marks: two marks one behind the other. When they are in line, the vessel is on the leading line, which leads along the safe route.","800":"This is a recommended track. The number shows the greatest draught with which it can be used.","801":"This is a reporting point. When passing it the vessel calls the vessel traffic service by radio.","802":"The anchor means a place suitable for anchoring.","803":"An anchor in an area bounded by a dashed line means an anchorage, i.e. a designated area for lying at anchor.","804":"The line with fish symbols means the limit of a fishing zone.","805":"The solid line is a coastline that has been surveyed accurately.","806":"The broken line is a coastline that has not been surveyed or is charted approximately.","807":"Hatching towards the sea means a steep, rocky coast.","808":"Dots along the coastline mean a sandy shore.","809":"Numbers on the land are spot heights on the shore. They show the relief.","810":"This is an overhead power cable over the water. The number is the safe vertical clearance for passing under it.","811":"This is a slipway or ramp: a sloping surface for launching and recovering boats.","812":"A cross with dots around it means a dangerous underwater rock with unknown depth over it.","813":"This is the symbol for a light vessel: a ship or large buoy with a lighthouse light.","814":"A sector light shows a different colour in different sectors. The colour tells you whether you are in safe water.","815":"This is how a light is shown that is visible all round, except in the indicated sector, where it is obscured.","816":"This is the chart symbol for a conical buoy. Its exact position is the small circle at the base of the symbol.","817":"This is the symbol for a spar: a tall, thin pole fixed to the bottom.","818":"These are mooring buoys. A vessel makes fast to them without letting go her anchor.","819":"The east cardinal mark shows 3 flashes: very quick (VQ) every 5 seconds or quick (Q) every 10. Three, just as 3 on a clock face is in the east.","820":"The west cardinal mark shows 9 flashes: very quick every 10 seconds or quick every 15. Nine, just as 9 on a clock face is in the west.","821":"The isolated danger mark has two black balls and a light with two white flashes, Fl(2).","822":"The north cardinal mark shows continuous quick or very quick flashing, without groups.","823":"According to the official answer, this is how underwater rocks are shown on Bulgarian charts.","824":"This is how a navigational landmark is shown. The numbers give its elevation above the water and the height of the structure itself.","825":"\"ПП\" means \"position approximate\" (PA). The object's position is not charted accurately.","826":"\"ПС\" means \"position doubtful\" (PD). There are reports of the object, but its position is not confirmed.","827":"\"Пр\" means a flashing light (Fl): the flash is shorter than the dark period.","828":"\"Зтм\" means an occulting light (Oc): it shines almost continuously and goes dark briefly.","829":"Next to a navigation light, \"П\" means a fixed light (F), shining without interruption.","830":"The number in brackets is the number of flashes in a group. \"Пр(2)\" is a group flashing light with two flashes, Fl(2).","831":"Letters in the water describe the bottom. \"Т\" means mud (M).","832":"In the water area \"П\" means sand (S). Next to a light the same letter means \"fixed\".","833":"\"Р\" as a bottom notation means shells (Sh).","834":"Bottom notations are combined: \"ТР\" is mud and shells (M.Sh).","835":"\"РФ\" means a radio beacon: a station that transmits a radio signal for taking bearings.","836":"The entry is read in order: type of light and number of flashes, period, visibility range and fog signal. Here it is 3 flashes in 15 seconds, 25 miles, and the letter \"н\" (N) for fog.","837":"Groups of three flashes belong to east cardinal marks. \"Ч\" means quick flashes, 10с is the period, and \"рев.\" means the buoy has a horn.","838":"Flag \"T\" has three vertical stripes: red, white and blue. It means \"Keep clear of me\", originally for vessels pair trawling.","839":"Flag \"H\" is half white and half red, divided vertically: \"I have a pilot on board\".","840":"Flag \"N\" is blue and white chequers like a chessboard: \"No\".","841":"Flag \"G\" has yellow and blue vertical stripes: \"I require a pilot\".","842":"Flag \"Q\" is all yellow: \"My vessel is healthy and I request free pratique\", i.e. permission to communicate with the shore.","843":"Flag \"M\" is blue with a white diagonal cross. For the exam remember the official answer. In the current International Code of Signals \"M\" means \"My vessel is stopped and making no way through the water\".","844":"Flag \"B\" is red, swallow-tailed: \"I am taking in, discharging or carrying dangerous goods\".","845":"Flag \"O\" is divided diagonally into yellow and red: \"Man overboard\".","846":"Flag \"U\" has four squares, red and white: \"You are running into danger\".","847":"Flag \"V\" is white with a red diagonal cross: \"I require assistance\".","848":"Flag \"C\" has horizontal stripes: blue, white, red, white, blue. It means \"Yes\"."}};
</script>

function lbl(x){const L=x&&x.lab;if(L&&typeof L==='object'){if(L.k==='exam')return t('exam');if(L.k==='all')return t('allSections');if(L.k==='wrong')return t('wrongLabel');if(L.k==='smart')return t('smartL');if(L.k==='weak')return t('weakL');if(L.k==='topic'&&TOPICS_BG[L.t]!=null)return tn(L.t);if(L.k==='n')return t('nSections',L.n);}return typeof x.label==='string'?x.label:t('practice');}

    h('button',{class:'link',onclick:()=>{showGrid=!showGrid;render();}},showGrid?t('hideGrid'):t('showGrid')));

  if(!zoom.hidden){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){zoom.hidden=true;e.preventDefault();}return;}
