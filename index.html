<title>Капитан 40 БТ</title>
<script>try{var s=JSON.parse(localStorage.getItem('kapitan40.v1'));if(s&&(s.theme==='dark'||s.theme==='light'))document.documentElement.setAttribute('data-theme',s.theme);}catch(e){}</script>
<style>
:root{
  --water:#eef4f8; --paper:#ffffff; --ink:#12263a; --muted:#566879; --line:#c9d7e2;
  --magenta:#a3237b; --magenta-soft:#f6e3f0; --port:#b92d28; --port-soft:#fbe6e4;
  --stbd:#147544; --stbd-soft:#dff3e8; --buff:#f4e8bd;
  --serif:Georgia,"PT Serif","Noto Serif","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --water:#0c1a27; --paper:#14273a; --ink:#e7eff5; --muted:#9db0c0; --line:#2b4257;
  --magenta:#ee82c8; --magenta-soft:#3a1c33; --port:#ff8a82; --port-soft:#40201f;
  --stbd:#5fd39a; --stbd-soft:#143524; --buff:#4b411c;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --water:#0c1a27; --paper:#14273a; --ink:#e7eff5; --muted:#9db0c0; --line:#2b4257;
  --magenta:#ee82c8; --magenta-soft:#3a1c33; --port:#ff8a82; --port-soft:#40201f;
  --stbd:#5fd39a; --stbd-soft:#143524; --buff:#4b411c;
  color-scheme:dark;
}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--water);color:var(--ink);font:17px/1.5 var(--sans)}
#app{max-width:46rem;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
h1{font-size:2.1rem;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}

/* chart-scale progress bar */
.scale{height:9px;border:1px solid var(--ink);background:var(--paper)}
.scale i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,var(--paper) 14px 28px)}

.masthead{padding:36px 0 22px;border-bottom:2px solid var(--ink)}
.masthead p{color:var(--muted);margin-top:10px;max-width:34rem}
.block{padding:26px 0;border-bottom:1px solid var(--line)}
.block > p{color:var(--muted);margin-top:6px;max-width:36rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}

.btn{border:1.5px solid var(--ink);background:var(--paper);padding:11px 18px;border-radius:4px;font-weight:600;min-height:46px}
.btn.primary{background:var(--ink);color:var(--water)}
.btn.accent{background:var(--magenta);border-color:var(--magenta);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.accent{color:#1b0a16}}
:root[data-theme=dark] .btn.accent{color:#1b0a16}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.45}
.link{background:none;border:0;padding:4px 0;color:var(--magenta);text-decoration:underline;text-underline-offset:3px}

.resume{margin-top:22px;padding:14px 16px;background:var(--buff);border-left:5px solid var(--ink)}
.resume .row{margin-top:10px}

.opts{display:grid;gap:14px;margin-top:18px}
.opt span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);padding:8px 14px;min-height:42px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--water)}

.group{margin-top:20px}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 12px;text-align:left;line-height:1.3;min-height:42px}
.chip small{color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--water)}
.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.startbar{position:sticky;bottom:0;margin-top:22px;padding:12px 0;background:var(--water);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.startbar span{color:var(--muted);font-size:.95rem}

.progress-line{display:flex;justify-content:space-between;gap:12px;margin:14px 0 8px;font-variant-numeric:tabular-nums}
.progress-line b.r{color:var(--stbd)} .progress-line b.w{color:var(--port)}
details{margin-top:6px}
summary{cursor:pointer;font-family:var(--serif);font-weight:700;font-size:1.35rem;padding:4px 0}
.field{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.field input[type=number]{width:5.5rem;font:inherit;padding:8px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink)}
.field input[type=checkbox]{width:22px;height:22px;accent-color:var(--magenta)}
.note{color:var(--muted);font-size:.92rem;margin-top:12px}
.notes{margin:10px 0 0}
.notes dt{font-weight:700;margin-top:14px}
.notes dd{margin:2px 0 0;color:var(--muted);max-width:38rem}
footer{padding-top:22px;color:var(--muted);font-size:.9rem}

/* quiz */
.bar{position:sticky;top:0;z-index:5;background:var(--water);padding:12px 0 10px}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.bar-top .count{font-variant-numeric:tabular-nums;font-weight:600}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:2px 8px;border:1.5px solid var(--ink);border-radius:4px}
.timer.low{color:var(--port);border-color:var(--port)}
.jump{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;margin-left:auto}
.bar-top:has(.jump){flex-wrap:wrap;row-gap:8px}
@media (max-width:360px){.jump input{width:4.4rem}.jump .arrow{width:38px}}
.jump input,.lookup input{width:5.2rem;font:inherit;font-weight:600;text-align:center;padding:7px 6px;min-height:42px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink)}
.jump .arrow{width:42px;min-height:42px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);font-size:1.2rem;line-height:1;padding:0}
.jump .arrow:disabled{opacity:.35}
.jump span{color:var(--muted);white-space:nowrap}
.lookup{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.lookup input{width:7rem}
.qmeta{color:var(--muted);font-size:.92rem;margin-top:18px}
.qtext{font-family:var(--serif);font-size:1.3rem;line-height:1.35;margin-top:6px}
.plate{display:inline-block;margin-top:16px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:4px;cursor:zoom-in;max-width:100%}
.plate img{display:block;max-width:100%;height:auto;min-height:70px;max-height:230px}
.answers{display:grid;gap:10px;margin-top:20px}
.ans{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:4px;background:var(--paper);min-height:52px}
.ans .let{font-family:var(--serif);font-weight:700;width:1.7rem;height:1.7rem;line-height:1.7rem;text-align:center;border:1.5px solid currentColor;border-radius:50%;font-size:.95rem}
.ans img{display:block;max-width:100%;height:auto;background:#fff;padding:6px;border-radius:3px;margin-top:4px}
.ans:not(:disabled):hover{border-color:var(--ink)}
.ans.sel{border-color:var(--ink);background:var(--buff)}
.ans.right{border-color:var(--stbd);background:var(--stbd-soft);color:var(--ink)}

Форщевен е:",["Носовата права или извита греда като продължение на кила, очертаваща носа","Кърмовата права или извита греда като продължение на кила, очертаваща кърмата.","Напречна дънна греда на корпуса.","Напречна греда на главна палуба."],0],[8,6,"Фалшборд е:",["Предпазно ограждение на главна палуба като продължение на обшивката на корпуса.","Двойна преграда на дъното.","Издадена площадка извън линията на корпуса в района на кърмата.","Издадена площадка извън линията на корпуса в района на носа."],0],[9,6,"Главна палуба наричаме:",["Хоринзонтално разположена конструкция, свързана с бордовете и е от носа до кърмата.","Дървена настилка в хамбарите за изолиране на товара от влага.","Палубата на главния мостик на океанските кораби.","Пояс на външна обшивка на кораба в района на скула."],0],[10,6,"Леери наричаме:",["Стълби за слизане и качване от/на кораба.","Капаци за затваряне на товарни хамбари.","Парапетни ограждения по палубата и надстройките на кораба.","Хвъргалото на спасителната лодка."],2],[11,6,"Прозорците от надстройката на кораба се наричат:",["Гърловини, отвори.","Вентилационни люкове.","Илюминатори, филистрини.","Лули,отдушници."],2],[12,6,"Вратите и люковете на главна палуба трябва да са:",["Водонепроницаеми.","Заключващи се.","Остъклени.","Взривоустойчиви."],0],[13,6,"Бак наричаме:",["Специалист по морско дело, ръководещ работата на моряците на палубата.","Бордова врата в корпуса за приемане на товари.","Надстройката над главна палуба на носа на кораба.","Надстройката над главна палуба на кърмата на кораба."],2],[14,6,"Ют наричаме:",["Надстройката над главна палуба на носа на кораба.","Надстройката над главна палуба на кърмата на кораба.","Плоска конструкция, която оформя сразването на кърмата на кораба.","Палубата, на която се намират антените на радиосвързочните средства."],1],[15,6,"Корпусът на кораба по дължина е разделен на водонепроницаеми отсеци чрез:",["Надлъжни прегради от дъното до главна палуба.","Напречни прегради от дъното до главна палуба.","Водонепроницаеми врати и люкове.","Водонепроницаеми лацпорти."],1],[16,6,"Качването и слизането на/от кораба се извършва по:",["Сходни и трапове.","През фалшборда.","През батапортата.","Със спасителните лодки."],0],[17,10,"При увеличаването на теглото на товара на борда на кораба:",["Увеличава се и подемната сила на водата.","Намалява се подемната сила на водата.","Няма промяна в големината на подемната сила на водата.","Корабът губи устойчивост и се преобръща."],0],[18,10,"Метацентричната височина на кораба е свързана с:",["Запаса на плавателност.","Устойчивостта му.","Здравината на корпуса.","Вълнението на морето."],1],[19,10,"При поставянето на товар на главната палуба центърът на тежестта на кораба се премества:",["Надолу по диаметралната /вертикалната/ равнина на кораба.","Нагоре по диаметралната /вертикалната/ равнина на кораба.","Наляво от диаметралната равнина.","Надясно от диаметралната равнина."],1],[20,10,"Центърът на тежестта на кораба ще се премести надолу по вертикалната равнина ако:",["Поставим товар на бака на кораба.","Поставим товар на юта на кораба.","Поставим товар на главна палуба.","Поставим товар ниско в корпуса, до кила."],3],[21,10,"Метацентричната височина се увеличава когато:",["На главна палуба се разположат тежки товари.","Тежките товари се разполагат ниско долу в корпуса.","Хоризонтално се преместват товарите на кораба.","Всички изброени."],1],[22,10,"За подобряване устойчивостта при превоз на хора с лодки и катери е необходимо:",["Хората да се разполагат симетрично по двата борда и да няма прави.","Хората да се разполагат възможно най-близо до кърмата.","Хората да се разполагат възможно най-близо до носа.","Няма значение от разположението, а само от броя лица на борда."],0],[23,12,"Под пътниковместимост на кораба се разбира:",["Способността на кораба да приеме и настани в кабини и помещения лица, за които са осигурени седящи места.","Брой пътници, които се допускат за превоз от кораба, съгласно издадените документите.","Максимален  се задържат върху кнехта чрез направа на:",["Най-малко на 3-4 кръгови намотки.","Шкотов възел.","Оптимален брой волти /осморки/.","Всички изброени са допустими."],2],[33,6,"Балоните от плетени въжета, предназначени за предпазване на корпуса от деформациии се наричат:",["Буртици.","Виюшки.","Кранци.","Фалшборд."],2],[34,6,"Хвъргалото като елемент на швартовото устройство има:",["В единия си край торбичка с пясък или дървена тежест.","Задържан мушкел или полумушкел.","Заплетена гаша или мат.","В единия си край има оловна или стоманена тежест."],0],[35,6,"Към елементите на рулевото устройство спадат:",["Рул,балер,рулеви привод,рулева машина.","Румпел,лопус, проволки,такелажна верига.","Щормтрапове, леери,лебедки.","Всички изброени."],0],[36,6,"Индивидуалните спасителни средства са боядисани:",["Бяло.","Синьо.","Оранжево.","Жълто."],2],[37,6,"Конструкцията на спасителните ризи трябва да осигурява:",["Хоринзонтално положение на тялото във водата за плуване.","Покриване на цялото тяло без лицето.","Поддържане на тялото във водата с лицето нагоре.","Затопляне на тялото."],2],[38,6,"Спасителните ризи трябва да са снабдени със:",["Пиротехнически и сигнални средства.","Свирка, лампичка и светлоотражатели.","Кутия с хранителни припаси и инструкция за оцеляване.","Въже за издърпване при спасяване."],1],[39,6,"Върху спасителната риза трябва да има надписи с:",["Името на кораба и пристанище на регистрация.","С мерките за оцеляване на море.","Подемната сила и регистрационния номер.","Тегло и дата на освидетелстване."],0],[40,6,"Спасителните ризи на борда на кораба се съхраняват:",["В спасителните лодки.","На лесно достъпни места /видни/, надписани или маркирани.","В сухи и проветриви помещения, снабдени с алармена инсталация.","На всички места, където има опасност."],1],[41,6,"Спасителните кръгове са разположени на борда на кораба:",["На откритите палуби към бордовете, по леерите и надстройката, на видни и достъпни места.","В канижелите на кораба, в близост до входните врати, на  паспорт."],0],[206,12,"Кога може да бъде вписан кораб в българския регистър на корабите, ако същият е вписан в чужд регистър.",["Ако представи \"Митнически манифест\".","Само след заличаване от чуждия регистър.","След написване на заявление до ИА \"Морска администрация\".","Веднага след като собственикът пожелае."],1],[207,12,"Ако корабът е закупен в чужбина, какъв е срокът за заявяване за вписване в регистровите книги?",["До 6 /шест/ седмици от деня, в който корабът е пристигнал за пръв път в българско пристанище.","До шест /6/ месеца от деня, в който е пристигнал за пръв път в българско пристанище.","До 3 /три/ месеца от датата на закупуването му.","До 1 /една/ година след закупуването му."],0],[208,12,"Кой е компетентният орган в Р. България, извършващ измерване на корабите?",["Българският корабен регистър.","Изпълнителна агенция \"Морска администрация\".","Упълномощени лица от областните съвети.","Всеки от изброените в останалите отговори."],1],[209,12,"Как се установява, че един кораб отговаря на изискванията за безопасност на корабоплаването?",["Чрез проверка на документите на кораба.","Чрез преглед установяващ, че корабът отговаря на изискванията за безопасност.","Чрез декларация на собственика, че кораба отговаря на изискванията за безопасност.","Ако корабът е бил регистриран в чуждо пристанище не е необходим преглед."],1],[210,12,"Кой документ дава правото на малък кораб до 40 БТ да издигне знамето на Р.България?",["Свидетелството за годност.","Позволителното за плаване.","Техническият паспорт.","Свидетелството за регистрация."],3],[211,12,"От кого се издава \"Свидетелство за регистрация\"?",["Министерският съвет.","Министърът на транспорта, информационните технологии и съобщенията.","Народното събрание.","Изпълнителният директор на \"Морска Администрация\"."],3],[212,12,"Къде се издава \"Свидетелство за регистрация\" на малките морски кораби?",["Министерството на транспорта.","Българският корабен регистър.","Дирекциите \"Морска Администрация\" във Варна и Бургас.","Пристанищните власти във Варна и Бургас."],2],[213,12,"Къде се издава \"Свидетелство за регистрация\" на малките речни кораби?",["Министерството на транспорта, информационните технологии и съобщенията.","Българският корабен регистър.","Дирекциите \"Морска Администрация\" в Русе и Лом.","Пристанищните власти в Русе и Лом."],2],[214,12,"Кой нормативен документ определя вида на корабните документи?",["Устройствен правилник на Изпълнителна агенция \"Морска Администрация\".","Наредба №5 за корабните документи.","Международните правила за предпазване от сблъскване на море.","Закон за морските пространства."],1],[215,12,"На кого се възлага управлението на кораба, осигуряване на безопасното плаване и поддържане реда на кораба?",["На старшия помощник капитанна кораба.","На главния стюард на кораба.","На главния механик на кораба.","На капитана на кораба."],3],[216,12,"Ако корабът е засташен от неминуема гибел, какво е задължен да спаси капитана на кораба преди да го напусне?",["Да се погрижи за багажа на екипажа.","Да вземе всички възможни мерки за спасяване на товарните планове на кораба.","Да вземе всички възможни мерки за спасяване на \"Корабния дневник\", картите на рейса, ценностите и документите на кораба.","Да вземе всички възможни мерки за спасяване на изданията на Международните конвенции."],2],[217,12,"От кой орган се осъществява административната власт за осигуряване безопасността на корабоплаването?",["От Българският корабен регистър.","От Изпълнителна агенция \"Пристанищна администрация\".","От Изпълнителна агенция \"Морска администрация\".","От Изпълнителна агенция \"Държавна администрация\"."],2],[218,12,"Къде се съхраняват корабните документи?",["Във фирмата, собственик на кораба.","На борда на кораба.","В съответната администрация.","В Български корабен регистър."],1],[219,12,"Задължително ли е кораб до 40 БТ не извършващ стопанска дейност да води \"Корабен дневник\"?",["Не, не е задължително, когато районът на плаване е по-малък от 5 мили.","Да." :[224,141],"q843":[215,141],"q844":[224,141],"q845":[215,141],"q846":[243,141],"q847":[264,141],"q848":[229,141]};const EXPL={"1":"Магнитният компас показва посоката спрямо магнитния меридиан. По него се държи курсът и се вземат пеленги към ориентири. Разстояние и скорост се мерят с лаг, дълбочина с лот или ехолот.","2":"Магнитният компас работи без електрозахранване и затова е задължителен за всеки кораб. Останалите прибори го допълват, но не го заменят.","3":"Течността успокоява люлеенето на картушката и намалява тежестта ѝ върху иглата. Използва се разтвор на спирт във вода, защото не замръзва.","4":"Навигационните известия до мореплавателите за нашето крайбрежие се излъчват на УКВ канал 26. Канал 16 е само за бедствие, безопасност и повикване.","5":"Бюлетинът за времето и морето за Българското крайбрежие се излъчва на УКВ канал 26. Канал 16 е за бедствие и повикване, канал 70 е за цифрово избирателно повикване.","6":"Часовете са 07.33, 13.33 и 19.33 и се дават по UTC, не по местно време. Местното време е с 2 часа напред през зимата и с 3 през лятото. Във въпрос 653 за същия бюлетин са дадени само 07,33 и 19,33.","7":"Щевен е греда, която продължава кила нагоре. Форщевенът оформя носа, ахтерщевенът оформя кърмата.","8":"Фалшбордът е продължение на бордовата обшивка над главната палуба. Пази хората и товара от падане и от заливане с вода.","9":"Главната палуба е най-горната непрекъсната палуба от носа до кърмата. Тя затваря корпуса отгоре и е част от здравината му.","10":"Леерите са парапет от стойки и опънати въжета или тръби по края на палубата. Поставят се там, където няма фалшборд.","11":"Илюминаторът е кръгъл или правоъгълен прозорец в борда или надстройката с водонепроницаемо затваряне.","12":"Всички отвори на главната палуба трябва да се затварят водонепроницаемо, за да не влиза вода в корпуса при вълнение.","13":"Бак е носовата надстройка, ют е кърмовата. Специалистът, който ръководи работата на моряците на палубата, е боцманът.","14":"Ют е надстройката на кърмата. Бак е надстройката на носа.","15":"Напречните водонепроницаеми прегради делят корпуса на отсеци по дължина. Ако един отсек се напълни с вода, останалите държат кораба на вода.","16":"Сходнята е преносим мост между кораба и кея, трапът е корабна стълба. Прескачането на фалшборда е опасно и не се допуска.","17":"Закон на Архимед: корабът потъва по-дълбоко, измества повече вода и подемната сила нараства, докато се изравни с новото тегло.","18":"Метацентричната височина е разстоянието между центъра на тежестта и метацентъра. Тя е мярката за началната устойчивост на кораба.","19":"Центърът на тежестта се мести към мястото на добавения товар. Товар на палубата е високо, затова центърът се вдига и устойчивостта намалява.","20":"Товар, поставен ниско до кила, сваля центъра на тежестта. Товар на палубата, бака или юта го вдига.","21":"Ниско разположеният товар сваля центъра на тежестта. Разстоянието до метацентъра расте и корабът става по-устойчив.","22":"Седнали хора държат центъра на тежестта ниско, а симетричното разположение не дава крен. Правите хора и струпването на един борд са честа причина за преобръщане на лодки.","23":"Пътниковместимостта е броят пътници, записан в корабните документи. Екипажът не се брои в нея.","24":"По международните правила пътнически е кораб, който превозва повече от 12 пътници. За него важат по-строги изисквания за безопасност.","25":"Газенето е вертикалното разстояние от най-ниската точка на кила до водолинията. Показва колко дълбоко е потопен корабът.","26":"В официалния отговор плавателността е способността на кораба да запазва устойчивостта и мореходността си, тоест да остава годен за плаване.","27":"Повече тегло означава повече изместена вода. Корабът потъва по-дълбоко и газенето расте.","28":"Управляемостта обединява две качества: устойчивост на курса и повратливост. Това е способността корабът да слуша руля.","29":"Повратливостта е способността на кораба да изменя посоката си под действие на руля. Обратното качество е устойчивостта на курса.","30":"Маневрените елементи описват как корабът се движи и спира: скорост, инерция, спирачен път и циркулация. Останалите отговори са товарни и мореходни характеристики.","31":"След спиране на двигателя корабът продължава напред по инерция. Колкото по-тежък и по-бърз е, толкова по-дълъг е пътят до спиране.","32":"Въжето се слага на кнехта на осморки. Триенето го държи, а въжето се освобождава бързо и под натоварване, за разлика от възел.","33":"Кранците се спускат между борда и кея или друг кораб и поемат ударите и триенето.","34":"Хвъргалото е тънко въже с лека тежест в края, обикновено торбичка с пясък. С него се подава швартовото въже. Метална тежест е забранена, защото може да нарани човек.","35":"Рулевото устройство включва перото на руля, балера (оста му), рулевия привод и рулевата машина.","36":"Оранжевият цвят се вижда най-добре на фона на морето, затова спасителните средства са оранжеви.","37":"Спасителната риза трябва да обръща човека по гръб и да държи устата му над водата, дори ако е в безсъзнание.","38":"Свирката и лампичката помагат да те чуят и видят, а светлоотражателите блестят в лъча на прожектор.","39":"Спасителните средства се надписват с името на кораба и пристанището на регистрация. Така се разбира от кой кораб са, ако бъдат намерени.","40":"При тревога няма време за търсене. Затова ризите стоят на видни, леснодостъпни и обозначени места.","41":"Кръговете стоят на откритите палуби до бордовете, за да могат да се хвърлят веднага към човек във водата.","42":"И кръговете, както ризите, носят името на кораба и пристанището на регистрация.","43":"Въжето позволява да изтеглиш човека към борда. Самозапалващият се буй или димката показват мястото на кръга нощем и денем.","44":"Малък кораб от дърво или пластмаса отразява слабо радарния лъч. Пасивният отражател го прави видим на радара на другите кораби.","45":"Канал 16 е международният УКВ канал за бедствие, безопасност и повикване. На него се носи постоянно слушане.","46":"MAYDAY е радиотелефонният сигнал за бедствие. Идва от френското m'aidez, „помогнете ми“, и се повтаря три пъти.","47":"Рангоутът са гредите, които носят ветрилата: мачти, реи, гикове, бушприт. Въжетата към тях се наричат такелаж.","48":"Мачтите се броят от носа към кърмата: фок, грот, бизан.","49":"Реята е напречна греда на мачтата. Гикът е долната греда на ветрилото, стенгата удължава мачтата, бушпритът стърчи пред носа.","50":"Гикът е хоризонтална греда, закрепена с единия край за мачтата. Към него се опъва долният ръб (шкаторина) на ветрилото.","51":"Бушпритът излиза пред форщевена и изнася напред предните ветрила.","52":"При рифоване част от ветрилото се завързва и работната му площ намалява. Прави се, когато вятърът се усили.","53":"При леко движение назад веригата се изпъва по дъното и не пада на куп върху котвата, а котвата се забива по-добре.","54":"Отдава се котвата от надветрения борд. Вятърът отнася кораба и веригата се изпъва встрани от корпуса, без да минава под него.","55":"При голяма дълбочина котвата се спуска с брашпила до около 2/3 от дълбочината и чак тогава се пуска свободно. Така не набира скорост и не поврежда веригата и брашпила.","56":"Шпигатите са отвори по палубата и във фалшборда. През тях водата от палубата изтича зад борда.","57":"Босфорът свързва Черно море с Мраморно море. Дарданелите свързват Мраморно с Егейско, а Керченският проток свързва Азовско с Черно море.","58":"При трета степен кожата е разрушена в дълбочина. Раната се покрива със стерилна превръзка срещу инфекция и се търси лекар. Нищо не се маже и мехури не се пукат.","59":"Изискването е термозащитните средства да работят при температура на въздуха от -30 °C до +20 °C.","60":"Напречната метацентрична височина е мярката за устойчивост срещу наклоняване към борда. Колкото е по-голяма, толкова по-трудно корабът се накренява.","61":"Бедствие може да настъпи по всяко време, включително на кея. Затова спасителните средства са винаги готови.","62":"Крен е наклон към левия или десния борд. Наклонът към носа или кърмата се нарича диферент.","63":"Диферент е надлъжният наклон, към носа или към кърмата. Напречният наклон е крен.","64":"Преди щорм корабът се подготвя: затварят се люкове и врати, укрепва се всичко подвижно, проверяват се двигателят и спасителните средства.","65":"В щорм най-важното е да избереш курс и скорост, при които корабът поема вълните най-леко и остава управляем.","66":"Вълната се посреща под малък ъгъл към носа, около 15–20°. Право срещу вълната ударите са най-силни, а с борд към вълната има опасност от преобръщане.","67":"Правило 19 от МППСМ: при ограничена видимост се плава с безопасна скорост, а при нужда корабът намалява до минимум или спира.","68":"В мъгла се прави всичко изброено: звукови сигнали за мъгла, включени ходови светлини и допълнителни наблюдатели.","69":"Според официалния отговор признак за близък бряг е усилващото се вълнение. На плитко вълните стават по-високи и по-стръмни.","70":"Устойчивостта се подобрява, като се свали центърът на тежестта. Това увеличава метацентричната височина.","71":"Циркулацията е кривата, която описва центърът на тежестта на кораба, когато рулят се държи отклонен на постоянен ъгъл.","72":"Диаметърът на циркулацията е разстоянието между две срещуположни точки от кривата при пълен завой. Показва колко място му трябва на кораба, за да се обърне.","73":"Анемометърът мери скоростта на вятъра. От гръцки: anemos означава вятър.","74":"Барометърът анероид мери атмосферното налягане с метална кутийка без течност. Падащо налягане предупреждава за влошаване на времето.","75":"Румпелът е лостът, закрепен за оста на руля. С него рулят се върти на ръка или чрез привод.","76":"Ахтерпикът е последният отсек в кърмата. Първият отсек в носа се нарича форпик.","77":"Ахтерщевенът е кърмовото продължение на кила. Форщевенът е носовото.","78":"При бакщаг вятърът идва косо отзад, между траверса и кърмата (около 95°–170° от носа).","79":"При бейдевинд вятърът идва от носовите ъгли, между носа и траверса (до около 85°).","80":"При халфвинд вятърът духа напречно на кораба, по траверса (около 90°). Half wind означава „половин вятър“.","81":"При фордевинд вятърът духа право или почти право в кърмата.","82":"Вантите са част от стоящия такелаж. Те държат мачтата отстрани, към двата борда. Щаговете я държат отпред и отзад.","83":"Галсът се нарича по борда, от който идва вятърът. Вятър отдясно е десен галс, ветрилата тогава са отляво.","84":"Кокпитът е открита вдлъбнатина в палубата, обикновено на кърмата. Там стоят рулевият и екипажът.","85":"Шквалът е внезапен и кратък порив на силен вятър, често с рязка смяна на посоката. Опасен е, защото идва без предупреждение.","86":"Рискливостта е склонността на кораба сам да се отклонява ту наляво, ту надясно от курса. Такъв кораб се държи трудно на курс.","87":"Плаващата котва е платнен конус, който се пуска във водата на въже. Тя спира дрейфа и държи носа срещу вълната.","88":"Товароподемността (дедуейт) включва всичко, което корабът може да носи до товарната водолиния: товар, гориво, вода, запаси и екипаж.","89":"В официалния отговор плавучестта е способността на кораба да плава при определено газене с определени хора и товар на борда.","90":"Стенгата е горното продължение на мачтата.","91":"Утлегарът продължава бушприта напред. Стенгата продължава мачтата нагоре.","92":"Обемното водоизместване е обемът на подводната част на корпуса, тоест под водолинията. Мери се в кубични метри.","93":"Тегловното водоизместване е теглото на изместената от кораба вода. По закона на Архимед то е равно на теглото на самия кораб.","94":"На вълнение корабът губи скорост: винтът се оголва, упорът му пада и рулят работи по-зле. Скоростта не може да се увеличи, затова това твърдение е невярното.","95":"С фала се вдига и спуска ветрилото. С шкота се управлява.","96":"С шкотите ветрилото се обира или отпуска според вятъра. Вдигането става с фал.","97":"При човек зад борда се хвърля кръг, спира се винтът, човекът се наблюдава непрекъснато и се маневрира към него. „Аварийни светлини“ не се вдигат.","98":"При зареждане с гориво се забранява пушенето, осигурява се пожарогасител и присъства отговорен човек. Пясък не се изисква.","99":"Кораб с пробойна се напуска само ако не може да бъде спасен. Първо се обявява тревога, запушва се пробойната и се изпомпва водата.","100":"При работа зад борда са нужни спасителна жилетка, кръг наблизо и лодка, ако има. Водолазен апарат не се изисква.","101":"Ход се дава едва след като буксирното въже е закрепено. Иначе въжето може да се изтръгне, да нарани хора или да се намотае на винта.","102":"При силен вятър завоите се правят на малък ход. При завой на голям ход корабът се накренява силно и може да се преобърне.","103":"Водата провежда ток, затова не се използва. Въглеродният диоксид не провежда ток и не поврежда апаратурата.","104":"Комингсът е вертикалният праг около люк или врата. Той спира водата от палубата да влиза вътре.","105":"Плаването на успоредни курсове е обичайно и безопасно, ако се държи достатъчно разстояние. Останалите действия създават опасност за хора и кораби.","106":"Сгрешено е описанието на моряшкия възел. За връзване на лодка при буксир се използват други възли. Описанията на правия, рифовия и шкотовия възел са верни.","107":"Шпигатите отвеждат водата от палубата зад борда. Те нямат връзка с непотопимостта, която се осигурява от прегради, отсеци и запас от плавучест.","108":"В щорм котвите не се приспускат по време на ход. Избира се курс и скорост, задрайва се всичко и се слагат допълнителни леери.","109":"Рулят се слага към борда, от който е паднал човекът. Така кърмата и винтът се отдалечават от него.","110":"Местните признаци се наблюдават с просто око, без апаратура: небе, облаци, вятър, поведение на птиците. Явления, наблюдавани със специална апаратура, не са местни признаци.","111":"Котвата държи с теглото си и с формата си, а веригата трябва да лежи по дъното. Важни са още дължината на веригата и видът на грунта.","112":"Камбаната се използва за сигнал при вдигане на котва, за сигнали в мъгла на котва и за сигнал за бедствие. Затова е верен общият отговор.","113":"Ликтросът е въжето, зашито по ръба на ветрилото. Шкаторина е самият ръб.","114":"Пластирът е плътно платнище с въжета. Опъва се отвън върху пробойната и налягането на водата го притиска към корпуса.","115":"Корабът се клати около надлъжната ос (бордово), около напречната ос (килово) и нагоре-надолу (вертикално). Верни са и трите.","116":"Край завързан кораб се минава бавно. При бързо минаване вълната и засмукването опъват и късат въжетата му.","117":"При нахлуване на вода се прави всичко изброено: тревога, запушване на пробойната и изпомпване.","118":"При пожар се обявява тревога, започва гасене и пострадалите се извеждат и получават първа помощ. Верни са всички действия.","119":"Правилният ред включва и проверка за останали хора, и вземане на корабната документация, преди лодките да се отдалечат от кораба.","120":"Пълният ред е: кръг, доклад на вахтения, маневра на кораба, тревога „човек зад борд“, спускане на лодка, изваждане и първа помощ. В другите отговори липсва маневрирането или тревогата.","121":"Манометърът мери налягане, например на маслото или на охлаждащата вода. Температура се мери с термометър, плътност с ареометър, напрежение с волтметър.","122":"Според официалния отговор водометният движител дава по-добро ускорение. Той засмуква вода и я изхвърля назад като струя. Няма открит винт и е удобен за плитки води.","123":"При дизела в цилиндъра се всмуква само въздух. Горивото се впръсква вътре в края на сгъстяването и сместа се образува в самия цилиндър.","124":"Бензиновата смес се запалва принудително, с искра от свещ. При дизела горивото се самозапалва от нагорещения сгъстен въздух.","125":"Четирите такта са всмукване, сгъстяване, работен ход и изпускане. Всеки такт е половин оборот, общо два оборота на коляновия вал.","126":"При двутактовия двигател целият работен цикъл става за два хода на буталото, тоест за един оборот на коляновия вал.","127":"Дюзата впръсква горивото в цилиндъра като фина мъгла, за да се смеси добре с въздуха и да изгори напълно. Налягането се създава от горивната помпа.","128":"Четиритактовият двигател има всмукателни и изпускателни клапани, а разпределителният вал ги отваря и затваря. Верни са и трите.","129":"Основните и мотовилковите лагери са плъзгащи, с тънък слой масло под налягане между вала и черупките. Те носят големи ударни товари.","130":"Основните лагери носят коляновия вал в блока (рамата) на двигателя. Мотовилковите лагери са между мотовилката и коляновия вал.","131":"Горивната система на дизела подава гориво от резервоара с помпа, по тръбопроводи, до дюзите. Палец, разпределител и кондензатор са части от запалването на бензинов двигател.","132":"Маслената помпа изтегля маслото от картера, филтърът го пречиства, а тръбопроводите и каналите го водят до лагерите.","133":"Черният дим е неизгоряло гориво (сажди). Причината е недостиг на въздух, например замърсен въздушен филтър, или претоварване на двигателя.","134":"Водата образува емулсия с маслото. То губи смазващите си свойства и лагерите се износват бързо.","135":"Маслото полепва по стените на охладителните канали и работи като изолация. Двигателят отдава топлината си по-трудно и прегрява.","136":"Зареденият киселинен акумулатор „кипи“ (отделя газ), плътността на електролита е около 1,28 и напрежението спира да расте. Верни са и трите признака.","137":"Гърбиците на разпределителния вал отварят и затварят клапаните в точния момент. Валът се върти два пъти по-бавно от коляновия.","138":"Помпата за високо налягане е нужна на дизела, за да впръска горивото в сгъстения въздух. Карбураторните двигатели работят с помпа за ниско налягане.","139":"Студеният двигател се товари постепенно. Маслото още е гъсто, а частите не са се разширили равномерно. Рязкото натоварване ускорява износването.","140":"Водата и пяната провеждат ток. Електрическа инсталация се гаси с прахов или въглероден (CO₂) пожарогасител, след като се изключи захранването, ако е възможно.","141":"Карбураторът смесва бензина с въздуха преди цилиндъра. Дизелът няма карбуратор, а дюзи.","142":"Без налягане на маслото лагерите остават без смазване и двигателят блокира за секунди. Двигателят се спира веднага и чак тогава се търси причината.","143":"Изхвърлянето на нефт и нефтопродукти в морето е забранено. Отработеното масло и замърсените води се предават на брега.","144":"Пожарогасителят трябва да е на видно и достъпно място, за да го грабнеш веднага. Заключен в сандък не върши работа.","145":"Подготовката включва подгряване на водата и маслото и превъртане на двигателя, за да се смажат частите преди пуск. Верни са всички.","146":"При работа по електрическите уредби се изключва захранването и се слага табела, стои се на диелектрично килимче и се работи с изолирани инструменти.","147":"При центровката осите на двигателя, гребния вал и винта се изравняват в една линия. Несъосието дава вибрации и разрушава лагерите и уплътненията.","148":"Зъбната помпа работи добре с вискозни, смазващи течности като масла и горива. Затова се използва в маслените и горивните системи.","149":"Млечният цвят е емулсия от масло и вода. Обичайните причини са повредено гарнитурно уплътнение на главата или пробит маслен охладител.","150":"Замърсеният филтър пречи на потока. Налягането преди него расте, след него пада и разликата между двата манометъра се увеличава.","151":"Сгъстеният от турбината въздух е горещ. Охладителят (интеркулер) го охлажда и той става по-плътен, тоест в цилиндъра влиза повече кислород.","152":"Изпускателните клапани работят при много по-висока температура и са от друга, топлоустойчива стомана. Затова клапаните не се разменят.","153":"Ако охлаждащите канали в главата са запушени, тя прегрява на места. Неравномерното нагряване създава напрежения и главата се пука.","154":"При прегряване масленият слой по стените на цилиндъра изгаря и буталото трие на сухо. Така се получават надирания по втулката.","155":"Най-опасен е краят на зареждането. Тогава резервоарът се препълва и горивото излиза през отдушника или гърловината.","156":"Нефтените утайки (sludge) не се изхвърлят в морето при никакви условия. Събират се на борда и се предават в пристанище.","157":"Помпите и дюзите са с много малки хлабини. Мръсотия и вода в горивото ги износват и запушват.","158":"Двигателят работи добре в определен температурен интервал. Охлаждащата система не само отнема топлина, а поддържа тази температура.","159":"Интервалът зависи от модела на двигателя. Спазват се указанията на производителя в ръководството.","160":"Предпазителят се сменя само със същия, предписан за веригата. По-силен предпазител няма да я защити и кабелите могат да се запалят. Ако гърми често, се търси повредата.","161":"В края на зареждането акумулаторът вече не поема целия ток. Излишъкът разлага водата на водород и кислород и загрява батерията, затова токът се намалява.","162":"Поддръжката включва чисти клеми, грес срещу окисляване и бавно, пълно зареждане. Верни са и трите.","163":"Използва се спиртен термометър. Ако живачен термометър се счупи, живакът попада в електролита и поврежда акумулатора.","164":"Неработещите машини не се загряват и изолацията им поема влага от соления въздух. Изолацията отслабва и при пуск става пробив.","165":"При зареждане се отделят водород и кислород. Сместа им е взривоопасна, затова помещението се проветрява и там не се пуши.","166":"Преди резервоарът да се напълни, подаването се намалява. Така зареждането се спира навреме и горивото не прелива.","167":"Кавитацията е образуване и рязко свиване на парни мехурчета по лопатите. Те избиват частици от метала и оставят язви.","168":"Новите ремъци се разтягат и се дообтягат. Пренатегнатият ремък товари лагерите, а хлабавият приплъзва и се износва. Верни са всички твърдения.","169":"Фундаментните болтове държат двигателя за леглото му. Ако са разхлабени, двигателят вибрира и центровката с вала се нарушава.","170":"Термостатът (терморегулиращият клапан) трябва да държи водата в малкия кръг, докато двигателят загрее. Ако е заял отворен, водата остава студена.","171":"Веднага след пуск се гледа налягането на маслото. Ако няма налягане, двигателят се спира незабавно.","172":"Преди пуск се проверяват горивото, охлаждащата течност и маслото в двигателя и в редуктора. Верни са всички.","173":"Според официалния отговор в алкален акумулатор се долива разреден разтвор на основа. Киселина никога не се налива в алкален акумулатор.","174":"Електролитът на алкалните акумулатори е разтвор на калиева основа (KOH). При киселинните е разредена сярна киселина.","175":"Сепараторите са изолационни пластини между положителните и отрицателните плочи. Те не позволяват късо съединение, но пропускат електролита.","176":"Нос Емине дели крайбрежието на два района. Дирекция „Морска администрация“ Варна отговаря на север от него, до границата с Румъния.","177":"Замърсяването на морето се наказва с най-тежките глоби. Запомни диапазона от официалния отговор: от 150 000 до 500 000 лева.","178":"Според официалния отговор маневрите спират при видимост под 300 м за Бургас и под 500 м за Варна. Запомни, че по-голямото число е за Варна.","179":"Фарватерът е път за корабите. Затова там не се плава под ветрила, не се лови риба и не се поставят мрежи и уреди.","180":"Малките кораби могат да ползват фарватера, но не бива да пречат на корабите, които могат да плават само по него.","181":"Всеки капитан, който забележи промяна в навигационната обстановка или опасен плаващ предмет, е длъжен да съобщи. Затова са верни всички отговори.","182":"По официалния отговор спасителната дейност се ръководи от Главна дирекция „Аварийно-спасителна дейност“, както на север, така и на юг от нос Емине.","183":"Отговорът е същият като за района на север от нос Емине: Главна дирекция „Аварийно-спасителна дейност“.","184":"Пластмасата не се разгражда и е опасна за морските животни. Изхвърлянето ѝ в морето е забранено навсякъде по Анекс V на МАРПОЛ.","185":"Търсенето започва от последната известна позиция на кораба. Група хора се забелязва по-лесно и хората си помагат, затова екипажът остава заедно.","186":"Черно море е специална зона по Анекс V на МАРПОЛ. Стъкло и други твърди отпадъци не се изхвърлят зад борда, а се предават в пристанище.","187":"За неспазване на указанията на трафик-контрола глобата е от 1 000 до 2 500 лева, същата като за котвените стоянки.","188":"За нарушение на правилата за котвените стоянки глобата е от 1 000 до 2 500 лева, същата като за указанията на трафик-контрола.","189":"За нарушения на радиообмена глобата е от 500 до 5 000 лева, същата като за пожарната безопасност.","190":"За нарушения на пожарната безопасност глобата е от 500 до 5 000 лева, същата като за радиообмена.","191":"За нарушение на правилата за предпазване на морето от замърсяване глобата е от 10 000 до 50 000 лева. Тя е многократно по-висока от останалите в тази група.","192":"Това е общата санкция за нарушение на наредбите по КТК, когато няма предвидена друга: от 400 до 2 000 лева.","193":"За неизпълнение на законно разпореждане на „Морска администрация“ глобата е от 10 до 250 лева. Това е най-ниският диапазон в тази група въпроси.","194":"Общата глоба за нарушение на разпоредби на КТК е от 20 до 500 лева.","195":"По КТК търговското корабоплаване обхваща всяко използване на кораби за превози, морски услуги и други стопански дейности, а не само навигацията или пристанищата.","196":"КТК приема за кораб всяко самоходно или несамоходно плаващо съоръжение, включително тези за изваждане на потънало имущество.","197":"КТК не се прилага за военни превози, за спортни кораби по време на състезание и за кораби на граничния контрол. Верни са всички.","198":"Каботаж е превоз между български пристанища. Разрешен е за кораби под българско знаме и под знаме на държава от Европейския съюз.","199":"Български е корабът, който е собственост на държавата или на българско лице, или повече от половината от него е тяхна собственост. Определя се по собствеността.","200":"Корабът се индивидуализира по име или номер, националност, пристанище на регистрация и бруто и нето тонаж. Размерите и типът само го описват.","201":"Пристанището на регистрация се изписва на кърмата или на бордовете в кърмовата част, под името на кораба.","202":"Пристанището на регистрация се избира от собственика на кораба.","203":"В българското законодателство малък е корабът с тонаж до 40 БТ. Оттам идва и името на правоспособността.","204":"Свидетелството за регистрация доказва собствеността и националността на малкия кораб. Контролният талон доказва техническата годност.","205":"Кораб, купен в чужбина, плава до първото българско пристанище с временно свидетелство за плаване под българско знаме.","206":"Корабът не може да е вписан в два регистъра едновременно. Първо се заличава от чуждия регистър.","207":"Срокът за заявяване на вписването е 6 седмици от първото пристигане на кораба в българско пристанище.","208":"Корабите се измерват (определя се тонажът им) от Изпълнителна агенция „Морска администрация“.","209":"Годността се установява с преглед на самия кораб. Документи или декларация на собственика не са достатъчни.","210":"Правото да плава под българско знаме идва от вписването в регистъра. За малък кораб то се удостоверява със свидетелството за регистрация.","211":"Свидетелството за регистрация се издава от изпълнителния директор на „Морска администрация“.","212":"За морските малки кораби свидетелството се издава в дирекциите „Морска администрация“ във Варна и Бургас.","213":"За речните малки кораби свидетелството се издава в дирекциите „Морска администрация“ в Русе и Лом.","214":"Видовете корабни документи са определени в Наредба № 5 за корабните документи.","215":"Капитанът носи цялата отговорност за управлението, безопасността и реда на кораба.","216":"След хората капитанът е длъжен да опита да спаси корабния дневник, картите на рейса, документите и ценностите. Те са нужни за разследването на произшествието.","217":"Държавният надзор за безопасността на корабоплаването се осъществява от Изпълнителна агенция „Морска администрация“.","218":"Корабните документи се държат на борда, за да могат да се представят при всяка проверка.","219":"Малък кораб без стопанска дейност не е длъжен да води дневник, когато плава на по-малко от 5 мили от брега.","220":"Корабният дневник описва хронологично всичко, което се случва с кораба и екипажа: курсове, време, маневри, произшествия.","221":"Правоспособността на морските лица се урежда в Наредба № 6 за компетентност на морските лица. Наредба № 5 е за корабните документи.","222":"За правоспособност „Водач на кораб до 40 БТ“ се изискват навършени 18 години.","223":"За „Водач на кораб до 40 БТ по море“ е достатъчно основно образование.","224":"Правоспособността дава право да си капитан на кораб до 40 БТ с до 12 души на борда, като екипажът се брои в това число.","225":"Териториалното море е ивицата от 12 морски мили, мерена от изходните линии. Вътрешните морски води са откъм брега на тези линии.","226":"Ширината на териториалното море е 12 морски мили от изходните линии.","227":"Прилежащата зона стига до 24 морски мили от изходните линии, тоест още 12 мили след края на териториалното море.","228":"Митническият, финансовият, граничният и санитарният контрол се упражнява в прилежащата зона, която включва и териториалното море.","229":"Дирекция „Морска администрация“ Бургас отговаря за района от нос Емине на юг до границата с Турция.","230":"По официалния отговор временното свидетелство се издава от изпълнителния директор на „Морска администрация“.","231":"От брега до определения район и обратно джетовете се движат с не повече от 5 възла (около 9 км/ч), за да не застрашават къпещите се.","232":"Джетовете не плават близо до зоните за къпане, извън обозначените коридори и на по-малко от 300 м от брега при неохраняеми плажове. Верни са всички забрани.","233":"Техническата годност на малък кораб се удостоверява с контролен талон или със свидетелство за годност. Свидетелството за регистрация доказва собствеността.","234":"Документът губи валидност при изтекъл срок или липсваща заверка, както и при смяна на името или на собственика на кораба.","235":"Задължителното спасително и навигационно оборудване на малките кораби е определено в Разпореждане № 68 на изпълнителния директор на ИА „Морска администрация“.","236":"Районът на плаване е записан в контролния талон или в свидетелството за годност, защото зависи от техническото състояние и оборудването на кораба.","237":"Името на кораба се избира от собственика му.","238":"КТК се прилага към кораб в строеж от момента на спускането му на вода.","239":"В район B цветовете са обратни на район А: зеленото огражда лявата страна на фарватера, червеното дясната, гледано по основната посока за движение.","240":"В район B червеното е за дясната страна. Коничната форма също е на десните знаци.","241":"В район B червеният знак огражда дясната страна на фарватера по основната посока за движение.","242":"Латерален знак с лента в другия цвят показва разклонение. В район B зелен знак с червена лента и цилиндрична форма означава, че основният път е надясно.","243":"Зелен знак с червена хоризонтална лента в район B е знак на разклонение: основният път е надясно, а отклонението е наляво.","244":"Вехата носи същите цветове като буя. Зелено с червена лента в район B означава, че основният път е надясно.","245":"По Правило 21 от МППСМ пробляскваща е светлина с равномерни проблясъци с честота 120 или повече в минута.","246":"Правило 22: при кораби 50 м и повече топовата светлина се вижда на 6 мили, а бордовите, кърмовата, светлината за влачене и кръгововидимите на 3 мили.","247":"При кораби 50 м и повече бордовите светлини се виждат на 3 мили. Само топовата е на 6 мили.","248":"При кораби 50 м и повече кърмовата светлина се вижда на 3 мили, както бордовите.","249":"При кораби 50 м и повече всички кръгововидими светлини (бяла, червена, зелена, жълта) се виждат на 3 мили.","250":"При кораби от 12 до 50 м топовата светлина се вижда на 5 мили. Изключение са корабите под 20 м, където е 3 мили.","251":"За кораби от 12 до 20 м топовата светлина е с намалена видимост: 3 мили, вместо 5.","252":"При кораби от 12 до 50 м бордовите, кърмовата, светлината за влачене и кръгововидимите се виждат на 2 мили.","253":"При кораби от 12 до 50 м кърмовата светлина се вижда на 2 мили.","254":"При кораби от 12 до 50 м светлината за влачене се вижда на 2 мили, както кърмовата.","255":"При кораби от 12 до 50 м всички кръгововидими светлини се виждат на 2 мили.","256":"При кораби под 12 м бордовите светлини се виждат на 1 миля. Всички останали светлини са на 2 мили.","257":"При кораби под 12 м кърмовата светлина се вижда на 2 мили. Само бордовите са на 1 миля. В официалния файл този отговор е изписан два пъти и тук се приемат и двата.","258":"При кораби под 12 м кръгововидимите светлини се виждат на 2 мили.","259":"Правило 23: кораб с механичен двигател на ход показва топова светлина, бордови светлини и кърмова светлина. Втора топова е задължителна едва от 50 м дължина.","260":"В район B червен знак със зелена хоризонтална лента показва разклонение, при което основният път е наляво. Формата му е конична, като на десните знаци.","261":"Червен знак със зелена лента в район B означава, че основният път е наляво.","262":"Изцяло червен знак в район B огражда дясната страна на фарватера.","263":"Кардиналният знак показва от коя страна на опасността водите са безопасни. Името му казва къде да минеш: северният знак се заобикаля от север.","264":"Кардиналните знаци се поставят в един от четирите квадранта (север, изток, юг, запад) спрямо опасността и носят името на квадранта си.","265":"Кардиналните знаци показват безопасната страна за заобикаляне на опасността. Ползват се и за отбелязване на завой, разклонение или край на плитчина.","266":"Всеки кардинален знак има два конуса един над друг. Различното им разположение показва кой от четирите знака е.","267":"Топовите фигури на кардиналните знаци са винаги черни. Самият знак е в черно и жълто.","268":"Два конуса с върховете нагоре са северният кардинален знак. Върховете сочат „нагоре“, към севера на картата.","269":"Два конуса с основите един към друг (върховете навън) са източният кардинален знак.","270":"Два конуса с върховете надолу са южният кардинален знак. Върховете сочат „надолу“, към юга на картата.","271":"Два конуса с върховете един към друг са западният кардинален знак. Фигурата прилича на винена чаша.","272":"Кардиналните знаци са в черно и жълто. Върховете на конусите сочат къде е черната лента.","273":"Светлините на кардиналните знаци са бели и бързо пробляскващи. Север: непрекъснато, изток: 3, юг: 6 и един дълъг, запад: 9 проблясъка, както по циферблата на часовник.","274":"Черно отгоре и жълто отдолу е северният кардинален знак. Безопасните води са на север от него.","275":"Една топова светлина и двете бордови означават кораб с механичен двигател на ход, по-къс от 50 м, който идва срещу нас.","276":"Две топови светлини, задната по-високо от предната, и двете бордови: кораб с механичен двигател, по-дълъг от 50 м, идващ срещу нас.","277":"Правило 23: от 50 м нагоре корабът с механичен двигател носи две топови светлини (задната по-високо), бордови и кърмова.","278":"Две топови светлини значат кораб над 50 м. Червената бордова светлина е на левия борд, значи виждаме левия му борд и той се движи наляво от нас.","279":"Две топови светлини значат кораб над 50 м. Зелената бордова светлина е на десния борд, значи виждаме десния му борд и той се движи надясно.","280":"Правило 23: корабът на въздушна възглавница добавя жълта кръгововидима пробляскваща светлина към обичайните светлини на кораб с механичен двигател.","281":"Жълтата пробляскваща светлина издава кораб на въздушна възглавница. Топова и двете бордови светлини показват, че идва срещу нас.","282":"Жълтата пробляскваща светлина издава кораб на въздушна възглавница. Вижда се само бялата кърмова светлина, значи гледаме кърмата му.","283":"Високоинтензивна червена пробляскваща кръгововидима светлина носи екранопланът (WIG) при излитане, кацане и полет близо до повърхността.","284":"Екранопланът (WIG) се отличава с високоинтензивна червена пробляскваща светлина. Жълтата пробляскваща е за кораб на въздушна възглавница.","285":"Правило 23: кораб с механичен двигател под 7 м и със скорост до 7 възла може да показва само една бяла кръгововидима светлина.","286":"Правило 24: влачещият кораб носи две топови светлини една над друга (три при влекало над 200 м), бордови, кърмова и жълта светлина за влачене над кърмовата.","287":"Северният кардинален знак е черен отгоре и жълт отдолу, с два конуса с върховете нагоре.","288":"Източният кардинален знак е черен с жълта лента по средата. Конусите му са с основите един към друг.","289":"Южният кардинален знак е жълт отгоре и черен отдолу, с два конуса с върховете надолу.","290":"Черно, жълто, черно отгоре надолу е източният кардинален знак. Безопасните води са на изток от него.","291":"Жълто отгоре и черно отдолу е южният кардинален знак. Безопасните води са на юг от него.","292":"Западният кардинален знак е жълт с черна лента по средата. Конусите му са с върховете един към друг.","293":"Жълто, черно, жълто отгоре надолу е западният кардинален знак. Безопасните води са на запад от него.","294":"Конуси с върховете нагоре и черно над жълто: северен кардинален знак.","295":"Северният знак се познава и по фигурите, и по цвета: два конуса нагоре, черно над жълто.","296":"Конуси с основите един към друг и черно, жълто, черно: източен кардинален знак.","297":"Конуси с върховете надолу и жълто над черно: южен кардинален знак.","298":"Конуси с върховете един към друг и жълто, черно, жълто: западен кардинален знак.","299":"Западният знак се познава по „винената чаша“ от два конуса и по черната лента между две жълти.","300":"Кораб над 50 м, който влачи, носи топовите светлини за влачене една над друга и още една топова на задната мачта, плюс бордови, кърмова и жълта светлина за влачене.","301":"Три топови светлини една над друга означават влекало, по-дълго от 200 м. Допълнителната задна топова показва, че влекачът е над 50 м.","302":"Ромбът е дневният знак при влачене, когато влекалото е по-дълго от 200 м. Вдигат го и влекачът, и влаченият кораб.","303":"При влекало над 200 м и влаченият кораб вдига ромб на видно място.","304":"Топовите светлини една над друга са сигналът за влачене. Няма отделна задна топова, значи влекачът е по-къс от 50 м. Зелената бордова е на десния борд, значи се движи надясно.","305":"Три топови една над друга значат влекало над 200 м, а още една топова отзад значи влекач над 50 м. Зелената бордова показва, че се движи надясно.","306":"Две топови една над друга: влачене от кораб под 50 м. Червената бордова е на левия борд, значи се движи наляво.","307":"При буксиране на борд влекачът носи две топови светлини една над друга, без жълта светлина за влачене. Виждат се бордовите светлини и на двата кораба, значи идват срещу нас.","308":"Тласкачът носи две топови светлини една над друга, бордови и кърмова. Тласканият кораб носи бордови светлини на носа си. Виждат се и двата борда, значи идва срещу нас.","309":"Червено, бяло, червено една над друга значи кораб, ограничен в способността си да маневрира. Три топови значат влекало над 200 м, а задната топова значи влекач над 50 м.","310":"Отзад се виждат бялата кърмова и жълтата светлина за влачене над нея. Червено, бяло, червено показва, че влекачът е ограничен в способността си да маневрира.","311":"Правило 24: незабележим или полупотопен влачен обект носи бяла кръгововидима светлина на предния и на задния край. При ширина до 25 м и дължина до 100 м други светлини няма.","312":"Знакът за отделна опасност се поставя върху малка опасност (скала, потънал кораб), около която водите са плавателни от всички страни.","313":"Знакът за отделна опасност носи две черни сфери една над друга.","314":"Две черни сфери една над друга са топовата фигура на знака за отделна опасност.","315":"Знакът за отделна опасност е черен с една или повече червени хоризонтални ленти.","316":"Светлината е бяла, групово пробляскваща с два проблясъка. Двата проблясъка съответстват на двете сфери.","317":"Черно с червена хоризонтална лента и две черни сфери: знак за отделна опасност.","318":"Черно, червено, черно и две сфери на върха: знак за отделна опасност. Може да се заобиколи от всяка страна.","319":"Черният цвят с червена лента и двете сфери издават знака за отделна опасност, независимо от формата на буя.","320":"Знакът за отделна опасност е поставен върху самата опасност. Заобикаля се на разстояние, от която и да е страна.","321":"Знакът за безопасни води показва, че около него навсякъде е плавателно. Слага се по оста на фарватер или на подхода към пристанище.","322":"Знакът за безопасни води носи една червена сфера на върха.","323":"Знакът за безопасни води е на вертикални червени и бели ленти. Той е единственият знак с вертикални ленти.","324":"Червени и бели вертикални ленти: знак за безопасни води. Формата му е сферична, стълбовидна или веха.","325":"Вертикалните червено-бели ленти и червената сфера на върха означават безопасни води.","326":"Знакът за безопасни води може да се подмине от всяка страна. По правило се оставя откъм левия борд.","327":"Вехата с червени и бели вертикални ленти и червена сфера е знак за безопасни води.","328":"Влаченият полупотопен обект е по-широк от 25 м, затова носи още две бели кръгововидими светлини по краищата на ширината си. Общо са четири.","329":"При дължина над 100 м се добавят бели светлини между предната и задната, така че разстоянието между светлините да не надвишава 100 м. При ширина над 25 м има светлини и по двата края на ширината.","330":"Правило 25: ветроходът носи бордови и кърмова светлина, без топова. На върха на мачтата може да покаже червена над зелена кръгововидима светлина. Виждат се двата борда, значи идва срещу нас.","331":"Ветроход под 20 м може да събере бордовите и кърмовата светлина в един комбиниран фенер на върха на мачтата.","332":"Конус с върха надолу вдига кораб, който върви под ветрила и с работещ двигател. По правилата той се счита за кораб с механичен двигател.","333":"Правило 26: траулерът носи зелена над бяла кръгововидима светлина. Задна топова е задължителна при дължина над 50 м. Червената бордова показва левия му борд.","334":"Зелено над бяло значи кораб, зает с тралене. Без задна топова е под 50 м. Виждат се и двете бордови, значи идва срещу нас.","335":"Два конуса с върховете един към друг са дневният знак на кораб, зает с риболов.","336":"Зелено над бяло значи траулер. Две бели светлини една над друга са допълнителният сигнал „спускам мрежите“. Зелената бордова показва, че се движи надясно.","337":"Зелено над бяло значи траулер. Бяла над червена е допълнителният сигнал „обирам мрежите“. Двете бордови показват, че идва срещу нас.","338":"Две червени светлини една над друга при траулер означават, че тралът е закачен за препятствие. Без ход няма бордови и кърмова светлина.","339":"Зелено над бяло значи траулер, две бели една над друга значат, че спуска трала. Вижда се само кърмовата светлина, значи гледаме кърмата му.","340":"Веха с червени и бели вертикални ленти е знак за безопасни води.","341":"Специалните знаци не ограждат фарватер или опасност. Те отбелязват обекти и райони, описани в картите и лоциите: кабели, полигони, зони за отдих, океанографски станции.","342":"Топовата фигура на специалния знак е един жълт кръст (X).","343":"Специалните знаци са изцяло жълти.","344":"Светлината на специалния знак е жълта, с характеристика, различна от тази на останалите знаци.","345":"Жълтият кръст (X) е топовата фигура на специалния знак.","346":"Изцяло жълт знак с жълт кръст на върха е специален знак.","347":"Жълтият цвят издава специалния знак, каквато и да е формата на буя.","348":"Жълта веха с жълт кръст е специален знак.","349":"Специалните знаци могат да са с всякаква форма. Определящ е жълтият цвят.","350":"Жълт сферичен буй с кръст е специален знак. Знакът за безопасни води е на червено-бели ленти.","351":"Жълт коничен буй е специален знак. Формата може да подсказва от коя страна да го оставиш, но значението е специално.","352":"Правило 26: риболовен кораб, който не трали, носи червена над бяла кръгововидима светлина. Ако уредите му са на повече от 150 м, показва още една бяла светлина в посоката им.","353":"Червено над бяло значи кораб, зает с риболов, но не с тралене. Без бордови и кърмова светлина той няма ход относно водата или лови на котва.","354":"Червено над бяло значи риболовен кораб, който не е траулер. Допълнителната бяла кръгововидима светлина показва посоката на уреди, изнесени на повече от 150 м.","355":"Червено над бяло без бордови светлини: риболовен кораб без ход. Отделната бяла светлина показва посоката на мрежи, изнесени на повече от 150 м.","356":"Зелено над бяло и задна топова: траулер над 50 м. Бяла над червена значи, че обира трала. Червената бордова показва, че се движи наляво.","357":"Зелено над бяло и задна топова: траулер над 50 м. Две бели една над друга значат, че спуска трала. Червената бордова показва, че се движи наляво.","358":"Траулер над 50 м (зелено над бяло и задна топова), който обира трала (бяла над червена). Двете бордови показват, че идва срещу нас.","359":"Червено над бяло и бяла светлина към уредите: риболовен кораб, който не е траулер, с мрежи на повече от 150 м. Двете бордови показват, че идва срещу нас.","360":"Червено над бяло значи риболовен кораб, който не трали. Бялата светлина встрани сочи към мрежите му, а кърмовата светлина показва, че гледаме кърмата.","361":"Траулер над 50 м (зелено над бяло и задна топова), който обира трала (бяла над червена). Зелената бордова показва, че се движи надясно.","362":"Траулер под 50 м (зелено над бяло, без задна топова), който обира трала (бяла над червена). Червената бордова показва, че се движи наляво.","363":"Правило 1: МППСМ важат за всички кораби в открито море и в свързаните с него води, по които могат да плават морски кораби.","364":"Ограничен в способността си да маневрира е кораб, който заради работата си не може да отстъпи път: драгиране, полагане на кабели, обслужване на знаци, тралене на мини, тежко влачене.","365":"Правило 3: корабите са „във видимост един с друг“ само когато единият се вижда от другия с просто око. Радарът и радиовръзката не се броят.","366":"Правило 3: „на ход“ е кораб, който не е на котва, не е завързан за брега и не е заседнал. Той може да е на ход и без да се движи.","367":"В МППСМ „дължина“ е най-голямата дължина на кораба. По нея се определят светлините и звуковите сигнали.","368":"Правило 7: ако компасният пеленг към приближаващ кораб не се променя забележимо, курсовете водят към една точка и има опасност от сблъскване.","369":"Правило 9: в тесен проход корабите под 20 м, ветроходите и риболовните кораби не бива да затрудняват кораб, който може да плава само по фарватера.","370":"Правило 34: два продължителни и два къси звука значат „възнамерявам да ви изпреваря от левия ви борд“. Два къси звука значат „наляво“.","371":"Правило 34: два продължителни и един къс звук значат „възнамерявам да ви изпреваря от десния ви борд“. Един къс звук значи „надясно“.","372":"Съгласието за изпреварване се дава с продължителен, къс, продължителен, къс звук. Това е буквата C по Морзовата азбука, „да“.","373":"Най-малко пет къси звука означават съмнение в намеренията на другия кораб или че той не прави достатъчно, за да избегне сблъскване.","374":"Един продължителен звук подава кораб, който наближава завой или участък, където други кораби може да са скрити зад препятствие.","375":"Кораб, който чуе продължителния сигнал иззад завоя, отговаря със същия: един продължителен звук.","376":"Зелено над бяло значи траулер. Две бели една над друга значат, че спуска трала. Червената бордова е на левия борд, значи се движи наляво.","377":"Зелено над бяло значи траулер. Бяла над червена значи, че обира трала. Зелената бордова е на десния борд, значи се движи надясно.","378":"Червена над зелена кръгововидима светлина на върха на мачтата е допълнителният сигнал на ветроход. Вижда се и бялата кърмова, значи гледаме кърмата му.","379":"Корабите, тралещи по двойки (близначен трал), носят зелено над бяло и може да светят с прожектор напред и към другия кораб. Червената бордова показва, че се движат наляво.","380":"Две червени светлини една над друга при траулер значат, че тралът е закачен за препятствие. Няма бордови светлини, значи корабите нямат ход.","381":"Задната топова светлина показва траулери над 50 м. Зелената бордова е на десния борд, значи се движат надясно.","382":"Правило 27: кораб без управление носи две червени кръгововидими светлини една над друга. Без бордови и кърмова светлина той няма ход относно водата.","383":"Две черни сфери една над друга са дневният знак на кораб без управление.","384":"На един продължителен звук иззад завой се отговаря с един продължителен звук.","385":"Ако свирките са на повече от 100 м една от друга, маневрените и предупредителните сигнали се подават само с едната, за да не се чуват като два сигнала.","386":"Правило 35: кораб с механичен двигател, който има ход, подава един продължителен звук най-малко на всеки 2 минути.","387":"Два продължителни звука на всеки 2 минути подава кораб с механичен двигател, който е на ход, но е спрял и не се движи относно водата.","388":"Един продължителен и два къси звука подават всички кораби с ограничена маневреност в мъгла. Един от тях е корабът, ограничен в способността си да маневрира.","389":"Един продължителен и два къси звука подава и кораб без управление.","390":"Един продължителен и два къси звука подава и кораб, ограничен от своето газене.","391":"Ветроходът също подава един продължителен и два къси звука при ограничена видимост.","392":"Кораб, зает с риболов, подава един продължителен и два къси звука при ограничена видимост.","393":"Кораб, който влачи или тласка друг кораб, подава един продължителен и два къси звука.","394":"Влаченият кораб (последният от влачените, ако има екипаж) подава един продължителен и три къси звука, веднага след сигнала на влекача.","395":"Кораб на котва бие камбана около 5 секунди всяка минута. Може да добави със свирка къс, продължителен, къс звук, за да предупреди приближаващ кораб.","396":"Заседнал кораб подава три отделни удара на камбана, след това учестен звън и отново три отделни удара.","397":"Правило 9: кораб, зает с риболов, не трябва да затруднява движението на никой друг кораб, който плава по тесния проход или фарватера.","398":"Правило 9: кораб под 20 м не трябва да затруднява кораб, който може да плава безопасно само в пределите на тесния проход.","399":"Правило 9: ветроходът не трябва да затруднява кораб, който може да плава безопасно само в пределите на тесния проход.","400":"Правило 9: заставането на котва в тесен проход се избягва, ако обстоятелствата го позволяват, за да не се пречи на движението.","401":"Правило 10: в схема за разделно движение се плава в съответната лента по общата посока на движение за нея.","402":"Правило 10: корабът се държи, доколкото е възможно, настрани от разделителната линия или зона.","403":"Крайбрежната зона е за местно движение. Правило 10 позволява на кораби под 20 м да я използват вместо лентите на схемата.","404":"Ветроходите могат да използват крайбрежната зона до схемата за разделно движение.","405":"Корабите, заети с риболов, също могат да използват крайбрежната зона.","406":"Пилотски кораб при изпълнение на задълженията си добавя четири къси звука към обичайния сигнал за мъгла.","407":"Кораб, ограничен в способността си да маневрира, който работи на котва, не бие камбана, а продължава да подава един продължителен и два къси звука.","408":"Кораб, зает с риболов на котва, подава един продължителен и два къси звука вместо сигнала на кораб на котва.","409":"Правило 35: кораб под 12 м не е длъжен да подава предписаните сигнали, но трябва да подава друг ефективен звуков сигнал на не повече от 2 минути.","410":"Приложение I: задната топова светлина е най-малко 4,5 м по-високо от предната.","411":"Разликата във височината е задължителна. По нея се познава накъде е обърнат корабът: по-ниската светлина е предната.","412":"На кораб от 12 до 20 м топовата светлина е най-малко 2,5 м над планшира.","413":"На кораб над 20 м предната топова светлина е на най-малко 6 м над корпуса. Ако корабът е по-широк от 6 м, височината е равна на ширината, но не е нужно да надхвърля 12 м.","414":"Бордовите светлини са на височина над корпуса не повече от 3/4 от височината на предната топова светлина, за да не се сливат с нея.","415":"Комбинираният фенер за бордовите светлини е най-малко 1 м под топовата светлина.","416":"При две котвени светлини предната е най-малко 4,5 м по-високо от задната.","417":"Крайбрежната зона може да се използва от кораби, които отиват към или идват от пристанище, съоръжение или пилотска станция в нея.","418":"Крайбрежната зона може да се използва за достигане до морско съоръжение или конструкция, които се намират в нея.","419":"Всеки кораб може да влезе в крайбрежната зона, за да избегне непосредствена опасност.","420":"В разделителната зона по правило не се влиза. Изключение се прави за кораби, заети с риболов в самата зона.","421":"Разделителната зона може да се навлиза или пресича при крайна необходимост, за да се избегне непосредствена опасност.","422":"Правило 10: кораб, зает с риболов, не трябва да затруднява никой кораб, който следва по лентата за движение.","423":"Правило 10: кораб под 20 м не трябва да затруднява кораб с механичен двигател, който следва по лентата за движение.","424":"Правило 10: ветроходът не трябва да затруднява кораб с механичен двигател, който следва по лентата за движение.","425":"Кораб, който не използва схемата за разделно движение, се държи възможно най-далеч от нея.","426":"Заставането на котва в схема за разделно движение или близо до краищата ѝ се избягва, доколкото е възможно.","427":"Лентите не се пресичат без нужда. При пресичане курсът е под ъгъл, възможно най-близък до прав, за да е най-кратко времето в лентата.","428":"Правило 12: при различни галсове път отстъпва ветроходът на ляв галс (вятърът идва от левия му борд).","429":"На кораб от 50 м и повече предната котвена светлина е на най-малко 6 м над корпуса.","430":"Топовите светлини трябва да се виждат една над друга и отделно от 1000 м пред носа при всеки нормален диферент на кораба.","431":"Хоризонталното разстояние между двете топови светлини е най-малко половината от дължината на кораба, но не е нужно да е повече от 100 м.","432":"Предната топова светлина е на не повече от 1/4 от дължината на кораба, мерено от носа.","433":"На кораб от 20 м и повече бордовите светлини не се слагат пред предната топова, а зад нея.","434":"Щитовете са матово черни отвътре, за да не отразяват светлината и да не се вижда тя извън сектора си.","435":"Всички дневни знаци са черни: сфера, конус, цилиндър, ромб.","436":"Сферата е с диаметър най-малко 0,6 м.","437":"Конусът е с диаметър на основата най-малко 0,6 м и височина, равна на диаметъра.","438":"Цилиндърът е с диаметър най-малко 0,6 м и височина, два пъти по-голяма от диаметъра.","439":"Ромбът са два конуса с обща основа. Затова диаметърът е най-малко 0,6 м, а височината е два пъти по-голяма.","440":"Знаците се окачват на най-малко 1,5 м един от друг по вертикала, за да се различават отдалеч.","441":"Изстрел или друг експлозивен сигнал на интервали от около една минута е сигнал за бедствие по Приложение IV на МППСМ.","442":"Непрекъснат звук от който и да е апарат за мъгла е сигнал за бедствие по Приложение IV на МППСМ.","443":"Правило 12: при еднакъв галс път отстъпва ветроходът откъм наветрената страна.","444":"Наветрена се счита страната, противоположна на тази, на която е главното ветрило.","445":"Правило 13: изпреварващият кораб стои настрани от пътя на изпреварвания, докато не го подмине окончателно, независимо какъв кораб е.","446":"Изпреварващ е кораб, който приближава от посока повече от 22,5° зад траверса. Нощем от там се вижда само кърмовата светлина.","447":"При съмнение корабът приема, че е изпреварващ, и действа като такъв.","448":"Правило 14: при насрещни курсове и двата кораба завиват надясно и се разминават с левите си бордове.","449":"Правило 15: при пресичащи се курсове път отстъпва корабът, който вижда другия от десния си борд.","450":"Правило 16: отстъпващият кораб действа рано и решително, с ясна промяна на курса или скоростта, за да се размине чисто.","451":"Правило 17: корабът, на който отстъпват път, запазва курса и скоростта си, за да са действията му предвидими.","452":"Правило 18: кораб, зает с риболов, отстъпва път на кораб, ограничен в способността си да маневрира, и на кораб без управление.","453":"Правило 18: кораб без управление е най-горе в реда. На него отстъпват път всички останали, включително риболовните.","454":"По Правило 18 никой кораб, освен тези без управление и с ограничена маневреност, не бива да затруднява кораб, ограничен от своето газене.","455":"Корабът без управление изобщо не може да маневрира, затова според официалния отговор му отстъпва път и корабът с ограничена маневреност.","456":"Непрекъснатият звук от апарат за мъгла е сигнал за бедствие.","457":"Непрекъснатият звук от апарат за мъгла е един от сигналите за бедствие в Приложение IV на МППСМ.","458":"Ракети или гранати с червени звезди, изстрелвани поединично през кратки интервали, са сигнал за бедствие.","459":"Червените звездни ракети през кратки интервали са сигнал за бедствие по Приложение IV на МППСМ.","460":"Червени звезди, изстрелвани една по една през кратки интервали, означават бедствие.","461":"SOS по Морзовата азбука (три точки, три тирета, три точки) е сигнал за бедствие, подаден по какъвто и да е начин.","462":"„Мейдей“ (MAYDAY), казано по радиотелефона, е сигнал за бедствие. Картинката в официалния файл показва друг сигнал за бедствие: вдигане и спускане на разперените ръце.","463":"Флаговете N над C от Международния сигнален код означават бедствие.","464":"Квадратен флаг със сфера над или под него е сигнал за бедствие.","465":"Съчетанието от флагове N и C (Новембер, Чарли) означава „търпя бедствие и се нуждая от незабавна помощ“.","466":"Квадратен флаг и сфера, или нещо подобно на сфера, са един от дневните сигнали за бедствие.","467":"Пламък на кораба, например от горящо буре със смола или масло, е сигнал за бедствие.","468":"Червена парашутна ракета или червен фалшфойер (ръчна факла) е сигнал за бедствие.","469":"Открит пламък на палубата, от горящ съд със смола или масло, е сигнал за бедствие.","470":"Оранжевият дим е дневният сигнал за бедствие.","471":"Правило 18: ветроходът отстъпва път на кораб без управление, на кораб с ограничена маневреност и на кораб, зает с риболов.","472":"Ветроходът не бива да затруднява преминаването на кораб, ограничен от своето газене.","473":"Ветроходът отстъпва път на кораб, ограничен в способността си да маневрира.","474":"Ветроходът отстъпва път на кораб, зает с риболов.","475":"Корабът, ограничен от своето газене, отстъпва път на кораб без управление.","476":"Корабът, ограничен от своето газене, отстъпва път на кораб, ограничен в способността си да маневрира.","477":"Правило 18: корабът с механичен двигател е най-маневрен и отстъпва път на всички останали: без управление, с ограничена маневреност, зает с риболов и ветроход.","478":"Корабът с механичен двигател отстъпва път на кораб, ограничен в способността си да маневрира.","479":"Корабът с механичен двигател отстъпва път на кораб, зает с риболов.","480":"Корабът с механичен двигател отстъпва път на ветроход. Изключение е, когато ветроходът изпреварва.","481":"Правило 19 важи за кораби, които не се виждат един друг, когато плават в район с ограничена видимост или близо до него.","482":"При ограничена видимост всеки кораб плава с безопасна скорост, съобразена с условията.","483":"Кораб с механичен двигател държи машините си готови за незабавна маневра.","484":"Правило 19: ако откриеш друг кораб само с радар, първо определяш дали се развива прекомерно сближаване.","485":"Правило 19: при откриване на кораб само с радар определяш дали има опасност от сблъскване и ако има, маневрираш навреме.","486":"Правило 19: избягва се завой наляво, когато другият кораб е пред траверса, освен ако го изпреварваш. Очаква се той да завие надясно.","487":"Бавно, повтарящо се вдигане и спускане на разперените ръце е сигнал за бедствие.","488":"Този сигнал може да го подаде всеки и без никакви средства: ръцете, разперени встрани, се вдигат и спускат бавно.","489":"Сигналите от Приложение IV се използват само при бедствие и нужда от помощ. Употребата им за друго е забранена.","490":"Забранени са и всички сигнали, които могат да бъдат сбъркани със сигнал за бедствие.","491":"Оранжево платнище с черен квадрат и кръг е сигнал за бедствие, предназначен за разпознаване от въздуха.","492":"Цветното петно от оцветител във водата е сигнал за бедствие и помага на самолет да открие мястото.","493":"Системата на IALA включва пет вида знаци: латерални, кардинални, за отделна опасност, за безопасни води и специални.","494":"Латералните знаци са червени и зелени. Те ограждат лявата и дясната страна на фарватера.","495":"Светлината на латералния знак е в цвета на самия знак: червена или зелена.","496":"Левите латерални знаци са с цилиндрична топова фигура.","497":"Десните латерални знаци са с конична топова фигура с върха нагоре.","498":"Светът е разделен на два района. В район А (Европа, включително Черно море) червеното е отляво, в район B (Америките, Япония, Корея, Филипините) червеното е отдясно.","499":"В район А (Европа и Черно море) червеното огражда лявата страна на фарватера по основната посока за движение. Цилиндричната форма също е на левите знаци.","500":"В район А червеният знак е за лявата страна на фарватера, каквато и да е формата на буя.","501":"Вехата носи цвета на страната си. Червена веха в район А е лява страна на основната посока за движение.","502":"В район А зеленото огражда дясната страна на фарватера. Коничната форма също е на десните знаци.","503":"Правило 19: когато другият ко
