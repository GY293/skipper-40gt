раб е на траверса или зад него, се избягва завой към неговата страна, защото така курсовете се събират.","504":"Правило 19: чуеш ли сигнал за мъгла пред траверса, намаляваш скоростта до най-малката, при която корабът още държи курса си.","505":"Правило 19: плава се с крайна предпазливост, а при нужда ходът се спира напълно, докато опасността от сблъскване отмине.","506":"Правило 20: правилата за светлините и знаците се спазват при всяко време.","507":"Правило 20: светлините се показват от залез до изгрев слънце.","508":"Правило 20: светлините се показват и денем, от изгрев до залез, когато видимостта е ограничена.","509":"Правило 20: светлините може да се включат и във всеки друг случай, когато това се сметне за необходимо.","510":"Правило 20: знаците (сфери, конуси, цилиндри, ромбове) се носят през деня. Нощем ги заместват светлините.","511":"Топовата светлина е бяла.","512":"Топовата светлина е разположена в диаметралната равнина на кораба, тоест по надлъжната му ос.","513":"Топовата светлина свети напред в сектор от 225°: от право по носа до 22,5° зад траверса на всеки борд.","514":"Зелената светлина е на десния борд, червената на левия.","515":"Всяка бордова светлина свети в сектор от 112,5°: от право по носа до 22,5° зад траверса на своя борд. Двете заедно покриват сектора на топовата.","516":"Кърмовата светлина е бяла.","517":"Кърмовата светлина свети назад в сектор от 135°, по 67,5° от всяка страна на кърмата. Заедно с двете бордови покрива пълен кръг от 360°.","518":"Светлината за влачене е жълта и се носи над кърмовата светлина.","519":"Светлината за влачене има същия сектор като кърмовата: 135°.","520":"В район А зеленият знак огражда дясната страна на фарватера по основната посока за движение.","521":"Зелена веха в район А е дясна страна на основната посока за движение.","522":"Червен знак със зелена лента в район А показва разклонение: основният път е надясно. Формата е цилиндрична, като на левите знаци.","523":"Червена веха със зелена хоризонтална лента в район А: основният път е надясно.","524":"Зелен знак с червена лента в район А показва разклонение: основният път е наляво. Формата е конична, като на десните знаци.","525":"Зелено с червена хоризонтална лента в район А: основният път е наляво.","526":"Зелена веха с червена лента в район А: основният път е наляво.","527":"В район B зеленото е за лявата страна на фарватера. Цилиндричната форма е на левите знаци и в двата района.","528":"Две червени кръгововидими светлини една над друга значат кораб без управление. Червената бордова е на левия борд, значи има ход и се движи наляво.","529":"Две червени една над друга значат кораб без управление. Зелената бордова е на десния борд, значи се движи надясно.","530":"Червено, бяло, червено една над друга значи кораб, ограничен в способността си да маневрира. Двете топови показват дължина над 50 м, а зелената бордова, че се движи надясно.","531":"Само червено, бяло, червено, без топови и бордови светлини: кораб, ограничен в способността си да маневрира, без ход относно водата.","532":"Червено, бяло, червено значи ограничена маневреност. Топовите светлини, наредени една над друга, показват, че корабът влачи.","533":"Червено, бяло, червено и само една топова светлина: кораб, ограничен в способността си да маневрира, по-къс от 50 м. Двете бордови показват, че идва срещу нас.","534":"Две топови една над друга са светлините за влачене. Червено, бяло, червено показва, че влекачът е ограничен в способността си да маневрира.","535":"Червено, бяло, червено и бяла кърмова светлина под тях: кораб, ограничен в способността си да маневрира, гледан откъм кърмата.","536":"Сфера, ромб, сфера е дневният знак за ограничена маневреност. Отделната сфера е знакът на кораб на котва.","537":"Жълтата светлина за влачене над бялата кърмова показва влекач, гледан отзад. Червено, бяло, червено показва, че е ограничен в способността си да маневрира.","538":"Драгата носи червено, бяло, червено. Две червени една над друга показват страната с препятствието, две зелени показват страната, от която може да се мине. Бялата светлина долу е кърмовата: драгата е на ход.","539":"Две червени една над друга са откъм препятствието, две зелени са откъм свободната страна. Драга на котва показва тези светлини вместо котвените.","540":"Три зелени кръгововидими светлини, една на мачтата и по една на краищата на реята, носи кораб, който трали мини. Двете топови значат над 50 м, червената бордова, че се движи наляво.","541":"Трите зелени светлини значат тралене на мини. Една топова значи кораб под 50 м, а зелената бордова, че се движи надясно.","542":"Денем корабът, зает с миночистачни дейности, носи три черни сфери: една на мачтата и по една на краищата на реята.","543":"Правило 27: светлините и знаците на миночистача означават, че е опасно да се приближаваш на по-малко от 1000 м от него.","544":"Червено, бяло, червено значи ограничена маневреност. Зелената бордова светлина е на десния борд, значи виждаме десния му борд.","545":"Две червени една над друга и бяла кърмова светлина: кораб без управление, който има ход, гледан откъм кърмата.","546":"Червено, бяло, червено и топови светлини една над друга: влекач с ограничена маневреност. Задната топова показва дължина над 50 м, червената бордова, че се движи наляво.","547":"Червено, бяло, червено и две топови една над друга: влекач под 50 м с ограничена маневреност. Зелената бордова показва, че се движи надясно.","548":"Сфера, ромб, сфера една над друга е дневният знак на кораб, ограничен в способността си да маневрира.","549":"Червено, бяло, червено и топова светлина: кораб с ограничена маневреност на ход. Червената бордова е на левия борд, значи се движи наляво.","550":"Две червени една над друга значат кораб без управление. Бялата кърмова светлина показва, че има ход и че гледаме кърмата му.","551":"Две червени една над друга значат кораб без управление. Зелената бордова показва, че има ход и че виждаме десния му борд.","552":"Флаг „А“ от Международния сигнален код (бяло и синьо, с изрез) означава: „Имам спуснат водолаз, стойте настрана и минавайте бавно“.","553":"Малък кораб, зает с водолазна дейност, показва нощем червено, бяло, червено една над друга, а денем флаг „А“.","554":"Три червени кръгововидими светлини една над друга носи кораб, ограничен от своето газене. Двете топови значат над 50 м, двете бордови, че идва срещу нас.","555":"Три червени една над друга: кораб, ограничен от своето газене. Две топови значат над 50 м, а червената бордова, че се движи наляво.","556":"Три червени една над друга и бяла кърмова светлина: кораб, ограничен от своето газене, гледан откъм кърмата.","557":"Три червени една над друга: кораб, ограничен от своето газене. Две топови значат над 50 м, зелената бордова, че се движи надясно.","558":"Три червени кръгововидими светлини една над друга са сигналът на кораб, ограничен от своето газене.","559":"Черният цилиндър е дневният знак на кораб, ограничен от своето газене.","560":"Топови и бордови светлини се носят само на ход. Кораб на котва показва бели кръгововидими светлини, заседналият добавя две червени, а ветроходът няма топова.","561":"Корабът носи топови и бордови светлини, значи е на ход. Трите червени една над друга показват, че е ограничен от своето газене.","562":"Бяла над червена кръгововидима светлина носи пилотският кораб. Двете бордови показват, че е на ход и идва срещу нас.","563":"Бяло над червено значи пилотски кораб. Зелената бордова е на десния борд, значи се движи надясно.","564":"Бяло над червено значи пилотски кораб. Долната бяла светлина е кърмовата, значи гледаме кърмата му.","565":"Бяло над червено значи пилотски кораб. Червената бордова е на левия борд, значи се движи наляво.","566":"Бяло над червено значи пилотски кораб. Двете бели котвени светлини показват, че е на котва и е по-дълъг от 50 м.","567":"Бяло над червено значи пилотски кораб. Жълтата пробляскваща светлина е сигналът на кораб на въздушна възглавница. Един от отговорите в официалния файл е без текст, само с картинка.","568":"Според официалния отговор това е знакът на пилотски кораб. Нощем той се познава по бялата над червена кръгововидима светлина.","569":"Правило 30: кораб на котва, по-дълъг от 50 м, носи две бели кръгововидими светлини, предната по-високо от задната.","570":"Кораб на котва, по-къс от 50 м, носи една бяла кръгововидима светлина там, където се вижда най-добре.","571":"Заседналият кораб носи котвените си светлини и две червени кръгововидими една над друга. Една бяла значи дължина под 50 м.","572":"Заседнал кораб: две червени една над друга и котвени светлини. Двете бели показват дължина над 50 м.","573":"Три черни сфери една над друга са дневният знак на заседнал кораб.","574":"Правило 30: кораб под 7 м е освободен от котвените светлини и знаци, освен когато е в тесен проход, фарватер, котвена стоянка или там, където обикновено плават други кораби.","575":"Фарватерът е едно от местата, където и кораб под 7 м е длъжен да показва котвени светлини и знак.","576":"Котвената стоянка и районът близо до нея са място, където и кораб под 7 м показва котвени светлини и знак.","577":"Изключението за кораби под 7 м не важи там, където обикновено плават други кораби.","578":"Правило 30: кораб под 12 м не е длъжен да показва светлините и знаците на заседнал кораб.","579":"Правило 33: кораб от 12 м нагоре има свирка, от 20 м нагоре и камбана. Затова за 12 до 100 м отговорът е свирка и камбана.","580":"Кораб от 100 м нагоре има и гонг. Той се бие на кърмата, за да се различава от камбаната на носа.","581":"Правило 34: един къс звук (или проблясък) значи „изменям курса си надясно“.","582":"Два къси звука (или проблясъка) значат „изменям курса си наляво“.","583":"Три къси звука (или проблясъка) значат „машините ми работят на заден ход“.","584":"Два продължителни и един къс звук в тесен проход: „възнамерявам да ви изпреваря от десния ви борд“.","585":"Продължителен, къс, продължителен, къс е отговорът „съгласен съм да бъда изпреварен“.","586":"Най-малко пет къси и бързи звука означават съмнение, че другият кораб прави достатъчно, за да избегне сблъскване.","587":"Един продължителен звук подаваш, когато наближаваш завой или участък, където друг кораб може да е скрит зад препятствие.","588":"Един продължителен звук от друг кораб в тесен проход значи, че той наближава завой или препятствие и може да не те вижда.","589":"Знакът за нова навигационна опасност (например скорошно корабокрушение) е на сини и жълти вертикални ленти и се поставя, докато опасността бъде нанесена на картите.","590":"Три зелени светлини във формата на триъгълник значат тралене на мини. Две топови значат над 50 м, червената бордова, че се движи наляво.","591":"При кораби под 12 м кърмовата светлина се вижда на 2 мили. Само бордовите светлини са на 1 миля.","592":"При кораби под 12 м всички кръгововидими светлини се виждат на 2 мили.","593":"Шквалът е внезапно и кратко рязко усилване на вятъра, често със смяна на посоката.","594":"Местните признаци са наблюдения на небето, облаците, вятъра и животните. По тях времето се прогнозира без прибори.","595":"Дъното и брегът отклоняват, свиват и ускоряват теченията. Край носове и в проливи течението е по-силно.","596":"Край брега мястото на кораба се проверява по видими ориентири и с радар. Двата начина се контролират взаимно.","597":"С един ориентир мястото се определя по пеленг и разстояние (от вертикалния ъгъл на ориентира) или с крюйс-пеленг: два пеленга към него в различно време.","598":"Локсодромията пресича всички меридиани под един и същ ъгъл. На меркаторска карта меридианите са успоредни, затова тя е права линия.","599":"Височината на вълните зависи от скоростта на вятъра, от това колко дълго духа, от посоката му и от разгона, тоест разстоянието над вода, по което действа.","600":"Според официалния отговор навигационният ориентир на нос Галата е фарът с пробляскваща светлина.","601":"Аладжа банка е плитчина пред курорта Златни пясъци, северно от Варна.","602":"Според официалния отговор плаващият знак огражда Аладжа банка откъм изток, тоест откъм открито море.","603":"Между нос Екрене и Албена брегът е нисък и пясъчен, с плажове.","604":"Фар Екрене е на едноименния нос край Кранево, на север от Златни пясъци.","605":"Нос Свети Атанас е при Бяла, на юг от устието на река Камчия.","606":"Нос Калиакра е висок скалист нос с отвесни червеникави скали. Името му идва от тях.","607":"Нос Емине е краят на Стара планина при морето: висок и стръмен, с наклонени светли скални пластове.","608":"Изобатите свързват точки с еднаква дълбочина. Изогоните са за магнитното склонение, изобарите са за налягането.","609":"Според официалния отговор магнитна аномалия има в района на Бургаския залив. Там компасът може да показва неточно.","610":"Вятърът е движение на въздуха от област с високо налягане към област с ниско налягане.","611":"Вятърът се назовава по посоката, от която духа. „Вятърът влиза в компаса, течението излиза от него.“","612":"Посоката на вятъра се отчита в румбове (N, NE, E и т.н.).","613":"Скалата на Бофорт е от 0 (щил) до 12 бала (ураган). Силата може да се даде и като скорост в метри в секунда.","614":"Анемометърът измерва скоростта на вятъра.","615":"На движещ се кораб се измерва относителният (привидният) вятър. Той е сбор от истинския вятър и вятъра, който създава ходът на кораба.","616":"Фордевинд е вятър право откъм кърмата.","617":"Бакщаг е вятър откъм кърмовите ъгли, косо отзад по левия или десния борд.","618":"Термографът записва температурата непрекъснато върху лента за денонощие или седмица. Барографът прави същото за налягането.","619":"Атмосферното налягане се измерва с барометър анероид.","620":"Психрометърът измерва влажността по разликата между сух и мокър термометър.","621":"Падащото налягане означава приближаващ циклон: вятър, облаци и валежи.","622":"Устойчиво високо налягане означава антициклон: тихо и ясно време за по-дълго.","623":"Денем сушата се нагрява по-бързо от морето. Въздухът над нея се издига и на негово място идва по-хладен въздух от морето. Нощем бризът се обръща.","624":"При хубаво време бризът сменя посоката си редовно: денем от морето, нощем от сушата. Ако този ритъм се наруши, идва друга въздушна маса и времето се разваля.","625":"При хубаво време вятърът вечер отслабва. Ако на залез се усилва и се върти по часовниковата стрелка, наближава фронт и може да се очаква щорм.","626":"Нормално нощта е по-хладна от деня. По-топла нощ означава нахлуване на топъл и влажен въздух пред циклон, тоест влошаване.","627":"Това е обичайният денонощен ход на влажността при ясно време: денем въздухът се затопля и изсъхва, вечер изстива и влажността расте.","628":"„Червено небе сутрин, моряко, пази се.“ Пурпурната зора показва много влага във въздуха и приближаващ фронт с вятър и дъжд.","629":"Халото се получава от ледени кристалчета във високи перести облаци. Те обикновено изпреварват топъл фронт с дъжд и вятър.","630":"Според народните признаци червената луна при изгрев предвещава вятър.","631":"Според местните признаци чайки, които спокойно стоят на водата, предвещават хубаво време. Пред буря те се прибират към брега.","632":"Птиците летят високо, когато въздухът изсъхва и налягането се покачва. Затова при дъжд това е признак за подобряване.","633":"Вятърът трие повърхността на водата и предава енергията си на водните частици. Така възникват ветровите вълни.","634":"Вълнението, както и вятърът, се назовава по посоката, от която идва.","635":"Посоката на вълнението се дава в румбове, както и посоката на вятъра.","636":"Състоянието на морето се оценява по скала от 0 до 9 бала. Вятърът е по скала от 0 до 12 бала.","637":"Мъртвото вълнение (зиб) са дълги, гладки вълни, които продължават, след като вятърът е спрял, или идват от далечна буря.","638":"Прибоят е разбиването на вълните в самия бряг, особено в стръмен и скалист.","639":"Буруните са вълни, които се разбиват над плитчина или риф далеч от брега. Бялата пяна издава опасното място.","640":"Морското течение е постъпателно пренасяне на водни маси в хоризонтална посока.","641":"Според официалния отговор основните причинители на течения са приливообразуващите сили на Луната и Слънцето. Другите отговори описват ветрови течения и влияния върху тях.","642":"Течението се назовава по посоката, към която тече: „излиза от компаса“. Вятърът е обратно, по посоката, от която идва.","643":"Скоростта на течението се дава в метри в секунда или във възли.","644":"Посоката на течението се дава в румбове или в градуси по кръговата система, от 0° до 360°.","645":"Дрейфът е отнасянето на кораба от вятър или течение встрани от курса му, спрямо дъното.","646":"В мъгла край брега скоростта се намалява, за да има време за реакция и корабът да спре на по-късо разстояние.","647":"В мъгла двигателят трябва да е готов за незабавна промяна на хода: намаляване, спиране или заден ход. Това изисква и Правило 19 от МППСМ.","648":"Според официалния отговор при скоростни изпитания курсът се държи по магнитния компас.","649":"Хронометърът показва гринуичко време (UTC). То е нужно за астрономическите изчисления и за определяне на географската дължина.","650":"Според официалния отговор Ставро банка е на юг-югоизток от нос Поморие, в Бургаския залив.","651":"Секторен фар показва различен цвят в различни сектори и така очертава безопасния подход. Според официалния отговор такъв има на остров Света Анастасия в Бургаския залив.","652":"Бюлетинът за времето и морето се излъчва на УКВ канал 26. Канал 16 е за бедствие и повикване.","653":"Часовете се дават по UTC. Обърни внимание, че в този въпрос са само 07,33 и 19,33, а във въпрос 6 има и 13,33.","654":"Основното черноморско течение обикаля морето обратно на часовниковата стрелка. Край нашия бряг то тече от север към юг.","655":"На българските морски карти дълбочините са в метри. Мерната единица е посочена в заглавието на картата.","656":"Лотът измерва дълбочина. Лагът измерва скорост и изминато разстояние.","657":"Ехолотът измерва дълбочината по времето, за което звуков импулс стига до дъното и се връща. Работи непрекъснато и при всякаква скорост.","658":"Ръчният лот е тежест на въже. Използва се до около 50 м дълбочина и при скорост до 3 възла, иначе въжето не пада отвесно.","659":"Лотлинът е размерен с кожени марки с различна форма. Те се разпознават и на пипане в тъмното.","660":"В основата на тежестта има вдлъбнатина, която се намазва с лой. По полепналите частици се познава грунтът: пясък, тиня, раковини.","661":"Вибраторът на ехолота е в дъното на кораба, затова уредът показва дълбочината под кила. За дълбочината на мястото се добавя газенето.","662":"Според официалния отговор лотлинът на ръчния лот е дълъг 52 метра.","663":"Меридианите на картата сочат истинския север, затова на нея се чертаят истински курсове. Компасният курс се получава после с поправката на компаса.","664":"Звездният глобус показва само най-ярките, навигационните звезди. Слънцето, Луната и планетите менят мястото си и се нанасят при нужда.","665":"Заради пречупването на светлината в атмосферата виждаме Слънцето по-високо, отколкото е. При истинския изгрев долният му край изглежда на около 2/3 диаметър над хоризонта.","666":"Видимият изгрев е моментът, в който горният край на Слънцето се показва на хоризонта.","667":"Щитовете са матово черни, за да не отразяват светлината извън сектора на бордовата светлина.","668":"Правило 6 от МППСМ: всеки кораб се движи с безопасна скорост по всяко време, не само при мъгла.","669":"В полукръговата система се брои от север или юг към изток или запад, от 0° до 180°.","670":"В четвъртната система хоризонтът е на четири четвърти (NE, SE, SW, NW). Във всяка се брои от 0° до 90° от север или от юг.","671":"Румбовата система дели хоризонта на 32 румба: N, NNE, NE и т.н.","672":"360° се делят на 32 румба, така че един румб е 11,25°.","673":"Истинският курс е ъгълът между северната част на истинския меридиан и носа на кораба, броен по часовниковата стрелка.","674":"Ъгъл, който започва от север и стига до диаметралната равнина на кораба (посоката на носа), е курс. Щом е от истинския меридиан, е истински курс.","675":"Пеленгът е посоката от кораба към предмет, мерена от север. Истинският пеленг се мери от истинския меридиан.","676":"Курсовият ъгъл се мери от носа на кораба, а не от север, до посоката към предмета.","677":"Курсовият ъгъл е между диаметралната равнина на кораба и посоката към предмета.","678":"Истинският курс се брои по кръговата система от 0° до 360°, по часовниковата стрелка от север.","679":"Ъгъл от северната част на истинския меридиан до посоката към ориентира е истински пеленг.","680":"Картата е ориентирана по истинския север, затова на нея се работи само с истински курсове и пеленги.","681":"Курсовият ъгъл се брои от носа към левия или към десния борд, от 0° до 180°.","682":"Ориентирът е вдясно от носа, затова ъгълът между носа и посоката към него е курсов ъгъл десен борд.","683":"Курсовете и пеленгите се чертаят с навигационен транспортир или триъгълник и паралелна линия. Пергелът е за мерене на разстояния.","684":"Към истинския курс се прибавя курсовият ъгъл, ако предметът е отдясно, и се изважда, ако е отляво. Така се получава истинският пеленг.","685":"Главният магнитен компас е поставен високо, далеч от корабното желязо, и има най-малка девиация. Затова показанията му са най-точни.","686":"Магнитната стрелка застава по магнитния меридиан, в направление север-юг.","687":"Чувствителният елемент е картушката с магнитите. Тя е частта, която показва посоката.","688":"Кардановото окачване държи компаса хоризонтален при клатене на кораба.","689":"Девиационният прибор съдържа магнити и меко желязо в нактоуза. Те компенсират магнитното поле на самия кораб и намаляват девиацията.","690":"В компаса има разтвор на етилов спирт във вода. Той не замръзва и успокоява люлеенето на картушката.","691":"Магнитните полюси не съвпадат с географските. Затова магнитната стрелка не сочи истинския север и има магнитно склонение.","692":"Магнитното склонение е ъгълът между истинския и магнитния меридиан. Дължи се на магнитното поле на Земята.","693":"Склонението е различно за всеки район и се променя с годините. Взема се от картата, където е дадено заедно с годишното изменение.","694":"Изогоните свързват точки с еднакво магнитно склонение. Изобатите са за дълбочините, изобарите са за налягането.","695":"Девиацията е отклонението на стрелката от магнитния меридиан. Причинява се от желязото и електрическите уреди на самия кораб.","696":"Картушката е разграфена по кръговата система, от 0° до 360°.","697":"Девиацията е различна за всеки кораб и за всеки курс. Взема се от таблицата за девиация на компаса.","698":"При смяна на курса корабното желязо заема друго положение спрямо магнитния меридиан, затова девиацията се променя.","699":"Девиацията се определя и таблицата се обновява всяка година, както и след ремонт или промяна по кораба.","700":"Общата поправка на компаса е алгебричният сбор на склонението и девиацията, всяко със знака си: източните са плюс, западните минус.","701":"ΔК = d + δ, със знаците им. Това е общата разлика между компасния и истинския север.","702":"Компасът показва компасния курс. В него още не са отчетени девиацията и склонението.","703":"Пеленг, взет по магнитния компас, е компасен пеленг. За да се нанесе на картата, се поправя с ΔК.","704":"Компасният курс се поправя с общата поправка със знака ѝ и се получава истинският курс: ИК = КК + ΔК.","705":"Ъгълът е измерен от истинския меридиан (Nи) до носа на кораба, значи е истински курс.","706":"Ъгълът е измерен от магнитния меридиан (Nм) до носа на кораба, значи е магнитен курс.","707":"Ъгълът е измерен от компасния меридиан (Nк) до носа на кораба, значи е компасен курс.","708":"Ъгълът между истинския (Nи) и компасния (Nк) меридиан е общата поправка на компаса ΔК.","709":"Ъгълът между истинския (Nи) и магнитния (Nм) меридиан е магнитното склонение.","710":"Ъгълът от истинския меридиан до посоката към ориентира е истински пеленг.","711":"Ъгълът от носа на кораба до ориентир вдясно е курсов ъгъл десен борд.","712":"Истинският курс плюс курсовия ъгъл десен борд дава истинския пеленг: ИП = ИК + КЪ.","713":"Обратният пеленг е посоката от ориентира към кораба. Той се различава от правия със 180°.","714":"Ъгълът от компасния меридиан (Nк) до посоката към ориентира е компасен пеленг.","715":"Обратният курс е посоката, противоположна на носа, тоест курсът плюс или минус 180°.","716":"Компасният пеленг се поправя с общата поправка на компаса, както курсът: ИП = КП + ΔК.","717":"Компасният и магнитният курс се различават само с девиацията δ. Склонението d свързва магнитния курс с истинския, затова отговорите с d са грешни.","718":"Д = 2,08√e дава далечината на видимия хоризонт. Тук e е височината на окото на наблюдателя в метри.","719":"На картите далечината на видимост на фаровете е изчислена за височина на окото 5 м. За друга височина се прави поправка.","720":"Във формулата височината е в метри, а резултатът се получава в морски мили.","721":"Ориентирът се вижда оттам, откъдето се срещат двата хоризонта: този на наблюдателя и този на върха на ориентира. Затова Д = 2,08√e + 2,08√H.","722":"Разстоянията в морето се измерват в морски мили.","723":"Морската миля е 1852 метра.","724":"Морската миля е дължината на една минута дъга от меридиана. Приетата стойност 1852 м отговаря на ширина около 45°.","725":"Кабелтът е една десета от морската миля, тоест около 185 метра.","726":"Кабелтът е единица за разстояние. С него се дават малки разстояния, например при разминаване и маневри.","727":"Според официалния отговор саженът не се използва в съвременното корабоплаване. Среща се на стари карти като мярка за дълбочина.","728":"Един фут е 0,3048 м. Един ярд е 0,914 м, един инч е 2,54 см.","729":"Един сажен (морски фатом) е 6 фута, тоест 1,828 м.","730":"Една минута от географската ширина е една морска миля. Затова разстоянията се мерят по вертикалната рамка на картата.","731":"Мерните единици за дълбочините и височините са посочени в заглавието на картата.","732":"Скоростта на кораба се измерва във възли. Един възел е една морска миля в час.","733":"Разстоянието се взема с пергел и се отчита по вертикалната рамка (ширината), на същата ширина. Хоризонталната рамка не дава мили.","734":"Лагът измерва скоростта на кораба спрямо водата.","735":"Лагът отчита и изминатото разстояние, както километражът в автомобил.","736":"Един възел е скорост от една морска миля за един час (1,852 км/ч).","737":"Разстояние = скорост по време: 7 възла по 2 часа са 14 морски мили.","738":"Пътевите карти са с подходящ мащаб за плаване край брега. Генералните са за общо планиране, а плановете са за пристанища и заливи.","739":"При мащаб 1:150 000 един сантиметър отговаря на 150 000 см, тоест на 1,5 км.","740":"При меркаторската проекция земната повърхност се проектира върху цилиндър. Меридианите и паралелите стават прави, взаимно перпендикулярни линии.","741":"Ортодромията е дъга от голям кръг и е най-късият път между две точки на кълбото.","742":"Локсодромията пресича всички меридиани под един и същ ъгъл, затова по нея се плава с постоянен курс.","743":"Морските навигационни карти са в меркаторска проекция, защото на нея курсът с постоянен ъгъл е права линия и ъглите се запазват.","744":"Първо се пеленгуват ориентирите по носа или кърмата, защото пеленгът им се мени бавно. Тези близо до траверса се менят бързо и се вземат последни.","745":"Крюйс-пеленгът се прилага, когато има само един ориентир.","746":"Ориентирът се пеленгува два пъти през известно време. Между двата пеленга се отчита изминатото по лага разстояние и курсът.","747":"Трите пеленга рядко се пресичат в една точка. Образуват малък триъгълник на грешките и мястото се приема вътре в него.","748":"Прокладката е графичното водене на пътя на кораба върху картата: курсове, изминати разстояния и определени места.","749":"Според официалния отговор добрата морска практика изисква разминаване на не по-малко от 20 кабелта (2 мили).","750":"Racon е радиолокационен маяк-отговорител. Когато го облъчи корабен радар, той връща кодиран сигнал, който се вижда на екрана като черта зад знака.","751":"Компасът сочи магнитния полюс. Между географския и магнитния северен полюс корабът може да плава към географския север, а магнитният полюс да остава зад него.","752":"Галсът се назовава по борда, от който идва вятърът. Тук вятърът идва от десния борд, значи ветроходът е на десен галс.","753":"Галсът се назовава по борда, от който идва вятърът. Тук вятърът идва от левия борд, значи ветроходът е на ляв галс.","754":"МППСМ са задължителни за всички кораби, включително военните и най-малките.","755":"Така се означава мол: изградено съоръжение, което навлиза в морето и пази пристанището от вълните.","756":"Стрелката показва посоката на приливното течение, а числото до нея показва скоростта му във възли.","757":"Така се означава дълбочина, за която е докладвано, но не е потвърдена с измерване.","758":"Това е знакът за водорасли. Те пречат на котвата да държи и могат да се намотаят на винта.","759":"Така се означават скали, които стърчат над водата. Числото в скоби е височината им.","760":"Това е знакът за потънал кораб, част от корпуса на който се вижда над водата.","761":"Така се означават останки от потънал кораб, от който над водата се показват само мачтите.","762":"Така се означава подводно препятствие. Числото е най-малката дълбочина над него.","763":"Това е знакът за останки от потънал кораб, които са опасни за плаване и над които дълбочината не е известна.","764":"Това е знакът за останки от потънал кораб с неизвестна дълбочина над тях.","765":"Така се означава платформа в морето, например за добив на газ, с името или обозначението ѝ.","766":"Прекъснатата окръжност е зона за безопасност около съоръжение в морето. В нея не се влиза, обикновено на 500 м от съоръжението.","767":"Земята е леко сплесната при полюсите и с неравна повърхност. Точното име на формата ѝ е геоид.","768":"Средният радиус на Земята е 6371 км.","769":"Основните точки и линии са двата полюса, екваторът, паралелите и меридианите. Върху тях е изградена координатната мрежа.","770":"Земята се върти от запад на изток. Затова Слънцето изгрява от изток.","771":"Гледано откъм северния полюс, въртенето от запад на изток е обратно на часовниковата стрелка.","772":"Ширината се брои от екватора, а дължината от гринуичкия меридиан. Те са началото на географските координати.","773":"Екваторът дели Земята на северно и южно полукълбо.","774":"Гринуичкият меридиан, заедно с меридиана 180°, дели Земята на източно и западно полукълбо.","775":"Отвесът сочи надолу към надира. Точката право нагоре над наблюдателя е зенитът.","776":"Ширината се брои от екватора (0°) до полюса (90°), на север или на юг.","777":"Дължината се брои от гринуичкия меридиан (0°) до 180°, на изток или на запад.","778":"Паралелите са хоризонтални линии, затова ширината се отчита по страничните, вертикални рамки на картата.","779":"Меридианите са вертикални линии, затова дължината се отчита по горната и долната, хоризонтални рамки.","780":"N означава северна ширина, E означава източна дължина. Това са координати край Варна.","781":"S означава южна ширина, W означава западна дължина.","782":"Меридианът е линията север-юг. Перпендикулярната на него посока е изток-запад (първият вертикал).","783":"Истинският меридиан минава през двата полюса, затова определя посоката север-юг.","784":"На северния полюс всяка посока води на юг. На южния полюс всяка посока е на север.","785":"По кръговата система хоризонтът е разделен от 0° до 360°.","786":"Брои се от север през изток, по часовниковата стрелка: изток е 90°, юг е 180°, запад е 270°.","787":"Предварителната прокладка е планът на рейса преди тръгване. Действителната се води по време на плаването.","788":"За прокладка са нужни транспортир и паралелна линия за ъглите, пергел за разстоянията и молив.","789":"Лоцията описва района на плаване: брегове, опасности, ориентири, пристанища, течения, и дава препоръки за безопасно плаване.","790":"Фарът е основният брегови ориентир: висок, вижда се отдалеч и свети с характеристика, записана на картата.","791":"Плаващото ограждане са буйовете, баканите и вехите. Фаровете, створовете и знаците на брега са брегово ограждане.","792":"Буят се разпознава денем по форма, цвят и топова фигура, а нощем по светлината си.","793":"Латералните знаци ограждат страните на фарватерите и каналите: в район А червено отляво, зелено отдясно.","794":"Кардиналните знаци ограждат опасности като рифове, банки и плитчини и показват от коя страна да се заобиколят.","795":"Правило 19: при ограничена видимост се плава с безопасна скорост, съобразена с условията.","796":"Правилата за отстъпване на път важат само за кораби във видимост един с друг. В мъгла никой няма предимство и всеки сам избягва сближаването.","797":"Вълнообразната линия означава подводен кабел. Над него не се застава на котва и не се трали.","798":"Така се означава подводен тръбопровод, с надпис за нефт или газ. Над него не се застава на котва.","799":"Това са створни знаци: два знака един зад друг. Когато се покрият, корабът е на линията на створа, която води по безопасния път.","800":"Това е препоръчан път. Числото показва най-голямото газене, с което може да се мине по него.","801":"Това е точка за докладване. При преминаването ѝ корабът се обажда по радиото на службата за управление на трафика.","802":"Котвата означава място, подходящо за заставане на котва.","803":"Котва в оградена с пунктир площ означава котвена стоянка, тоест определен район за стоене на котва.","804":"Линията с рибки означава граница на риболовна зона.","805":"Плътната линия е брегова линия, която е заснета точно.","806":"Прекъснатата линия е брегова линия, която не е изследвана или е нанесена приблизително.","807":"Щрихите към морето означават стръмен, скалист бряг.","808":"Точките покрай бреговата линия означават пясъчен бряг.","809":"Числата на сушата са височини на отделни точки от брега. По тях се разпознава релефът.","810":"Това е въздушен електропровод над водата. Числото е безопасната височина за преминаване под него.","811":"Това е слип или рампа: наклонена площадка за спускане и изваждане на лодки.","812":"Кръстче с точки около него означава опасна подводна скала с неизвестна дълбочина над нея.","813":"Това е знакът за плаващ фар: кораб или голям буй със светлина на фар.","814":"Секторната светлина свети с различен цвят в различни сектори. Цветът подсказва дали си в безопасните води.","815":"Така се означава светлина, която се вижда отвсякъде, освен в показания сектор, където е закрита.","816":"Това е картният знак за коничен буй. Точното му място е в малкото кръгче в основата на знака.","817":"Това е знакът за веха: висок тънък прът, закрепен на дъното.","818":"Това са швартови буйове. За тях корабът се връзва, без да отдава котва.","819":"Източният кардинален знак свети с 3 проблясъка: много бързо (VQ) на всеки 5 секунди или бързо (Q) на всеки 10. Три, както цифрата 3 на часовника е на изток.","820":"Западният кардинален знак свети с 9 проблясъка: много бързо на всеки 10 секунди или бързо на всеки 15. Девет, както цифрата 9 на часовника е на запад.","821":"Знакът за изолирана опасност е с две черни сфери и светлина с два бели проблясъка, Fl(2).","822":"Северният кардинален знак свети с непрекъснато бързо или много бързо пробляскване, без групи.","823":"Според официалния отговор така на българските карти се означават подводни скали.","824":"Така се означава навигационен ориентир. Числата дават височината му над водата и височината на самото съоръжение.","825":"„ПП“ значи „положението е приблизително“. Мястото на обекта не е нанесено точно.","826":"„ПС“ значи „положението е съмнително“. Има данни за обекта, но мястото му не е потвърдено.","827":"„Пр“ значи пробляскваща светлина: проблясъкът е по-кратък от тъмната пауза.","828":"„Зтм“ значи затъмняваща светлина: свети почти постоянно и угасва за кратко.","829":"До навигационна светлина „П“ значи постоянна светлина, която свети без прекъсване.","830":"Числото в скоби е броят проблясъци в група. „Пр(2)“ е групово пробляскваща светлина с по два проблясъка.","831":"Буквите във водата описват грунта. „Т“ значи тиня.","832":"Във водната площ „П“ значи пясък. До светлина същата буква значи „постоянна“.","833":"„Р“ като означение на грунта значи раковини.","834":"Означенията на грунта се съчетават: „ТР“ е тиня и раковини.","835":"„РФ“ значи радиофар: станция, която излъчва радиосигнал за пеленговане.","836":"Записът се чете подред: вид светлина и брой проблясъци, период, далечина на видимост и сигнал за мъгла. Тук са 3 проблясъка за 15 секунди, 25 мили и буква „н“ за мъгла.","837":"Три проблясъка в група имат източните кардинални знаци. „Ч“ значи чести проблясъци, 10с е периодът, а „рев.“ значи, че буят има ревун.","838":"Флаг „T“ е на три вертикални ивици: червена, бяла и синя. Значи „Стойте настрана от мен“, първоначално за кораби, тралещи по двойки.","839":"Флаг „H“ е наполовина бял и наполовина червен, разделен вертикално: „Имам пилот на борда“.","840":"Флаг „N“ е на сини и бели квадрати като шахматна дъска: „Не“.","841":"Флаг „G“ е на жълти и сини вертикални ивици: „Нужен ми е пилот“.","842":"Флаг „Q“ е изцяло жълт: „Корабът ми не е заразен и моля за свободна практика“, тоест за разрешение за връзка с брега.","843":"Флаг „M“ е син с бял диагонален кръст. За изпита запомни официалния отговор. В действащия Международен сигнален код „M“ значи „Корабът ми е спрян и няма ход“.","844":"Флаг „B“ е червен, с изрез като лястовича опашка: „Товаря, разтоварвам или превозвам опасен товар“.","845":"Флаг „O“ е разделен по диагонал на жълто и червено: „Човек зад борда“.","846":"Флаг „U“ е на четири квадрата, червени и бели: „Отивате към опасност“.","847":"Флаг „V“ е бял с червен диагонален кръст: „Нужна ми е помощ“.","848":"Флаг „C“ е на хоризонтални ивици: синя, бяла, червена, бяла, синя. Значи „Да“."};

irection:",["North–south.","East–west.","North–east.","Towards the poles."]],"783":["The plane of the true meridian defines the direction:",["East–west.","North–east, west, south.","North–south.","Towards the observer's point."]],"784":["At which point on the globe will there only be the direction SOUTH?",["At the South Pole.","At the intersection of the equator and the prime meridian.","At the North Pole.","At any point on the Antarctic Circle."]],"785":["In the circular system of reading directions, the observer's plane is divided:",["From 0° to 180°.","From 0° to 90°.","From 0° to 360°.","From −180° to +180°."]],"786":["In the circular system of reading directions, counting goes:",["From north to west (anticlockwise).","From north to east (clockwise).","From north to east or west, from 0° to 180°.","From north, in either direction."]],"787":["The types of chart plotting are:",["Day and night.","Sea and river.","Preliminary and actual.","At the chart scale and at a scale different from the chart's."]],"788":["The instruments needed for chart plotting are:",["A lead line, a psychrometer, an anemometer.","A protractor, a parallel rule, dividers, a pencil.","A barograph, a thermograph, an aneroid, a hydrograph.","A pencil, a ruler and dividers."]],"789":["Pilotage, as a branch of navigation, deals with:",["Methods of fixing the vessel's position.","The description of an area and recommendations for safe navigation.","The correct loading and care of cargo on board.","Handling a vessel under sail."]],"790":["The main shore navigational landmark marked on the nautical chart is:",["A lighthouse.","A radio beacon.","A buoy.","A shore radar station."]],"791":["The floating aids to navigation are:",["Currents, waves, ice.","A lighthouse, a light, a navigation mark, leading marks, a pylon.","A spar buoy, a small buoy (\"bakan\"), a buoy.","Floating probes."]],"792":["A sea buoy is:",["A day and night floating navigational aid.","A daytime navigational aid only.","A leading s autical chart means:",["Anchoring prohibited.","A safe place where the anchor may be paid out.","A place on passing which the anchor must be made ready for letting go.","A place for anchoring."]],"803":["The symbol on the nautical chart means:",["An anchorage area.","A place where anchoring is prohibited.","An area where anchoring is prohibited.","An anchorage for vessels carrying dangerous cargo."]],"804":["The symbol on the nautical chart means:",["The usual route of fish shoals.","The limit of a fishing zone.","A zone in which only fishing vessels may navigate.","A zone where passage of all vessels is prohibited."]],"805":["The symbol on the nautical chart means:",["A coastline with a beach.","A coastline with desert.","A surveyed coastline.","An unsurveyed coastline."]],"806":["The symbol on the nautical chart means:",["A coastline with desert.","A coastline with a beach.","An unsurveyed coastline.","An approximately charted coastline."]],"807":["The symbol on the nautical chart means:",["A coast with woodland in the coastal zone.","A coast with dunes near the shore.","An unsurveyed coastline.","A steep rocky coast."]],"808":["The symbol on the nautical chart means:",["A coast with dunes near the shore.","An approximately charted coastline.","An unsurveyed coastline.","A sandy shore."]],"809":["The symbol on the nautical chart means:",["Triangulation points.","Approximate values of the charted heights.","Spot heights on the shore.","Approximately charted positions of heights."]],"810":["The symbol on the nautical chart means:",["A submarine pipeline.","A high-voltage cable on pylons, with the safe vertical clearance shown.","A place where a ferry connecting the two shores runs.","A line on which anchoring is prohibited."]],"811":["The symbol on the nautical chart means:",["A place where submarine cable(s) run through the water.","A slipway, ramp.","Line(s) on which anchoring is prohibited.","Place(s) from which a ferry line starts."]],"812":["The symbol on the nautical chart means:",["A danger to navigation that is above the water.","Dangerous underwater rocks with unknown depth over them.","Rocks visible above the water.","A place where an unknown vessel sank."]],"813":["The symbol on the nautical chart means:",["An anchored pilot station showing a red light.","A floating VHF broadcasting station.","A light vessel (lightship).","A buoy with a cross-shaped topmark, showing red."]],"814":["The symbol on the nautical chart means:",["A sector light.","An all-round light with a sector in which it is not visible.","An all-round light with a sector in which it shows red.","An all-round light with a sector in which navigation is prohibited."]],"815":["The symbol on the nautical chart means:",["An all-round light with a sector in which it is not visible.","An all-round light with a sector in which it shows red.","An all-round light with a sector in which navigation is prohibited.","An all-round light with a sector in which anchoring is prohibited."]],"816":["The symbol on the nautical chart means:",["A mooring buoy.","A conical buoy.","A mooring spar.","A can (cylindrical) buoy."]],"817":["The symbol on the nautical chart means:",["A mooring buoy.","A conical spar.","A spar buoy.","A mooring spar."]],"818":["The symbol on the nautical chart means:",["A cylindrical spar.","Mooring buoys.","A can (cylindrical) buoy.","A spar buoy."]],"819":["The symbol on the nautical chart means:",["A west buoy, very quick flashing 3 flashes in 5 s or quick flashing 3 flashes in 10 s.","A north buoy, very quick 3 flashes in 5 s or quick flashing 3 flashes in 10 s.","A buoy marking an isolated danger.","An east buoy, very quick flashing 3 flashes in 5 s or quick flashing 3 flashes in 10 s."]],"820":["The symbol on the nautical chart means:",["A west buoy, very quick flashing 9 flashes in 10 s or quick flashing 9 flashes in 15 s.","A north buoy, very quick 9 flashes in 10 s or quick flashing 9 flashes in 15 s.","An east buoy, very quick flashing 25 flashes in 10 s or quick flashing 9 flashes in 15 s.","A buoy marking safe water."]],"821":["The symbol on the nautical chart means:",["A spar marking an isolated danger.","A spar marking safe water.","A north spar, flashing 2 times.","A spar marking a new danger, showing two red flashes."]],"822":["The symbol on the nautical chart means:",["A south buoy, very quick or quick flashing.","A buoy marking safe water, very quick or quick flashing.","A buoy marking an isolated danger.","A north buoy, very quick or quick flashing."]],"823":["The symbol on a Bulgarian nautical chart means:",["A submarine cable.","Rocks above water.","Underwater rocks.","A wreck."]],"824":["The symbol on a Bulgarian nautical chart means:",["A spar with dimensions.","A wreck with parts above the water.","An optical cable.","A navigational landmark with its given elevation above the water and the height of the structure."]],"825":["The abbreviation \"ПП\" on a Bulgarian nautical chart means:",["A light flashing continuously.","A partly sunken vessel.","Navigation with a pilot only.","Position approximate."]],"826":["The abbreviation \"ПС\" on a Bulgarian nautical chart means:",["A fixed light.","Position doubtful.","A recommended leading mark.","A permanent leading mark."]],"827":["The abbreviation \"Пр\" on a Bulgarian nautical chart means:",["A flashing light.","Approximate.","Navigation is recommended.","A fixed light."]],"828":["The abbreviation \"ЗТМ\" on a Bulgarian nautical chart means:",["A flashing light.","An occulting light.","A fixed light.","An occulting light during the daylight part of the day."]],"829":["The abbreviation \"П\" on a Bulgarian nautical chart means:",["A fixed light.","Approximate.","Navigation is recommended.","Recommended."]],"830":["The abbreviation \"Пр(2)\" on a Bulgarian nautical chart means:",["A flashing light.","A composite group flashing light.","A group flashing light.","A fixed light with two flashes."]],"831":["The abbreviation \"Т\" in the sea area of a Bulgarian nautical chart means:",["The position of a wreck.","Underwater stones.","Sand.","Mud."]],"832":["The abbreviation \"П\" in the sea area of a Bulgarian nautical chart means:",["A shoal.","A submerged wreck.","Sand.","An underwater obstruction."]],"833":["The abbreviation \"Р\" in the sea area of a Bulgarian nautical chart means:",["A habitat of rapa whelks.","Shells.","A usual place where fish gather.","A usual place where crabs gather."]],"834":["The abbreviation \"ТР\" in the sea area of a Bulgarian nautical chart means:",["Soft mud.","An underwater obstruction.","A temporary place where fish gather.","Mud and shells."]],"835":["The abbreviation \"РФ\" next to a navigation light on a Bulgarian nautical chart means:",["A passive radar reflector on a lighthouse.","An active radar reflector on a lighthouse.","A sector radio beacon.","A radio beacon."]],"836":["The abbreviation on a Bulgarian nautical chart means:",["A navigation mark flashing 3 times in 15 s, with a visibility range of 25 miles, sounding a fog signal of the letter \"н\" (N).","A lighthouse flashing 15 times in 3 s, with a visibility range of 25 metres.","A lighthouse occulting 3 times in 15 s, with a visibility range of 25 miles and a megaphone.","A lighthouse showing a fixed green light, visibility range 25 miles, sounding a fog signal of the letter \"н\" (N) with a megaphone."]],"837":["The symbol and abbreviations on a Bulgarian nautical chart mean:",["A west buoy, flashing 3 times in 10 s with a green light, fitted with a horn.","An east buoy, quick flashing 3 times in 10 s, white, fitted with a horn.","An east buoy, flashing 3 times in 10 s with a green light, fitted with a horn.","An east buoy, quick flashing through 10 s with a green light, fitted with a horn."]],"838":["The flag shown means:",["Flag \"A\": I am loading/discharging dangerous cargo.","Flag \"T\": Keep clear of me / do not pass ahead of me.","Flag \"B\": I am loading/discharging dangerous cargo.","Flag \"M\": I have a doctor on board."]],"839":["The flag shown means:",["Flag \"C\": Yes, affirmative.","Flag \"H\": I have a pilot on board.","Flag \"B\": I am loading/discharging dangerous cargo.","Flag \"U\": You are running into danger."]],"840":["The flag shown means:",["Flag \"A\": I am loading/discharging dangerous cargo.","Flag \"C\": Yes, affirmative.","Flag \"N\": No, negative.","Flag \"M\": I have a doctor on board."]],"841":["The flag shown means:",["Flag \"A\": I am loading/discharging dangerous cargo.","Flag \"H\": I have a pilot on board.","Flag \"N\": No, negative.","Flag \"G\": I require a pilot."]],"842":["The flag shown means:",["Flag \"Q\": My vessel is healthy and I request free pratique.","Flag \"H\": I have a pilot on board.","Flag \"C\": Yes, affirmative.","Flag \"V\": I require assistance."]],"843":["The flag shown means:",["Flag \"V\": I require assistance.","Flag \"M\": I have a doctor on board.","Flag \"Q\": My vessel is healthy and I request free pratique.","Flag \"G\": I require a pilot."]],"844":["The flag shown means:",["Flag \"C\": Yes, affirmative.","Flag \"M\": I have a doctor on board.","Flag \"B\": I am loading/discharging dangerous cargo.","Flag \"Q\": My vessel is healthy and I request free pratique."]],"845":["The flag shown means:",["Flag \"C\": Yes, affirmative.","Flag \"B\": I am loading/discharging dangerous cargo.","Flag \"U\": You are running into danger.","Flag \"O\": Man overboard."]],"846":["The flag shown means:",["Flag \"C\": Yes, affirmative.","Flag \"U\": You are running into danger.","Flag \"O\": Man overboard.","Flag \"B\": I am loading/discharging dangerous cargo."]],"847":["The flag shown means:",["Flag \"B\": I am loading/discharging dangerous cargo.","Flag \"U\": You are running into danger.","Flag \"V\": I require assistance.","Flag \"C\": Yes, affirmative."]],"848":["The flag shown means:",["Flag \"V\": I require assistance.","Flag \"O\": Man overboard.","Flag \"B\": I am loading/discharging dangerous cargo.","Flag \"C\": Yes, affirmative."]]},"expl":{"1":"The magnetic compass shows direction relative to the magnetic meridian. You steer the course by it and take bearings of landmarks with it. Distance and speed are measured with a log, depth with a lead or echo sounder.","2":"The magnetic compass works without electrical power, which is why every ship must have one. Other instruments supplement it but do not replace it.","3":"The liquid damps the swinging of the card and takes its weight off the pivot. A solution of alcohol in water is used because it does not freeze.","4":"Navigational warnings for the Bulgarian coast are broadcast on VHF channel 26. Channel 16 is only for distress, safety and calling.","5":"The weather and sea bulletin for the Bulgarian coast is broadcast on VHF channel 26. Channel 16 is for distress and calling; channel 70 is for digital selective calling.","6":"The times are 07.33, 13.33 and 19.33 and are given in UTC, not local time. Bulgarian local time is 2 hours ahead in winter and 3 hours ahead in summer. Question 653, about the same bulletin, gives only 07.33 and 19.33.","7":"A stem or sternpost is a member that continues the keel upwards. The stem forms the bow, the sternpost forms the stern.","8":"The bulwark is the continuation of the side plating above the main deck. It protects people and cargo from falling overboard and from being washed by seas.","9":"The main deck is the uppermost continuous deck from bow to stern. It closes the hull from above and is part of its strength.","10":"Guard rails are a railing of stanchions with wires or tubes along the edge of the deck. They are fitted where there is no bulwark.","11":"A porthole is a round or rectangular window in the side or superstructure that can be closed watertight.","12":"All openings on the main deck must close watertight so that water does not get into the hull in a seaway.","13":"The forecastle is the superstructure at the bow; the poop is the one at the stern. The specialist who directs the deck crew is the boatswain.","14":"The poop is the superstructure at the stern. The forecastle is the superstructure at the bow.","15":"Transverse watertight bulkheads divide the hull into compartments along its length. If one compartment floods, the others keep the ship afloat.","16":"A gangway is a portable bridge between ship and quay, a ladder is the ship's stairway. Climbing over the bulwark is dangerous and not allowed.","17":"Archimedes' principle: the ship sinks deeper, displaces more water, and the buoyant force grows until it equals the new weight.","18":"The metacentric height is the distance between the centre of gravity and the metacentre. It is the measure of the ship's initial stability.","19":"The centre of gravity moves towards the added weight. Cargo on deck is high up, so the centre rises and stability decreases.","20":"Cargo placed low near the keel lowers the centre of gravity. Cargo on deck, on the forecastle or on the poop raises it.","21":"Low cargo lowers the centre of gravity. The distance to the metacentre grows and the ship becomes more stable.","22":"Seated people keep the centre of gravity low, and a symmetrical spread causes no list. Standing people and crowding to one side are a common cause of boats capsizing.","23":"Passenger capacity is the number of passengers entered in the ship's documents. The crew is not counted in it.","24":"Under international rules a passenger ship is one that carries more than 12 passengers. Stricter safety requirements apply to it.","25":"Draught is the vertical distance from the lowest point of the keel to the waterline. It shows how deep the ship is immersed.","26":"In the official answer this is the ship's ability to keep its stability and sea-keeping qualities, that is, to remain fit to sail.","27":"More weight means more water displaced. The ship sinks deeper and the draught increases.","28":"Steerability combines two qualities: course stability and turning ability. It is the ship's ability to answer the helm.","29":"Turning ability is the ship's ability to change direction under the action of the rudder. The opposite quality is course stability.","30":"Manoeuvring characteristics describe how the ship moves and stops: speed, inertia, stopping distance and turning circle. The other answers are cargo and sea-keeping characteristics.","31":"After the engine stops, the ship keeps moving ahead by inertia. The heavier and faster it is, the longer the distance before it stops.","32":"The line is put on the bollard in figure-of-eight turns. Friction holds it, and unlike a knot it can be released quickly even under load.","33":"Fenders are hung between the side and the quay or another ship and absorb the knocks and friction.","34":"The heaving line is a thin line with a light weight at the end, usually a small sandbag. It is used to pass the mooring line. A metal weight is not allowed because it can injure someone.","35":"The steering gear consists of the rudder blade, the rudder stock (its shaft), the steering drive and the steering engine.","36":"Orange shows up best against the sea, which is why life-saving appliances are orange.","37":"A lifejacket must turn the wearer onto their back and keep the mouth above water, even if they are unconscious.","38":"The whistle and light help others hear and see you, and the retro-reflective tape shines in a searchlight beam.","39":"Life-saving appliances are marked with the ship's name and port of registry, so that if found it is clear which ship they came from.","40":"There is no time to search during an alarm. That is why lifejackets are kept in visible, easily reached and marked places.","41":"Lifebuoys are kept on the open decks at the sides so they can be thrown at once to a person in the water.","42":"Lifebuoys, like lifejackets, carry the ship's name and port of registry.","43":"The line lets you pull the person to the ship. The self-igniting light or smoke signal marks the lifebuoy's position by night and by day.","44":"A small wooden or plastic boat reflects radar poorly. A passive reflector makes it visible on other ships' radar.","45":"Channel 16 is the international VHF channel for distress, safety and calling. A continuous watch is kept on it.","46":"MAYDAY is the radiotelephone distress signal. It comes from the French \"m'aidez\" (\"help me\") and is said three times.","47":"Spars are the poles that carry the sails: masts, yards, booms, bowsprit. The ropes attached to them are called rigging.","48":"Masts are counted from bow to stern: foremast, mainmast, mizzen.","49":"A yard is a spar across the mast. The boom is the lower spar of a sail, the topmast extends the mast, the bowsprit projects ahead of the bow.","50":"The boom is a horizontal spar attached by one end to the mast. The lower edge (foot) of the sail is stretched along it.","51":"The bowsprit projects ahead of the stem and carries the head sails forward.","52":"When reefing, part of the sail is tied down and its working area is reduced. It is done when the wind strengthens.","53":"With slight sternway the chain is laid out along the bottom instead of piling up on the anchor, and the anchor digs in better.","54":"The windward anchor is let go. The wind pushes the ship away and the chain leads clear of the hull instead of passing under it.","55":"In deep water the anchor is lowered with the windlass to about 2/3 of the depth and only then let go. This way it does not gather speed and damage the chain and windlass.","56":"Scuppers are openings in the deck and bulwark through which water on deck drains overboard.","57":"The Bosphorus connects the Black Sea with the Sea of Marmara. The Dardanelles connect the Sea of Marmara with the Aegean, and the Kerch Strait connects the Sea of Azov with the Black Sea.","58":"In a third-degree burn the skin is destroyed in depth. The wound is covered with a sterile dressing against infection and medical help is sought. Nothing is smeared on and blisters are not burst.","59":"The requirement is that thermal protective aids work at air temperatures from -30 °C to +20 °C.","60":"The transverse metacentric height measures stability against heeling to one side. The larger it is, the harder it is for the ship to heel.","61":"An emergency can happen at any time, even alongside the quay. That is why life-saving appliances are always kept ready.","62":"List is an inclination to port or starboard. An inclination towards the bow or stern is called trim.","63":"Trim is the longitudinal inclination, towards the bow or the stern. The transverse inclination is list.","64":"Before a storm the ship is prepared: hatches and doors closed, everything loose secured, engine and life-saving appliances checked.","65":"In a storm the most important thing is to choose the course and speed at which the ship takes the waves most easily and stays manoeuvrable.","66":"The waves are met at a small angle on the bow, about 15–20°. Head-on the impacts are hardest, and beam-on there is a risk of capsizing.","67":"COLREG Rule 19: in restricted visibility a vessel proceeds at a safe speed, and if necessary reduces to the minimum or stops.","68":"In fog you do all of these: give fog signals, switch on the navigation lights and post extra lookouts.","69":"According to the official answer, a rising sea is a sign of nearby land. In shallow water the waves become higher and steeper.","70":"Stability is improved by lowering the centre of gravity, which increases the metacentric height.","71":"The turning circle is the curve described by the ship's centre of gravity when the rudder is held at a constant angle.","72":"The diameter of the turning circle is the distance between two opposite points of the curve in a full turn. It shows how much room the ship needs to turn round.","73":"An anemometer measures wind speed. From Greek: \"anemos\" means wind.","74":"The aneroid barometer measures atmospheric pressure with a metal capsule and no liquid. Falling pressure warns of worsening weather.","75":"The tiller is the lever fixed to the rudder stock. The rudder is turned with it by hand or through a drive.","76":"The afterpeak is the last compartment at the stern. The first compartment at the bow is called the forepeak.","77":"The sternpost is the after continuation of the keel. The stem is the forward one.","78":"On a broad reach the wind comes obliquely from behind, between the beam and the stern (about 95°–170° from the bow).","79":"Close-hauled, the wind comes from forward of the beam (up to about 85° from the bow).","80":"On a beam reach the wind blows across the boat, on the beam (about 90°).","81":"When running, the wind blows straight or nearly straight from astern.","82":"Shrouds are part of the standing rigging. They support the mast sideways, to both sides. Stays support it fore and aft.","83":"The tack is named after the side the wind comes from. Wind from the right is starboard tack, and the sails are then on the port side.","84":"The cockpit is an open well in the deck, usually aft, where the helmsman and crew sit.","85":"A squall is a sudden, short burst of strong wind, often with a sharp change of direction. It is dangerous because it comes without warning.","86":"Yawing is the ship's tendency to wander by itself now left, now right of its course. Such a ship is hard to keep on course.","87":"A sea anchor is a canvas cone streamed in the water on a line. It slows drift and holds the bow to the sea.","88":"Deadweight covers everything the ship can carry down to the load waterline: cargo, fuel, water, stores and crew.","89":"In the official answer, buoyancy is the ship's ability to float at a given draught with given people and cargo on board.","90":"The topmast is the upper extension of the mast.","91":"The jib boom extends the bowsprit forward. The topmast extends the mast upwards.","92":"Volume displacement is the volume of the underwater part of the hull, below the waterline. It is measured in cubic metres.","93":"Weight displacement is the weight of water displaced by the ship. By Archimedes' principle it equals the weight of the ship itself.","94":"In heavy seas a ship loses speed: the propeller comes out of the water, its thrust drops and the rudder works worse. Speed cannot increase, so this is the false statement.","95":"A halyard hoists and lowers the sail. A sheet trims it.","96":"With the sheets the sail is hauled in or eased out according to the wind. Hoisting is done with a halyard.","97":"For a person overboard you throw a lifebuoy, stop the propeller, keep the person in sight all the time and manoeuvre towards them. No \"emergency lights\" are hoisted.","98":"When fuelling, smoking is prohibited, a fire extinguisher is provided and a responsible person is present. Sand is not required.","99":"A holed ship is abandoned only if it cannot be saved. First the alarm is raised, the hole is plugged and the water is pumped out.","100":"Work over the side needs lifejackets, a lifebuoy nearby and a boat if available. A diving apparatus is not required.","101":"You get under way only after the towline is made fast. Otherwise the line can tear loose, injure people or foul the propeller.","102":"In strong wind turns are made at slow speed. Turning at high speed makes the ship heel heavily and can capsize it.","103":"Water conducts electricity, so it is not used. Carbon dioxide does not conduct electricity and does not damage the equipment.","104":"A coaming is the raised vertical edge around a hatch or door. It stops water on deck from getting inside.","105":"Sailing on parallel courses is normal and safe if enough distance is kept. The other actions endanger people and vessels.","106":"The description of the bowline is the wrong one; other knots are used to secure a boat for towing. The descriptions of the reef knot, the slipped reef and the sheet bend are correct.","107":"Scuppers drain water from the deck overboard. They have nothing to do with unsinkability, which is provided by bulkheads, compartments and reserve buoyancy.","108":"In a storm the anchors are not lowered while under way. You choose a course and speed, close everything up and rig extra lifelines.","109":"The rudder is put towards the side the person fell from. This swings the stern and propeller away from them.","110":"Local signs are observed with the naked eye, without instruments: sky, clouds, wind, the behaviour of birds. Phenomena observed with special equipment are not local signs.","111":"The anchor holds by its weight and shape, and the chain must lie along the bottom. The length of chain and the type of bottom also matter.","112":"The bell is used to signal when weighing anchor, for fog signals at anchor and as a distress signal. That is why the \"all of these\" answer is correct.","113":"The bolt rope is the rope sewn along the edge of the sail. The leech or luff is the edge itself.","114":"A collision mat is a heavy canvas with lines. It is drawn over the hole from outside, and water pressure presses it against the hull.","115":"A ship rolls about its longitudinal axis, pitches about its transverse axis and heaves up and down. All three are correct.","116":"A moored ship is passed slowly. Passing fast, your wash and suction strain and break its mooring lines.","117":"When water comes in you do all of these: raise the alarm, plug the hole and pump.","118":"In a fire you raise the alarm, start fighting it, and bring out the injured and give them first aid. All the actions are correct.","119":"The correct order also includes checking that nobody is left behind and taking the ship's documents before the boats move away from the ship.","120":"The full sequence is: lifebuoy, report to the officer of the watch, manoeuvre the ship, \"man overboard\" alarm, lower the boat, recovery and first aid. The other answers leave out the manoeuvre or the alarm.","121":"A pressure gauge measures pressure, for example of the oil or cooling water. Temperature is measured with a thermometer, density with a hydrometer, voltage with a voltmeter.","122":"According to the official answer, a water jet gives better acceleration. It draws in water and expels it astern as a jet. It has no exposed propeller and suits shallow water.","123":"A diesel draws only air into the cylinder. The fuel is injected at the end of compression, so the mixture forms inside the cylinder itself.","124":"The petrol mixture is ignited by force, with a spark from the plug. In a diesel the fuel ignites by itself in the hot compressed air.","125":"The four strokes are intake, compression, power and exhaust. Each stroke is half a revolution, so two crankshaft revolutions in all.","126":"In a two-stroke engine the whole working cycle takes two piston strokes, that is, one crankshaft revolution.","127":"The injector sprays the fuel into the cylinder as a fine mist so that it mixes well with the air and burns completely. The pressure is created by the fuel pump.","128":"A four-stroke engine has intake and exhaust valves, and the camshaft opens and closes them. All three are correct.","129":"Main and big-end bearings are plain bearings, with a thin film of oil under pressure between the shaft and the shells. They carry heavy shock loads.","130":"The main bearings carry the crankshaft in the engine block (frame). The big-end bearings are between the connecting rod and the crankshaft.","131":"A diesel fuel system takes fuel from the tank with a pump, through pipes, to the injectors. Rotor arm, distributor and condenser are parts of a petrol engine's ignition.","132":"The oil pump draws oil from the sump, the filter cleans it, and the pipes and passages carry it to the bearings.","133":"Black smoke is unburned fuel (soot). The cause is lack of air, for example a dirty air filter, or overloading the engine.","134":"Water forms an emulsion with the oil. The oil loses its lubricating properties and the bearings wear quickly.","135":"The oil coats the walls of the cooling passages and acts as insulation. The engine sheds heat less easily and overheats.","136":"A charged lead-acid battery \"boils\" (gives off gas), the electrolyte density is about 1.28, and the voltage stops rising. All three signs are correct.","137":"The cams on the camshaft open and close the valves at the right moment. The camshaft turns at half the speed of the crankshaft.","138":"A diesel needs a high-pressure pump to inject fuel into the compressed air. Carburettor engines work with a low-pressure pump.","139":"A cold engine is loaded gradually. The oil is still thick and the parts have not expanded evenly, so sudden load speeds up wear.","140":"Water and foam conduct electricity. An electrical fire is fought with a powder or carbon dioxide (CO₂) extinguisher, after cutting the power if possible.","141":"The carburettor mixes petrol with air before the cylinder. A diesel has no carburettor; it has injectors.","142":"Without oil pressure the bearings run dry and the engine seizes within seconds. The engine is stopped at once, and only then is the cause sought.","143":"Discharging oil and petroleum products into the sea is prohibited. Used oil and oily water are delivered ashore.","144":"An extinguisher must be in a visible, accessible place so you can grab it at once. Locked in a locker it is useless.","145":"Preparation includes warming the water and oil and turning the engine over so the parts are lubricated before starting. All are correct.","146":"When working on electrical installations you cut the power and put up a sign, stand on a dielectric mat and use insulated tools.","147":"Alignment brings the axes of the engine, propeller shaft and propeller into one line. Misalignment causes vibration and destroys bearings and seals.","148":"A gear pump works well with viscous, lubricating liquids such as oils and fuels. That is why it is used in oil and fuel systems.","149":"The milky colour is an emulsion of oil and water. The usual causes are a damaged head gasket or a leaking oil cooler.","150":"A clogged filter restricts the flow. Pressure before it rises, pressure after it falls, and the difference between the two gauges grows.","151":"Air compressed by the turbocharger is hot. The intercooler cools it so it becomes denser, which means more oxygen enters the cylinder.","152":"Exhaust valves run at a much higher temperature and are made of a different, heat-resistant steel. That is why valves are not swapped.","153":"If the cooling passages in the head are blocked, it overheats in places. The uneven heating creates stresses and the head cracks.","154":"When overheating, the oil film on the cylinder walls burns off and the piston rubs dry. That scores the liner.","155":"The end of filling is the most dangerous moment. That is when a tank overflows and fuel comes out through the vent or the filler.","156":"Oil sludge is never discharged into the sea. It is collected on board and delivered ashore in port.","157":"Pumps and injectors have very fine clearances. Dirt and water in the fuel wear and clog them.","158":"An engine works well within a certain temperature range. The cooling system does not just remove heat; it keeps that temperature.","159":"The interval depends on the engine model. Follow the manufacturer's instructions in the manual.","160":"A fuse is replaced only with the one specified for the circuit. A stronger fuse will not protect it and the cables can catch fire. If it blows often, look for the fault.","161":"Near the end of charging the battery no longer takes all the current. The excess splits water into hydrogen and oxygen and heats the battery, so the current is reduced.","162":"Maintenance includes clean terminals, grease against corrosion, and slow, full charging. All three are correct.","163":"An alcohol thermometer is used. If a mercury thermometer breaks, the mercury gets into the electrolyte and damages the battery.","164":"Idle machines do not warm up, and their insulation absorbs moisture from the salt air. The insulation weakens and breaks down when started.","165":"Charging gives off hydrogen and oxygen. The mixture is explosive, so the room is ventilated and nobody smokes there.","166":"The flow is reduced before the tank is full. That way filling is stopped in time and fuel does not overflow.","167":"Cavitation is the forming and violent collapse of vapour bubbles on the blades. They knock particles out of the metal and leave pits.","168":"New belts stretch and must be re-tensioned. An over-tight belt loads the bearings, a slack one slips and wears. All statements are correct.","169":"The holding-down bolts fix the engine to its bed. If they are loose, the engine vibrates and its alignment with the shaft is lost.","170":"The thermostat (thermostatic valve) should keep the water in the small circuit until the engine warms up. If it sticks open, the water stays cold.","171":"Right after starting you check the oil pressure. If there is none, the engine is stopped immediately.","172":"Before starting you check the fuel, the coolant and the oil in the engine and the gearbox. All are correct.","173":"According to the official answer, an alkaline battery is topped up with a dilute alkaline solution. Acid is never put into an alkaline battery.","174":"The electrolyte of alkaline batteries is a potassium hydroxide (KOH) solution. In lead-acid batteries it is dilute sulphuric acid.","175":"Separators are insulating sheets between the positive and negative plates. They prevent short circuits but let the electrolyte through.","176":"Cape Emine divides the coast into two areas. The Maritime Administration Directorate in Varna covers the area north of it, up to the border with Romania.","177":"Pollution of the sea carries the heaviest fines. Remember the range from the official answer: 150,000 to 500,000 leva.","178":"According to the official answer, manoeuvres stop when visibility is below 300 m in Burgas and below 500 m in Varna. Remember that the larger number is for Varna.","179":"A fairway is a route for ships. That is why no sailing, fishing or setting of nets and gear is allowed there.","180":"Small vessels may use the fairway, but must not impede ships that can navigate only within it.","181":"Every master who notices a change in the navigational situation or a dangerous floating object must report it. That is why all the answers are correct.","182":"According to the official answer, search and rescue is directed by the Chief Directorate \"Emergency Rescue Activities\", both north and south of Cape Emine.","183":"The answer is the same as for the area north of Cape Emine: the Chief Directorate \"Emergency Rescue Activities\".","184":"Plastic does not break down and is dangerous to marine life. Throwing it into the sea is prohibited everywhere under MARPOL Annex V.","185":"The search starts from the ship's last known position. A group is easier to spot and people help each other, so the crew stays together.","186":"The Black Sea is a special area under MARPOL Annex V. Glass and other solid waste are not thrown overboard but delivered to a port.","187":"For not following Traffic Control's instructions the fine is 1,000 to 2,500 leva, the same as for anchorages.","188":"For breaking the anchorage rules the fine is 1,000 to 2,500 leva, the same as for Traffic Control's instructions.","189":"For radio communication offences the fine is 500 to 5,000 leva, the same as for fire safety.","190":"For fire safety offences the fine is 500 to 5,000 leva, the same as for radio communication.","191":"For breaking the rules on preventing pollution of the sea the fine is 10,000 to 50,000 leva. It is many times higher than the others in this group.","192":"This is the general penalty for breaching the ordinances under the KTK when no other penalty applies: 400 to 2,000 leva.","193":"For not complying with a lawful order of the Maritime Administration the fine is 10 to 250 leva. This is the lowest range in this group of questions.","194":"The general fine for breaching provisions of the KTK is 20 to 500 leva.","195":"Under the KTK, merchant shipping covers any use of ships for transport, maritime services and other economic activities, not only navigation or ports.","196":"The KTK treats any self-propelled or non-self-propelled floating unit as a ship, including those for salvaging sunken property.","197":"The KTK does not apply to military transport, to sports craft during a race, or to border control vessels. All are correct.","198":"Cabotage is carriage between Bulgarian ports. It is allowed for ships under the Bulgarian flag and under the flag of an EU member state.","199":"A ship is Bulgarian if it is owned by the state or a Bulgarian person, or more than half of it is owned by them. It is decided by ownership.","200":"A ship is identified by name or number, nationality, port of registry and gross and net tonnage. Dimensions and type only describe it.","201":"The port of registry is written on the stern or on the sides near the stern, under the ship's name.","202":"The port of registry is chosen by the ship's owner.","203":"In Bulgarian legislation a small vessel is one up to 40 GT. This is also where the name of the certificate comes from.","204":"The certificate of registration proves ownership and nationality of a small vessel. The control coupon proves its technical fitness.","205":"A ship bought abroad sails to the first Bulgarian port with a provisional certificate for sailing under the Bulgarian flag.","206":"A ship cannot be entered in two registers at the same time. It must first be deleted from the foreign register.","207":"The deadline for applying for registration is 6 weeks from the ship's first arrival at a Bulgarian port.","208":"Ships are measured (their tonnage determined) by the Maritime Administration Executive Agency.","209":"Fitness is established by surveying the ship itself. Documents or a declaration by the owner are not enough.","210":"The right to fly the Bulgarian flag comes from being entered in the register. For a small vessel it is proved by the certificate of registration.","211":"The certificate of registration is issued by the Executive Director of the Maritime Administration.","212":"For small sea-going vessels the certificate is issued by the Maritime Administration Directorates in Varna and Burgas.","213":"For small river vessels the certificate is issued by the Maritime Administration Directorates in Ruse and Lom.","214":"The types of ship's documents are laid down in Ordinance No. 5 on ship's documents.","215":"The master bears full responsibility for the command, safety and order of the ship.","216":"After the people, the master must try to save the logbook, the voyage charts, the documents and the valuables. They are needed to investigate the casualty.","217":"State supervision of the safety of navigation is exercised by the Maritime Administration Executive Agency.","218":"The ship's documents are kept on board so they can be shown at any inspection.","219":"A small vessel not used commercially does not have to keep a logbook when it sails within 5 miles of the shore.","220":"The logbook records in time order everything that happens to the ship and crew: courses, times, manoeuvres, incidents.","221":"Seafarers' certificates are governed by Ordinance No. 6 on the competence of seafarers. Ordinance No. 5 is on ship's documents.","222":"The \"Skipper of a vessel up to 40 GT\" certificate requires the age of 18.","223":"For \"Skipper of a vessel up to 40 GT at sea\", basic education is enough.","224":"The certificate entitles you to be master of a vessel up to 40 GT with up to 12 persons on board, the crew included.","225":"The territorial sea is the 12-nautical-mile belt measured from the baselines. Internal sea waters lie on the landward side of those lines.","226":"The territorial sea is 12 nautical miles wide, measured from the baselines.","227":"The contiguous zone extends to 24 nautical miles from the baselines, that is, a further 12 miles beyond
